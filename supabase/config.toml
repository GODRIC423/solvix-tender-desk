# Supabase CLI project config for Solvix Tender Desk.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "solvix-tender-desk"

[api]
enabled = true
port = 54321
# `extensions` is on the search path so pg_trgm operator classes resolve for PostgREST.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
schema_paths = []

[db.seed]
enabled = true
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local-only mail catcher for invite emails.
[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"
# NOTE: the `tender-uploads` bucket is created by migration 20260101000000_initial_schema.sql
# (private). It is deliberately NOT declared here so there is a single source of truth.

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Admin-invite-only: dispatchers are invited from the Supabase dashboard / admin API.
# There is no self-serve signup, and no RLS policy grants a stranger a profile row.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# The standalone connector authenticates with a scoped `x-ingest-token`, which the
# gateway's JWT check would reject before our handler ever runs. Auth is enforced
# inside the function instead (user JWT *or* scoped token).
[functions.ingest-load]
enabled = true
verify_jwt = false
