/* ══════════════════════════════════════════════════════════════
   11. RENDER AND NAVIGATE
   ══════════════════════════════════════════════════════════════ */
function buildLanes(){
  var now = today();
  lanes = S.kids.map(function(k){
    var a = ageOn(k.dob, now);
    return { id:k.id, name:k.name, tag:(a === null ? "" : a + " years old"),
             felt:k.felt || FELTS[0], leaves:kidLeaves(k, now) };
  });
  lanes.push({ id:"desk", name:S.house, tag:"The parents' desk", felt:DESK_FELT,
               leaves:deskLeaves(now) });
}
function render(keepKey){
  var act = document.activeElement;
  var fk = act && act.dataset ? act.dataset.k : null;
  var selA = null, selB = null;
  try { if(act && act.selectionStart !== undefined && act.type !== "date" && act.type !== "number"){
    selA = act.selectionStart; selB = act.selectionEnd; } } catch(e){}

  buildLanes();
  if(nav.lane >= lanes.length) nav.lane = lanes.length - 1;
  if(nav.lane < 0) nav.lane = 0;
  var lane = lanes[nav.lane];
  if(keepKey){
    var at = -1;
    lane.leaves.forEach(function(l, i){ if(l.key === keepKey) at = i; });
    if(at >= 0) nav.idx = at;
  }
  if(nav.idx >= lane.leaves.length) nav.idx = lane.leaves.length - 1;
  if(nav.idx < 0) nav.idx = 0;

  felt.style.background = lane.felt;
  document.documentElement.style.setProperty("--felt-deep", lane.felt);
  var tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute("content", lane.felt);
  var mark = document.getElementById("samplemark");
  if(mark) mark.hidden = !S.sample;

  stage.innerHTML = lane.leaves.map(function(l, i){
    return shell(l, lane, i, lane.leaves.length);
  }).join("");
  place();

  if(fk){
    var back = stage.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(fk) : fk) + '"]');
    if(back){
      try {
        back.focus({ preventScroll:true });
        if(selA !== null && back.setSelectionRange) back.setSelectionRange(selA, selB);
      } catch(e){}
    }
  }
}
function place(){
  var kids = stage.children, lane = lanes[nav.lane];
  for(var i = 0; i < kids.length; i++){
    var el = kids[i], off = i - nav.idx, a = Math.abs(off);
    var far = a === 0 ? 0 : (a === 1 ? 1 : 2);
    el.style.transform = "translateX(" + (off * 93) + "%) scale(" + (a === 0 ? 1 : 0.88) + ")";
    el.style.opacity = a === 0 ? "1" : (a === 1 ? "0.26" : "0");
    el.style.zIndex = String(50 - a);
    el.dataset.far = String(far);
    el.setAttribute("aria-hidden", a === 0 ? "false" : "true");
    try { el.inert = a !== 0; } catch(e){}
  }
  var pct = lane.leaves.length > 1 ? ((nav.idx + 1) / lane.leaves.length) * 100 : 100;
  hair.style.width = pct.toFixed(2) + "%";
  hair.style.background = "var(--coin)";
  document.getElementById("paddleBack").hidden = nav.idx === 0;
  document.getElementById("paddleFwd").hidden = nav.idx >= lane.leaves.length - 1;
}
function goCard(d){
  var n = nav.idx + d, max = lanes[nav.lane].leaves.length - 1;
  nav.idx = Math.max(0, Math.min(max, n));
  place();
}
function goLane(d){
  var n = nav.lane + d;
  if(n < 0) n = lanes.length - 1;
  if(n >= lanes.length) n = 0;
  nav.lane = n; nav.idx = 0;
  render();
  stage.classList.remove("jump-up","jump-down");
  void stage.offsetWidth;
  stage.classList.add(d > 0 ? "jump-down" : "jump-up");
}
/* ══════════════════════════════════════════════════════════════
   12. DOING THINGS
   ══════════════════════════════════════════════════════════════ */
function coinFly(fromEl){
  if(!fromEl || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var r = fromEl.getBoundingClientRect();
  var c = document.createElement("i");
  c.className = "coin-fly";
  c.style.left = (r.left + r.width/2 - 13) + "px";
  c.style.top = (r.top + r.height/2 - 13) + "px";
  document.body.appendChild(c);
  requestAnimationFrame(function(){
    c.style.transform = "translate(" + (window.innerWidth/2 - r.left - r.width/2) + "px," +
      (-r.top + 120) + "px) scale(.4)";
    c.style.opacity = "0";
  });
  setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); }, 700);
}
function num(v, dflt){
  var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : (dflt === undefined ? 0 : dflt);
}
function findCard(id){
  for(var i=0;i<S.cards.length;i++) if(S.cards[i].id === id) return S.cards[i];
  return null;
}
function commit(keepKey){ save(); render(keepKey); }

function approveCard(c, btn){
  var k = kidById(c.kid); if(!k) return;
  var now = today();
  var res = payout(k, c.value, c.title, now, "earn", c.screen);
  c.state = "paid"; c.markedOn = c.markedOn || now; c.note = null;
  coinFly(btn);
  var msg = k.name + ": " + usd(res.split.save) + " to save, " + usd(res.split.spend) +
    " to spend, " + usd(res.split.give) + " to give";
  if(res.match > 0) msg += ", plus " + usd(res.match) + " matched";
  toast(msg + ".");
}

document.addEventListener("click", function(ev){
  var b = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!b) return;
  var a = b.dataset.act, id = b.dataset.id, kid = b.dataset.kid, now = today();
  var k = kid ? kidById(kid) : null;

  if(a === "lane"){ goLane(num(b.dataset.d, 1)); return; }
  if(a === "turn"){
    var dd = num(b.dataset.d, 1);
    if(dd === 0){ nav.idx = 0; place(); } else goCard(dd);
    return;
  }

  if(a === "done"){
    var c = findCard(id); if(!c) return;
    c.state = "done"; c.markedOn = now; c.note = null;
    toast("Marked done. A parent has to approve it before any money moves.");
    commit(); return;
  }
  if(a === "later"){
    var c2 = findCard(id); if(!c2) return;
    c2.state = "todo"; c2.markedOn = null;
    toast("Left for later.");
    commit(); return;
  }
  if(a === "approve"){
    var c3 = findCard(id); if(!c3) return;
    approveCard(c3, b); commit("queue"); return;
  }
  if(a === "backopen"){
    hold["reason:" + id] = hold["reason:" + id] === "open" ? "" : "open";
    render("queue"); return;
  }
  if(a === "back"){
    var c4 = findCard(id); if(!c4) return;
    c4.state = "back"; c4.note = b.dataset.r || "Not finished properly"; c4.markedOn = null;
    hold["reason:" + id] = "";
    toast("Sent back: " + c4.note);
    commit("queue"); return;
  }
  if(a === "addgoal"){
    if(!k) return;
    var t = String(held("goaltitle", kid)).trim(), p = r2(num(held("goalprice", kid), 0));
    if(!t || p <= 0){ toast("A goal needs a name and a price."); return; }
    k.goals.push({ id:uid("g"), title:t.slice(0,60), price:p });
    hold["goaltitle:" + kid] = ""; hold["goalprice:" + kid] = "";
    toast("Goal added.");
    commit("goal"); return;
  }
  if(a === "delgoal"){
    if(!k) return;
    k.goals = k.goals.filter(function(g){ return g.id !== id; });
    commit("goal"); return;
  }
  if(a === "preset"){
    hold["inwhat:" + kid] = b.dataset.t;
    var box = stage.querySelector('[data-hold="inwhat"][data-kid="' + kid + '"]');
    if(box) { box.value = b.dataset.t; box.focus(); }
    stage.querySelectorAll('[data-act="preset"][data-kid="' + kid + '"]').forEach(function(x){
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    return;
  }
  if(a === "income"){
    if(!k) return;
    var what = String(held("inwhat", kid)).trim() || "Money in";
    var amt = r2(num(held("inamt", kid), 0));
    var on = held("indate", kid) || now;
    if(!dParse(on)) on = now;
    if(amt <= 0){ toast("Put in an amount first."); return; }
    if(b.dataset.split === "1"){
      var res2 = payout(k, amt, what, on, "gift", 0);
      toast(usd(amt) + " in — " + usd(res2.split.save) + " save, " + usd(res2.split.spend) +
        " spend, " + usd(res2.split.give) + " give" +
        (res2.match > 0 ? ", plus " + usd(res2.match) + " matched" : "") + ".");
    } else {
      pushEntry({ kid:kid, on:on, pot:"spend", kind:"gift", what:what, amt:amt });
      toast(usd(amt) + " straight into spend.");
    }
    hold["inwhat:" + kid] = ""; hold["inamt:" + kid] = "";
    runBankAll();
    commit("in"); return;
  }
  if(a === "spendout"){
    if(!k) return;
    var w2 = String(held("outwhat", kid)).trim() || "Money out";
    var am2 = r2(num(held("outamt", kid), 0));
    var pot = held("outpot", kid) || "spend";
    if(am2 <= 0){ toast("Put in an amount first."); return; }
    pushEntry({ kid:kid, on:now, pot:pot, kind: pot === "give" ? "give" : "spend",
      what:w2, amt:-am2 });
    hold["outwhat:" + kid] = ""; hold["outamt:" + kid] = "";
    toast(usd(am2) + " out of " + POTNAME[pot].toLowerCase() + ".");
    commit("out"); return;
  }
  if(a === "perk"){
    if(!k) return;
    var p2 = null;
    S.perks.forEach(function(x){ if(x.id === id) p2 = x; });
    if(!p2) return;
    if(potAt(kid, "screen") < p2.cost){ toast("Not enough screen time banked."); return; }
    pushEntry({ kid:kid, on:now, pot:"screen", kind:"perk", what:p2.title, amt:-p2.cost });
    toast(p2.title + " — " + mins(p2.cost) + " spent.");
    commit("out"); return;
  }
  if(a === "loanextra"){
    var l = null;
    S.loans.forEach(function(x){ if(x.id === id) l = x; });
    if(!l) return;
    var ex = r2(num(held("extra", l.kid), 0));
    var bal = loanBalance(l.id);
    if(ex <= 0){ toast("Put in an amount first."); return; }
    var pay = r2(Math.min(ex, bal));
    var sp3 = potAt(l.kid, "spend"), sv3 = potAt(l.kid, "save");
    if(r2(Math.max(0,sp3) + Math.max(0,sv3)) < pay){ toast("There isn't that much in the pots."); return; }
    var fa = r2(Math.min(pay, Math.max(0, sp3))), fb = r2(pay - fa);
    if(fa > 0) pushEntry({kid:l.kid,on:now,pot:"spend",kind:"repay",
      what:"Extra loan repayment — " + l.title, amt:-fa});
    if(fb > 0) pushEntry({kid:l.kid,on:now,pot:"save",kind:"repay",
      what:"Extra loan repayment (from save) — " + l.title, amt:-fb});
    S.loanEvents.push({ id:uid("v"), loan:l.id, on:now, kind:"pay", amt:pay, key:uid("xk") });
    if(loanBalance(l.id) <= 0.004) l.closed = now;
    hold["extra:" + l.kid] = "";
    toast(usd(pay) + " off the loan. " + usd(Math.max(0, loanBalance(l.id))) + " still owed.");
    commit("loan:" + l.id); return;
  }
  if(a === "addkid"){
    var nm = String(held("kidname", "new")).trim();
    var db = held("kiddob", "new");
    if(!nm){ toast("They need a name."); return; }
    if(!dParse(db)){ toast("A date of birth keeps the age bands honest."); return; }
    S.kids.push({ id:uid("k"), name:nm.slice(0,28), dob:db, felt:FELTS[S.kids.length % FELTS.length],
      split:{save:30,give:10,spend:60}, rate:4, period:"week", match:{pct:0,cap:0}, goals:[] });
    hold["kidname:new"] = ""; hold["kiddob:new"] = "";
    toast(nm + " added. Their lane is above the desk.");
    commit("people"); return;
  }
  if(a === "delkid"){
    S.kids = S.kids.filter(function(x){ return x.id !== kid; });
    S.chores = S.chores.filter(function(x){ return x.kid !== kid; });
    S.cards = S.cards.filter(function(x){ return x.kid !== kid; });
    S.entries = S.entries.filter(function(x){ return x.kid !== kid; });
    S.loans = S.loans.filter(function(x){ return x.kid !== kid; });
    S.commits = (S.commits||[]).filter(function(x){ return x.kid !== kid; });
    if(nav.lane >= S.kids.length) nav.lane = S.kids.length;
    toast("Removed, along with their ledger.");
    commit("people"); return;
  }
  if(a === "addchore" || a === "addlib"){
    var ck, ct, cvv, cs, cday, clo, chi;
    if(a === "addlib"){
      var item = null;
      LIB.forEach(function(x){ if(x.t === b.dataset.t) item = x; });
      if(!item || !k) return;
      ck = kid; ct = item.t; cvv = item.v; cs = item.s; cday = 6; clo = item.lo; chi = item.hi;
    } else {
      ck = held("chkid", "new") || (S.kids[0] && S.kids[0].id);
      ct = String(held("chtitle", "new")).trim();
      cvv = r2(num(held("chval", "new"), 0));
      cs = Math.round(num(held("chscr", "new"), 0));
      cday = Math.round(num(held("chday", "new"), 6));
      clo = Math.round(num(held("chlo", "new"), 5));
      chi = Math.round(num(held("chhi", "new"), 18));
      if(!ck){ toast("Add a child first."); return; }
      if(!ct){ toast("The chore needs a name."); return; }
      if(chi < clo){ var sw = clo; clo = chi; chi = sw; }
    }
    S.chores.push({ id:uid("c"), kid:ck, title:ct.slice(0,64), value:Math.max(0,cvv),
      screen:Math.max(0,cs), cadence:"weekly", day:Math.max(0,Math.min(6,cday)),
      bandLo:Math.max(2,Math.min(19,clo)), bandHi:Math.max(2,Math.min(21,chi)),
      since:now, fresh:now, retired:null, why:null });
    ["chtitle","chval","chscr"].forEach(function(x){ hold[x + ":new"] = ""; });
    dealWeek(now);
    toast("Added. It is in the deck from this week.");
    commit("chores"); return;
  }
  if(a === "retire" || a === "unretire" || a === "rotate"){
    var ch = choreById(id); if(!ch) return;
    if(a === "retire"){ ch.retired = now; ch.why = "parent"; toast("Retired."); }
    if(a === "unretire"){ ch.retired = null; ch.why = null; ch.fresh = now; dealWeek(now); toast("Back on the list."); }
    if(a === "rotate"){ ch.fresh = now; toast("Marked fresh. Six more weeks before it goes stale."); }
    commit("chores"); return;
  }
  if(a === "addperk"){
    var pt = String(held("pktitle", "new")).trim(), pc = Math.round(num(held("pkcost", "new"), 0));
    if(!pt || pc <= 0){ toast("A privilege needs a name and a cost in minutes."); return; }
    S.perks.push({ id:uid("p"), title:pt.slice(0,70), cost:pc });
    hold["pktitle:new"] = ""; hold["pkcost:new"] = "";
    commit("perks"); return;
  }
  if(a === "delperk"){
    S.perks = S.perks.filter(function(x){ return x.id !== id; });
    commit("perks"); return;
  }
  if(a === "delcommit"){
    S.commits = (S.commits||[]).filter(function(x){ return x.id !== id; });
    toast("Stopped. Past deductions stay in the ledger.");
    commit("perks"); return;
  }
  if(a === "print"){ printFor([kid]); return; }
  if(a === "printall"){ printFor(S.kids.map(function(x){ return x.id; })); return; }
  if(a === "csv"){ downloadCsv([kid]); return; }
  if(a === "csvall"){ downloadCsv(S.kids.map(function(x){ return x.id; })); return; }
  if(a === "json"){ downloadJson(); return; }
  if(a === "import"){ document.getElementById("picker").click(); return; }
  if(a === "clear"){
    S = blank(); S.sample = false; S.house = "Our house";
    nav = { lane:0, idx:0 };
    toast("Cleared. Add your first child on the desk.");
    commit(); return;
  }
  if(a === "resample"){
    S = buildSample(); dealWeek(today());
    nav = { lane:0, idx:0 };
    toast("Sample family loaded.");
    commit(); return;
  }
});

/* live inputs: recompute on every keystroke */
document.addEventListener("input", function(ev){
  var t = ev.target;
  if(!t || !t.dataset) return;
  if(t.dataset.hold){
    hold[t.dataset.hold + ":" + (t.dataset.kid || "new")] = t.value;
    return;
  }
  var live = t.dataset.live;
  if(!live) return;
  var k = kidById(t.dataset.kid);
  if(!k) return;
  var key = lanes[nav.lane].leaves[nav.idx] ? lanes[nav.lane].leaves[nav.idx].key : null;
  if(live === "rate"){ k.rate = Math.max(0, Math.min(50, num(t.value, 0))); runBankAll(); }
  else if(live === "period"){ k.period = PERIODS[t.value] ? t.value : "week"; runBankAll(); }
  else if(live === "matchpct"){ k.match.pct = Math.max(0, Math.min(200, num(t.value, 0))); }
  else if(live === "matchcap"){ k.match.cap = Math.max(0, r2(num(t.value, 0))); }
  else if(live === "save" || live === "give"){
    var sv = live === "save" ? Math.max(0, Math.min(100, Math.round(num(t.value, 0)))) : k.split.save;
    var gv = live === "give" ? Math.max(0, Math.min(100, Math.round(num(t.value, 0)))) : k.split.give;
    if(sv + gv > 100){ if(live === "save") gv = 100 - sv; else sv = 100 - gv; }
    k.split.save = sv; k.split.give = gv; k.split.spend = 100 - sv - gv;
  }
  else if(live === "goalprice"){
    k.goals.forEach(function(g){ if(g.id === t.dataset.id) g.price = Math.max(0, r2(num(t.value, 0))); });
  }
  save();
  render(key);
});
document.addEventListener("change", function(ev){
  var t = ev.target;
  if(t && t.dataset && t.dataset.hold) hold[t.dataset.hold + ":" + (t.dataset.kid || "new")] = t.value;
});

function runBankAll(){ runBank(today()); }

/* ── keyboard: the signature interaction has to work without a mouse ── */
document.addEventListener("keydown", function(ev){
  var t = ev.target;
  var typing = t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA");
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(ev.key === "ArrowRight" && !typing){ ev.preventDefault(); goCard(1); }
  else if(ev.key === "ArrowLeft" && !typing){ ev.preventDefault(); goCard(-1); }
  else if(ev.key === "ArrowDown" && !typing){ ev.preventDefault(); goLane(1); }
  else if(ev.key === "ArrowUp" && !typing){ ev.preventDefault(); goLane(-1); }
  else if(ev.key === "Home" && !typing){ ev.preventDefault(); nav.idx = 0; place(); }
  else if(ev.key === "End" && !typing){ ev.preventDefault(); nav.idx = lanes[nav.lane].leaves.length - 1; place(); }
});
document.getElementById("paddleBack").addEventListener("click", function(){ goCard(-1); });
document.getElementById("paddleFwd").addEventListener("click", function(){ goCard(1); });

/* ── swipe ────────────────────────────────────────────────── */
(function(){
  var x0 = null, y0 = null, on = false;
  stage.addEventListener("pointerdown", function(e){
    if(e.target.closest("input,select,button,a")) return;
    x0 = e.clientX; y0 = e.clientY; on = true;
  });
  stage.addEventListener("pointerup", function(e){
    if(!on) return; on = false;
    var dx = e.clientX - x0, dy = e.clientY - y0;
    if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 46) goCard(dx < 0 ? 1 : -1);
    else if(Math.abs(dy) > 60) goLane(dy < 0 ? 1 : -1);
  });
  stage.addEventListener("pointercancel", function(){ on = false; });
})();

/* ══════════════════════════════════════════════════════════════
   13. TAKING IT WITH YOU
   ══════════════════════════════════════════════════════════════ */
function csvCell(v){
  var s = String(v == null ? "" : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function grab(name, text, mime){
  try {
    var blob = new Blob([text], { type:mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); if(a.parentNode) a.parentNode.removeChild(a); }, 400);
    toast("Saved " + name);
  } catch(e){ toast("This browser would not let the file save."); }
}
function ledgerRows(kidIds){
  var run = {};
  var rows = S.entries.filter(function(e){ return kidIds.indexOf(e.kid) >= 0; })
    .sort(function(a,b){ var c = daysBetween(b.on, a.on); return c !== 0 ? (c>0?1:-1) : a.seq - b.seq; });
  return rows.map(function(e){
    var rk = e.kid + "|" + e.pot;
    run[rk] = (run[rk] || 0) + e.amt;
    if(e.pot !== "screen") run[rk] = r2(run[rk]);
    var k = kidById(e.kid);
    return { child: k ? k.name : "?", on:e.on, pot:POTNAME[e.pot], kind:e.kind, what:e.what,
      amt:e.amt, unit: e.pot === "screen" ? "minutes" : "dollars",
      bal: e.pot === "screen" ? Math.round(run[rk]) : r2(run[rk]) };
  });
}
function downloadCsv(kidIds){
  var head = ["Child","Date","Pot","Type","Description","Amount","Unit","Running balance in that pot"];
  var lines = [head.map(csvCell).join(",")];
  ledgerRows(kidIds).forEach(function(r){
    lines.push([r.child, r.on, r.pot, r.kind, r.what,
      r.unit === "minutes" ? String(Math.round(r.amt)) : usdPlain(r.amt), r.unit,
      r.unit === "minutes" ? String(Math.round(r.bal)) : usdPlain(r.bal)].map(csvCell).join(","));
  });
  lines.push("");
  lines.push(csvCell("A record-keeping and teaching aid. No real money moves; you settle up yourselves."));
  grab("pocket-deck-ledger-" + today() + ".csv", "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}
function downloadJson(){
  grab("pocket-deck-" + today() + ".json", JSON.stringify(S, null, 2), "application/json");
}
(function(){
  var p = document.getElementById("picker");
  p.addEventListener("change", function(){
    var f = p.files && p.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try {
        var o = JSON.parse(String(rd.result));
        var next = normalise(o);
        if(!next.kids.length && !next.entries.length) throw new Error("empty");
        S = next;
        if(!S.commits) S.commits = [];
        nav = { lane:0, idx:0 };
        dealWeek(today()); runBankAll(); save(); render();
        toast("Imported " + S.kids.length + " child" + (S.kids.length===1?"":"ren") + " and " +
          S.entries.length + " ledger entries.");
      } catch(e){ toast("That file could not be read as a Pocket Deck backup."); }
      p.value = "";
    };
    rd.onerror = function(){ toast("That file could not be read."); p.value = ""; };
    rd.readAsText(f);
  });
})();

/* ══════════════════════════════════════════════════════════════
   14. THE PRINTED STATEMENT
   ══════════════════════════════════════════════════════════════ */
function statementFor(kidId, q){
  var k = kidById(kidId); if(!k) return "";
  var pots = ["save","spend","give"];
  var open = {}, close = {}, inSum = 0, outSum = 0;
  pots.concat(["screen"]).forEach(function(p){
    open[p] = potBefore(k.id, p, q.from);
    close[p] = potAt(k.id, p, q.to);
  });
  var rows = S.entries.filter(function(e){
    return e.kid === k.id && daysBetween(q.from, e.on) >= 0 && daysBetween(e.on, q.to) >= 0;
  }).sort(function(a,b){ var c = daysBetween(b.on, a.on); return c !== 0 ? (c>0?1:-1) : a.seq - b.seq; });

  /* One line per event, with the three pot balances marching down the page —
     so the split is visible on every payout instead of buried three rows deep. */
  var groups = [], byRef = {}, screenRows = [];
  rows.forEach(function(e){
    if(e.pot === "screen"){ screenRows.push(e); return; }
    var split = e.ref && (e.kind === "earn" || e.kind === "gift" || e.kind === "job");
    var key = split ? "r:" + e.ref : "e:" + e.id;
    if(!byRef[key]){
      byRef[key] = { on:e.on, what:e.what, kind:e.kind, save:0, spend:0, give:0 };
      groups.push(byRef[key]);
    }
    byRef[key][e.pot] = r2(byRef[key][e.pot] + e.amt);
  });
  var run = { save:open.save, spend:open.spend, give:open.give };
  var body = groups.map(function(g){
    var move = r2(g.save + g.spend + g.give);
    run.save = r2(run.save + g.save);
    run.spend = r2(run.spend + g.spend);
    run.give = r2(run.give + g.give);
    if(move >= 0) inSum = r2(inSum + move); else outSum = r2(outSum - move);
    var flag = g.kind === "interest" || g.kind === "match";
    return '<tr' + (flag ? ' class="int"' : '') + '><td>' + pretty(g.on) + '</td>' +
      '<td>' + esc(g.what) + '</td>' +
      '<td class="n">' + (move > 0 ? usd(move) : "") + '</td>' +
      '<td class="n">' + (move < 0 ? usd(-move) : "") + '</td>' +
      '<td class="n">' + usd(run.save) + '</td>' +
      '<td class="n">' + usd(run.spend) + '</td>' +
      '<td class="n">' + usd(run.give) + '</td></tr>';
  }).join("");
  var srun = open.screen;
  var screenBody = screenRows.map(function(e){
    srun = Math.round(srun + e.amt);
    return '<tr><td>' + pretty(e.on) + '</td><td>' + esc(e.what) + '</td>' +
      '<td class="n">' + (e.amt > 0 ? "+" + Math.round(e.amt) : Math.round(e.amt)) + ' min</td>' +
      '<td class="n">' + srun + ' min</td></tr>';
  }).join("");

  var intQ = 0, matQ = 0, earnQ = 0;
  rows.forEach(function(e){
    if(e.kind === "interest") intQ = r2(intQ + e.amt);
    if(e.kind === "match") matQ = r2(matQ + e.amt);
    if(e.kind === "earn" && e.pot !== "screen" && e.amt > 0) earnQ = r2(earnQ + e.amt);
  });
  var doneQ = S.cards.filter(function(c){
    return c.kid === k.id && c.state === "paid" &&
      daysBetween(q.from, c.due) >= 0 && daysBetween(c.due, q.to) >= 0;
  }).length;
  var dueQ = S.cards.filter(function(c){
    return c.kid === k.id && daysBetween(q.from, c.due) >= 0 && daysBetween(c.due, q.to) >= 0;
  }).length;
  var rateQ = div(doneQ, dueQ);
  var openTot = r2(open.save + open.spend + open.give);
  var closeTot = r2(close.save + close.spend + close.give);
  var owed = 0;
  S.loans.forEach(function(l){ if(l.kid === k.id) owed = r2(owed + Math.max(0, loanBalance(l.id, q.to))); });
  var age = ageOn(k.dob, q.to);

  var asAt = daysBetween(today(), q.to) > 0 ? today() : q.to;   /* never measure a rate into the future */
  var goals = k.goals.map(function(g){
    var pct = g.price > 0 ? Math.min(100, (close.save / g.price) * 100) : null;
    var w = weeksToGoal(k, g.price, asAt);
    return '<tr><td>' + esc(g.title) + '</td><td class="n">' + usd(g.price) + '</td>' +
      '<td class="n">' + usd(close.save) + '</td>' +
      '<td class="n">' + (pct === null ? EM : pct.toFixed(0) + "%") + '</td>' +
      '<td class="n">' + (w.done ? "reached" : (w.weeks === null ? EM : w.weeks + " wks")) + '</td></tr>';
  }).join("");

  return '<article class="st">' +
    '<div class="st-top"><div class="st-mark">Pocket Deck<small>' + esc(S.house) +
      ' &middot; family bank statement</small></div>' +
      '<div class="st-for"><b>' + esc(k.name) + '</b>' +
      (age === null ? "" : age + " years old") + '<br>' + esc(q.label) + ' &middot; ' +
      prettyFull(q.from) + ' to ' + prettyFull(q.to) + '</div></div>' +
    '<section class="st-face">' +
    '<div class="st-band">' +
      '<div><span>Opening balance</span><b>' + usd(openTot) + '</b></div>' +
      '<div><span>Paid in</span><b>' + usd(inSum) + '</b></div>' +
      '<div><span>Paid out</span><b>' + usd(outSum) + '</b></div>' +
      '<div><span>Closing balance</span><b>' + usd(closeTot) + '</b></div>' +
    '</div>' +
    '<div class="st-two">' +
      '<div><h3 class="st-h">The three pots</h3><table class="st-t">' +
        '<tr><th>Pot</th><th class="n">Opening</th><th class="n">Closing</th></tr>' +
        pots.map(function(p){
          return '<tr><td>' + POTNAME[p] + '</td><td class="n">' + usd(open[p]) +
            '</td><td class="n">' + usd(close[p]) + '</td></tr>';
        }).join("") +
        '<tr class="tot"><td>All three</td><td class="n">' + usd(openTot) + '</td>' +
        '<td class="n">' + usd(closeTot) + '</td></tr>' +
        '<tr><td>Screen time</td><td class="n">' + Math.round(open.screen) + ' min</td>' +
        '<td class="n">' + Math.round(close.screen) + ' min</td></tr>' +
      '</table></div>' +
      '<div><h3 class="st-h">This quarter</h3><table class="st-t">' +
        '<tr><td>Chores approved</td><td class="n">' + doneQ + ' of ' + dueQ + '</td></tr>' +
        '<tr><td>Completion rate</td><td class="n">' +
          (rateQ === null ? EM : Math.round(rateQ * 100) + "%") + '</td></tr>' +
        '<tr><td>Earned from chores</td><td class="n">' + usd(earnQ) + '</td></tr>' +
        '<tr class="int"><td>Interest paid by the parent bank</td><td class="n">' + usd(intQ) + '</td></tr>' +
        '<tr class="int"><td>Parent match added</td><td class="n">' + usd(matQ) + '</td></tr>' +
        '<tr><td>Interest rate</td><td class="n">' + k.rate.toFixed(2) + '% a year, ' +
          esc((PERIODS[k.period]||PERIODS.week).adj) + '</td></tr>' +
        (owed > 0 ? '<tr class="tot"><td>Owed to the family bank</td><td class="n">' +
          usd(owed) + '</td></tr>' : '') +
      '</table></div>' +
    '</div>' +
    (goals ? '<h3 class="st-h">Saving up for</h3><table class="st-t">' +
      '<tr><th>Goal</th><th class="n">Price</th><th class="n">In save</th><th class="n">There</th>' +
      '<th class="n">At this rate</th></tr>' + goals + '</table>' : '') +
    '<div class="st-note">A record-keeping and teaching aid. No real money moves; ' +
      'you settle up yourselves.</div>' +
    '<div class="st-sign"><div>Signed &mdash; ' + esc(k.name) + '</div>' +
      '<div>Signed &mdash; the family bank</div><div>Date</div></div>' +
    '<p class="st-foot">Prepared ' + prettyFull(today()) + ' &middot; ' + esc(S.house) +
      '. Interest is calculated on the balance standing at the start of each ' +
      esc((PERIODS[k.period]||PERIODS.week).unit) + ' and posted as its own line overleaf.</p>' +
    '</section><section class="st-run">' +
    '<h3 class="st-h">Every credit and debit, ' + esc(q.label) + '</h3>' +
    '<table class="st-t"><thead><tr><th>Date</th><th>What it was</th>' +
      '<th class="n">In</th><th class="n">Out</th>' +
      '<th class="n">Save</th><th class="n">Spend</th><th class="n">Give</th></tr></thead><tbody>' +
      '<tr class="tot"><td>' + pretty(q.from) + '</td><td>Balances brought forward</td>' +
      '<td class="n"></td><td class="n"></td><td class="n">' + usd(open.save) + '</td>' +
      '<td class="n">' + usd(open.spend) + '</td><td class="n">' + usd(open.give) + '</td></tr>' +
      (body || '<tr><td colspan="7">Nothing moved this quarter.</td></tr>') +
      '<tr class="tot"><td>' + pretty(q.to) + '</td><td>Closing balances &mdash; ' +
      usd(closeTot) + ' across all three pots</td><td class="n"></td><td class="n"></td>' +
      '<td class="n">' + usd(close.save) + '</td><td class="n">' + usd(close.spend) + '</td>' +
      '<td class="n">' + usd(close.give) + '</td></tr></tbody></table>' +
    (screenBody ? '<h3 class="st-h">Screen time, the other currency</h3>' +
      '<table class="st-t"><thead><tr><th>Date</th><th>What it was</th>' +
      '<th class="n">Change</th><th class="n">Balance</th></tr></thead><tbody>' +
      '<tr class="tot"><td>' + pretty(q.from) + '</td><td>Brought forward</td>' +
      '<td class="n"></td><td class="n">' + Math.round(open.screen) + ' min</td></tr>' +
      screenBody + '</tbody></table>' : '') +
    '<p class="st-foot">' + esc(k.name) + ' &middot; ' + esc(q.label) +
      ' &middot; a record-keeping and teaching aid; no real money moves.</p>' +
    '</section></article>';
}
function printFor(kidIds){
  var q = quarterOf(today());
  var sheet = document.getElementById("sheet");
  sheet.innerHTML = kidIds.map(function(id){ return statementFor(id, q); }).join("");
  if(!sheet.innerHTML){ toast("There is nobody to print a statement for yet."); return; }
  setTimeout(function(){ window.print(); }, 60);
}
window.addEventListener("beforeprint", function(){
  var sheet = document.getElementById("sheet");
  if(!sheet.innerHTML){
    var q = quarterOf(today());
    var who = lanes[nav.lane] && lanes[nav.lane].id !== "desk" ? [lanes[nav.lane].id]
              : S.kids.map(function(x){ return x.id; });
    sheet.innerHTML = who.map(function(id){ return statementFor(id, q); }).join("");
  }
});

/* ══════════════════════════════════════════════════════════════
   15. BOOT
   ══════════════════════════════════════════════════════════════ */
function boot(){
  var loaded = load();
  if(loaded && (loaded.kids.length || loaded.entries.length)){
    S = loaded;
    if(!S.commits) S.commits = [];
  } else {
    S = buildSample();
  }
  var now = today();
  retireOutgrown(now);
  dealWeek(now);
  runBank(now);
  save();
  render();
}
try { boot(); }
catch(err){
  try {
    S = blank(); S.sample = false;
    render();
  } catch(e2){}
}
})();
</script>
