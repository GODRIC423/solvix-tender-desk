<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Deck — chores, pocket money and the three pots</title>
<meta name="description" content="A family allowance deck: chores your child marks done and you approve, every payout split into save, spend and give, parent-bank interest compounded on a schedule, family loans, savings goals and a printable quarterly statement per child. Works offline, nothing leaves your house.">
<meta name="theme-color" content="#06584A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2306584A'/%3E%3Crect x='14' y='11' width='30' height='42' rx='5' fill='%23FBF4E6'/%3E%3Ccircle cx='40' cy='40' r='13' fill='%23F2B01E' stroke='%2306584A' stroke-width='3'/%3E%3Cpath d='M40 33v14M36 37h6a3 3 0 010 6h-4a3 3 0 000 6h6' stroke='%2306584A' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Manrope:wght@400;600;800&display=swap">
<style>
:root{
  --display:'Fjalla One','Haettenschweiler','Arial Narrow',system-ui,sans-serif;
  --plain:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;

  --felt-deep:#06584A; --felt-lift:#0a7460; --felt-sink:#03392f;

  --leaf-face:#FBF4E6; --leaf-tint:#F1E7D2; --leaf-crease:#DDCEB0;
  --leaf-lip:rgba(255,255,255,.72); --leaf-sink:#EAE0C8;

  --figure-full:#181410; --figure-half:#4A4034; --figure-quiet:#6B5D4C;
  --figure-bone:#FBF4E6;

  --pot-save:#0F7A5A; --pot-spend:#B4451B; --pot-give:#6B3FA0; --pot-screen:#1E5AA8;

  --coin:#F2B01E; --coin-sink:#B87F05; --flag:#C22E1F; --gain:#0F7A5A;

  --swing:420ms cubic-bezier(.2,.85,.24,1); --snap:180ms cubic-bezier(.3,.9,.3,1);
  --leaf-round:20px; --leaf-gutter:clamp(16px,4.4vw,30px); --strip:44px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--plain);font-weight:400;
  background:var(--felt-deep);color:var(--figure-bone);
  overflow:hidden;overscroll-behavior:none;
  font-size:16px;line-height:1.45;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{list-style:none;padding:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px;border-radius:4px}
.hushed{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skipto{position:fixed;left:8px;top:-60px;z-index:40;background:var(--leaf-face);color:var(--figure-full);
  padding:9px 14px;border-radius:9px;font-weight:800;text-decoration:none;transition:top var(--snap)}
.skipto:focus{top:10px}

/* ── the ground: a saturated field that belongs to whoever the deck is showing ── */
.felt{position:fixed;inset:0;z-index:0;background:var(--felt-deep);transition:background var(--swing)}
.felt::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(128% 76% at 50% -14%, rgba(255,255,255,.17), rgba(255,255,255,0) 62%),
    radial-gradient(90% 60% at 50% 118%, rgba(0,0,0,.34), rgba(0,0,0,0) 64%),
    repeating-linear-gradient(46deg, rgba(255,255,255,.035) 0 2px, rgba(255,255,255,0) 2px 8px);
}

/* ── the only chrome: one thin progress hairline ── */
.hairline{position:fixed;top:0;left:0;right:0;height:3px;z-index:12;background:rgba(0,0,0,.32)}
.hairline-run{display:block;height:100%;width:0;background:var(--coin);
  box-shadow:0 0 12px rgba(242,176,30,.6);transition:width var(--swing)}

/* ── deck stage ── */
.deck{position:relative;z-index:2;height:100vh;height:100svh;
  display:grid;place-items:center;overflow:hidden;padding:30px 0 var(--strip)}
.stage{position:relative;width:min(552px,100vw - 26px);
  height:min(786px,100svh - var(--strip) - 50px);   /* a card, roughly 1:1.42 */
  perspective:1400px;transform-style:preserve-3d}
.stage.jump-up{animation:leafUp 380ms cubic-bezier(.2,.85,.24,1)}
.stage.jump-down{animation:leafDown 380ms cubic-bezier(.2,.85,.24,1)}
@keyframes leafUp{from{transform:translateY(34px);opacity:.15}to{transform:none;opacity:1}}
@keyframes leafDown{from{transform:translateY(-34px);opacity:.15}to{transform:none;opacity:1}}

.leaf{position:absolute;inset:0;background:var(--leaf-face);color:var(--figure-full);
  border-radius:var(--leaf-round);display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 30px 62px -22px rgba(0,0,0,.62), 0 0 0 1px rgba(0,0,0,.16),
             inset 0 1px 0 var(--leaf-lip);
  transition:transform var(--swing),opacity var(--swing);will-change:transform;
  contain:paint}
.leaf[data-far="1"]{pointer-events:none;filter:saturate(.5) blur(2.6px)}
.leaf[data-far="2"]{pointer-events:none;visibility:hidden}

.leaf-head{flex:0 0 auto;background:var(--felt-deep);color:var(--figure-bone);
  padding:11px var(--leaf-gutter) 12px;display:flex;align-items:center;gap:10px;
  transition:background var(--swing)}
.who{display:flex;align-items:baseline;gap:9px;min-width:0;flex:1 1 auto}
.who-name{flex:0 0 auto;font-family:var(--display);font-size:1.32rem;letter-spacing:.045em;
  text-transform:uppercase;white-space:nowrap}
.who-age{flex:0 1 auto;min-width:0;font-size:.72rem;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn{flex:0 0 auto;display:flex;gap:6px}
.turn button{width:34px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.34);
  background:rgba(255,255,255,.1);color:var(--figure-bone);cursor:pointer;display:grid;place-items:center;
  transition:background var(--snap),transform var(--snap)}
.turn button:hover{background:rgba(255,255,255,.24)}
.turn button:active{transform:scale(.92)}
.turn svg{width:13px;height:13px;display:block}

.leaf-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:var(--leaf-gutter);
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;
  /* a whisper of shadow only while there is more card below or above */
  background:
    linear-gradient(var(--leaf-face) 34%, rgba(251,244,230,0)) top/100% 24px no-repeat local,
    linear-gradient(rgba(251,244,230,0), var(--leaf-face) 66%) bottom/100% 24px no-repeat local,
    radial-gradient(farthest-side at 50% 0, rgba(24,20,16,.17), rgba(24,20,16,0)) top/100% 11px no-repeat scroll,
    radial-gradient(farthest-side at 50% 100%, rgba(24,20,16,.17), rgba(24,20,16,0)) bottom/100% 11px no-repeat scroll}
.leaf-foot{flex:0 0 auto;padding:9px var(--leaf-gutter) 12px;border-top:1px solid var(--leaf-crease);
  background:var(--leaf-tint);display:flex;align-items:center;gap:10px;justify-content:space-between}

.kicker{font-size:.68rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--figure-quiet)}
.leaf-title{font-family:var(--display);font-size:clamp(1.62rem,5.6vw,2.16rem);line-height:1.02;
  letter-spacing:.005em;margin:5px 0 2px}
.sub{color:var(--figure-half);font-size:.92rem;margin-top:6px}
.rule{height:1px;background:var(--leaf-crease);margin:16px 0;border:0}

/* the hero figure */
.figure{font-family:var(--display);line-height:.86;letter-spacing:-.01em;margin-top:.24em;
  font-size:clamp(3.5rem,17vw,5.4rem);font-feature-settings:"tnum" 1}
.figure.mid{font-size:clamp(2.5rem,11vw,3.4rem)}
.tick{display:inline-flex;align-items:center;gap:8px;background:var(--coin);color:#2A1D00;
  font-weight:800;font-size:.94rem;padding:7px 13px 7px 11px;border-radius:999px;
  box-shadow:0 2px 0 var(--coin-sink);margin-top:2px}
.tick svg{width:15px;height:15px;flex:0 0 auto}

/* pots as ruled statement lines, not tiles */
.pots{margin:2px 0 0}
.pot{display:grid;grid-template-columns:1fr auto;align-items:end;gap:6px 12px;
  padding:11px 0 9px;border-bottom:1px solid var(--leaf-crease);position:relative}
.pot:first-child{border-top:1px solid var(--leaf-crease)}
.pot-name{grid-column:1;grid-row:1;font-size:.74rem;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px;color:var(--figure-half);
  align-self:center}
.dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;background:var(--pot-save)}
.pot-note{grid-column:1;grid-row:2;font-size:.8rem;color:var(--figure-quiet);margin-top:2px}
.pot-fig{grid-column:2;grid-row:1 / span 2;font-family:var(--display);
  font-size:clamp(1.7rem,7.4vw,2.3rem);line-height:.9;align-self:center;text-align:right;
  white-space:nowrap}
.pot-bar{grid-column:1 / -1;grid-row:3;height:5px;border-radius:3px;background:var(--leaf-sink);overflow:hidden;margin-top:8px}
.pot-bar i{display:block;height:100%;border-radius:3px;background:var(--pot-save);
  transition:width var(--swing)}

.metre{height:11px;border-radius:6px;background:var(--leaf-sink);overflow:hidden;
  border:1px solid var(--leaf-crease);margin:11px 0 8px}
.metre i{display:block;height:100%;background:linear-gradient(90deg,var(--pot-save),#17a07a);
  transition:width var(--swing)}

.lines{margin:0}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:9px 0;border-bottom:1px dotted var(--leaf-crease)}
.fact:last-child{border-bottom:0}
.fact dt{font-size:.86rem;color:var(--figure-half);font-weight:600}
.fact dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.fact dd.gain{color:var(--gain)}
.fact dd.owe{color:var(--flag)}

.press{appearance:none;border:0;border-radius:13px;font-family:var(--display);letter-spacing:.03em;
  font-size:1.24rem;padding:16px 18px;width:100%;cursor:pointer;background:var(--figure-full);
  color:var(--leaf-face);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform var(--snap),box-shadow var(--snap),filter var(--snap)}
.press:hover{filter:brightness(1.12)}
.press:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.press-yes{background:var(--pot-save);color:#fff;box-shadow:0 4px 0 #075740}
.press-no{background:var(--leaf-tint);color:var(--figure-full);box-shadow:0 4px 0 var(--leaf-crease)}
.press-coin{background:var(--coin);color:#2A1D00;box-shadow:0 4px 0 var(--coin-sink)}
.press-small{font-family:var(--plain);font-weight:800;font-size:.86rem;padding:10px 14px;width:auto;
  border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.presses{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.presses.side{flex-direction:row}
.presses.side .press{flex:1 1 0}

.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{appearance:none;border:1.5px solid var(--leaf-crease);background:var(--leaf-face);
  color:var(--figure-half);border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:800;
  cursor:pointer;transition:background var(--snap),color var(--snap),border-color var(--snap)}
.chip:hover{border-color:var(--figure-quiet)}
.chip[aria-pressed="true"]{background:var(--figure-full);border-color:var(--figure-full);color:var(--leaf-face)}

.fieldline{display:block;margin:12px 0 0}
.fieldline > span{display:block;font-size:.7rem;font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;color:var(--figure-quiet);margin-bottom:5px}
.fieldline input,.fieldline select{width:100%;background:var(--leaf-tint);border:1.5px solid var(--leaf-crease);
  border-radius:10px;padding:11px 12px;font-weight:700;font-size:1rem}
.fieldline input:focus,.fieldline select:focus{border-color:var(--figure-quiet);background:#fff}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.tab-note{background:var(--leaf-tint);border-left:4px solid var(--coin);border-radius:0 10px 10px 0;
  padding:11px 13px;font-size:.87rem;color:var(--figure-half);margin-top:14px}
.tab-note strong{color:var(--figure-full)}
.tab-note.warn{border-left-color:var(--flag)}

.stub{padding:13px 0;border-bottom:1px solid var(--leaf-crease);display:grid;
  grid-template-columns:1fr auto;gap:4px 14px;align-items:center}
.stub:last-of-type{border-bottom:0}
.stub-what{grid-column:1;grid-row:1;font-weight:800;font-size:1.02rem;line-height:1.25}
.stub-who{grid-column:1;grid-row:2;font-size:.76rem;color:var(--figure-quiet);font-weight:600}
.stub-amt{grid-column:2;grid-row:1 / span 2;font-family:var(--display);font-size:1.42rem;
  text-align:right;align-self:center;white-space:nowrap}
.stub-acts{grid-column:1 / -1;grid-row:3;display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}

.ledger-line{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;padding:9px 0;
  border-bottom:1px dotted var(--leaf-crease);align-items:baseline}
.lg-when{font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--figure-quiet);
  text-transform:uppercase;white-space:nowrap}
.lg-what{font-size:.9rem;font-weight:600;min-width:0;overflow-wrap:anywhere}
.lg-amt{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.money-in{color:var(--gain)}
.money-out{color:var(--flag)}
.lg-tag{grid-column:2;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--figure-quiet)}

.badge{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;background:var(--leaf-sink);color:var(--figure-half)}
.badge.hot{background:var(--coin);color:#2A1D00}
.badge.cold{background:var(--flag);color:#fff}

.swipehint{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--figure-quiet);background:none;
  border:0;padding:4px 2px;cursor:pointer;text-align:left;font-family:var(--plain);
  transition:color var(--snap)}
button.swipehint:hover{color:var(--figure-full)}
.swipehint .badge{pointer-events:none}
.swipehint svg{width:22px;height:11px}
.deck-count{font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--figure-quiet);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* edge paddles on the felt */
.paddle{position:fixed;top:50%;transform:translateY(-50%);z-index:10;width:46px;height:46px;
  border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.26);
  color:var(--figure-bone);cursor:pointer;display:grid;place-items:center;
  backdrop-filter:blur(3px);transition:background var(--snap),transform var(--snap)}
.paddle:hover{background:rgba(0,0,0,.46)}
.paddle:active{transform:translateY(-50%) scale(.9)}
.paddle[hidden]{display:none}
.paddle.back{left:max(6px,calc(50vw - 340px))}
.paddle.fwd{right:max(6px,calc(50vw - 340px))}
.paddle svg{width:17px;height:17px}

.disclaim{position:fixed;left:0;right:0;bottom:0;z-index:11;background:rgba(0,0,0,.44);
  color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.015em;
  padding:7px 12px calc(7px + env(safe-area-inset-bottom));text-align:center;line-height:1.3}
.disclaim b{font-weight:800;color:var(--coin)}

.coin-fly{position:fixed;z-index:30;width:26px;height:26px;border-radius:50%;background:var(--coin);
  box-shadow:0 2px 0 var(--coin-sink), 0 6px 16px rgba(0,0,0,.4);pointer-events:none;
  transition:transform 620ms cubic-bezier(.35,.15,.2,1),opacity 620ms ease-in}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%) translateY(14px);z-index:31;
  background:var(--figure-full);color:var(--leaf-face);padding:11px 17px;border-radius:11px;
  font-weight:800;font-size:.88rem;opacity:0;pointer-events:none;
  transition:opacity var(--snap),transform var(--snap);box-shadow:0 12px 30px rgba(0,0,0,.45);
  max-width:min(420px,92vw);text-align:center}
.toast.up{opacity:1;transform:translateX(-50%) translateY(0)}

.samplemark{position:fixed;right:10px;top:7px;z-index:11;font-size:.62rem;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.9);
  background:rgba(0,0,0,.38);padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.28)}
.samplemark[hidden]{display:none}

@media (max-width:820px){
  /* the card owns the full width here, so the edge paddles would sit on top of it:
     swiping, the arrow keys and the footer control do the job instead */
  .paddle{display:none}
}
@media (max-width:430px){
  .leaf-body{padding-bottom:18px}
  :root{--leaf-round:17px;--strip:62px}
  .who-name{font-size:1.14rem}
  .who-age{font-size:.64rem;letter-spacing:.1em}
}
@media (min-width:1040px){
  .stage{width:min(560px,42vw)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;
    animation-iteration-count:1!important}
}

/* ── the printed statement: the thing that goes on the fridge ── */
.sheet{display:none}
@media print{
  html,body{overflow:visible;background:#fff;color:#000;font-size:11pt}
  .felt,.deck,.hairline,.paddle,.disclaim,.skipto,.toast,.samplemark,.coin-fly{display:none!important}
  .sheet{display:block;font-family:var(--plain)}
  @page{margin:14mm 13mm}
  .st{page-break-after:always;break-after:page}
  .st:last-child{page-break-after:auto;break-after:auto}
  .st-top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
    border-bottom:2.5px solid #000;padding-bottom:8px}
  .st-mark{font-family:var(--display);font-size:20pt;letter-spacing:.03em;text-transform:uppercase;line-height:1}
  .st-mark small{display:block;font-family:var(--plain);font-size:8pt;font-weight:800;
    letter-spacing:.2em;margin-top:4px}
  .st-for{text-align:right;font-size:9.5pt}
  .st-for b{display:block;font-family:var(--display);font-size:17pt;letter-spacing:.03em;text-transform:uppercase}
  .st-band{display:flex;gap:0;border:1.5px solid #000;border-top:0;margin-bottom:12px}
  .st-band div{flex:1 1 0;padding:7px 9px;border-right:1px solid #000}
  .st-band div:last-child{border-right:0}
  .st-band span{display:block;font-size:7.5pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .st-band b{font-family:var(--display);font-size:15pt;font-weight:400}
  .st-h{font-family:var(--display);font-size:12pt;letter-spacing:.06em;text-transform:uppercase;
    margin:14px 0 5px;border-bottom:1px solid #000;padding-bottom:3px}
  table.st-t{width:100%;border-collapse:collapse;font-size:8.6pt}
  table.st-t{table-layout:auto}
  table.st-t thead{display:table-header-group}
  table.st-t th{text-align:left;font-size:7.5pt;letter-spacing:.12em;text-transform:uppercase;
    border-bottom:1.2px solid #000;padding:4px 5px}
  table.st-t tr{break-inside:avoid;page-break-inside:avoid}
  table.st-t td{padding:2.8px 5px;border-bottom:.4px solid #bbb;vertical-align:top}
  .st-run{break-before:page;page-break-before:always;padding-top:2mm}
  table.st-t td.n,table.st-t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.st-t tr.int td{font-weight:800}
  table.st-t tr.tot td{border-top:1.4px solid #000;border-bottom:2.4px double #000;font-weight:800}
  .st-two{display:flex;gap:16px}
  .st-two > *{flex:1 1 0}
  .st-sign{margin-top:16px;display:flex;gap:26px}
  .st-sign div{flex:1 1 0;border-top:1px solid #000;padding-top:4px;font-size:8pt;
    font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .st-note{margin-top:12px;border:1.5px solid #000;padding:8px 10px;font-size:9pt;font-weight:800}
  .st-foot{margin-top:8px;font-size:7.5pt;color:#333}
}
</style>
</head>
<body>
<a class="skipto" href="#deck">Skip to the deck</a>
<div class="felt" id="felt" aria-hidden="true"></div>
<header class="hairline" role="banner" aria-hidden="true"><i class="hairline-run" id="hairline"></i></header>
<p class="samplemark" id="samplemark">Sample family</p>

<button class="paddle back" id="paddleBack" type="button" aria-label="Previous card">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
</button>
<button class="paddle fwd" id="paddleFwd" type="button" aria-label="Next card">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
</button>

<main class="deck" id="deck">
  <h1 class="hushed">Pocket Deck — family allowance, chores and the three pots</h1>
  <div class="stage" id="stage" role="region" aria-live="polite" aria-label="Card deck"></div>
</main>

<p class="disclaim"><b>A record-keeping and teaching aid.</b> No real money moves; you settle up yourselves.</p>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="picker" accept="application/json,.json" class="hushed" tabindex="-1" aria-label="Choose a Pocket Deck JSON backup to import">
<section class="sheet" id="sheet" aria-label="Printable statements"></section>
<script>
"use strict";
(function(){

/* ══════════════════════════════════════════════════════════════
   1. NUMBERS AND DATES
   ══════════════════════════════════════════════════════════════ */
var EM = "—";
function r2(n){
  if(typeof n !== "number" || !isFinite(n)) return 0;
  var s = n < 0 ? -1 : 1;
  return s * Math.round(Math.abs(n) * 100 + 1e-9) / 100;
}
function usd(n){
  if(typeof n !== "number" || !isFinite(n)) return EM;
  var v = r2(n);
  return (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2);
}
function usdPlain(n){
  if(typeof n !== "number" || !isFinite(n)) return "";
  return r2(n).toFixed(2);
}
function mins(n){
  if(typeof n !== "number" || !isFinite(n)) return EM;
  var v = Math.round(n);
  if(Math.abs(v) < 60) return v + " min";
  var h = Math.floor(Math.abs(v)/60), m = Math.abs(v)%60;
  return (v<0?"-":"") + h + "h" + (m ? " " + m + "m" : "");
}
/* guarded divide: never NaN, never Infinity */
function div(a, b){
  if(typeof a !== "number" || typeof b !== "number") return null;
  if(!isFinite(a) || !isFinite(b) || b === 0) return null;
  var q = a / b;
  return isFinite(q) ? q : null;
}

/* Dates are handled as UTC-noon Date objects keyed by ISO yyyy-mm-dd, so
   daylight saving and leap years never shift a day. */
function dParse(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  if(!m) return null;
  var d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3], 12, 0, 0));
  if(d.getUTCFullYear() !== +m[1] || d.getUTCMonth() !== +m[2]-1 || d.getUTCDate() !== +m[3]) return null;
  return d;
}
function dIso(d){
  if(!(d instanceof Date) || isNaN(d.getTime())) return "";
  var y = d.getUTCFullYear(), m = d.getUTCMonth()+1, x = d.getUTCDate();
  return y + "-" + (m<10?"0":"") + m + "-" + (x<10?"0":"") + x;
}
function today(){
  var n = new Date();
  return dIso(new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), 12)));
}
function addDays(iso, n){
  var d = dParse(iso); if(!d) return iso;
  return dIso(new Date(d.getTime() + n*86400000));
}
/* month arithmetic that clamps: 31 Jan + 1 month = 28/29 Feb */
function addMonths(iso, n){
  var d = dParse(iso); if(!d) return iso;
  var y = d.getUTCFullYear(), m = d.getUTCMonth() + n, day = d.getUTCDate();
  var target = new Date(Date.UTC(y, m, 1, 12));
  var last = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth()+1, 0, 12)).getUTCDate();
  return dIso(new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth(), Math.min(day, last), 12)));
}
function daysBetween(a, b){
  var x = dParse(a), y = dParse(b);
  if(!x || !y) return 0;
  return Math.round((y.getTime() - x.getTime()) / 86400000);
}
function dow(iso){ var d = dParse(iso); return d ? d.getUTCDay() : 0; }      /* 0 Sun … 6 Sat */
function mondayOf(iso){
  var w = dow(iso);
  return addDays(iso, w === 0 ? -6 : 1 - w);
}
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DAYN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function pretty(iso){
  var d = dParse(iso); if(!d) return EM;
  return d.getUTCDate() + " " + MON[d.getUTCMonth()];
}
function prettyFull(iso){
  var d = dParse(iso); if(!d) return EM;
  return DAYN[d.getUTCDay()] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()] + " " + d.getUTCFullYear();
}
/* Calendar age, leap-year safe. A 29 Feb child turns a year older on 1 March
   in non-leap years, which is the convention this counts. */
function ageOn(dobIso, onIso){
  var b = dParse(dobIso), o = dParse(onIso);
  if(!b || !o) return null;
  var a = o.getUTCFullYear() - b.getUTCFullYear();
  var bm = b.getUTCMonth(), bd = b.getUTCDate(), om = o.getUTCMonth(), od = o.getUTCDate();
  if(om < bm || (om === bm && od < bd)) a--;
  return a < 0 ? null : a;
}
function nextBirthday(dobIso, fromIso){
  var b = dParse(dobIso), f = dParse(fromIso);
  if(!b || !f) return null;
  for(var y = f.getUTCFullYear(); y <= f.getUTCFullYear()+4; y++){
    var last = new Date(Date.UTC(y, b.getUTCMonth()+1, 0, 12)).getUTCDate();
    var iso = dIso(new Date(Date.UTC(y, b.getUTCMonth(), Math.min(b.getUTCDate(), last), 12)));
    if(daysBetween(fromIso, iso) >= 0) return iso;
  }
  return null;
}
function quarterOf(iso){
  var d = dParse(iso); if(!d) return null;
  var q = Math.floor(d.getUTCMonth()/3);
  return { y: d.getUTCFullYear(), q: q,
           from: dIso(new Date(Date.UTC(d.getUTCFullYear(), q*3, 1, 12))),
           to: dIso(new Date(Date.UTC(d.getUTCFullYear(), q*3+3, 0, 12))),
           label: "Q" + (q+1) + " " + d.getUTCFullYear() };
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function uid(p){ return (p||"x") + Math.random().toString(36).slice(2,9) + (uid.n = (uid.n||0)+1); }

/* deterministic PRNG so the sample family looks the same on every first load */
function seeded(seed){
  var t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5; t = t >>> 0;
    var x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

/* ══════════════════════════════════════════════════════════════
   2. STATE
   ══════════════════════════════════════════════════════════════ */
var KEY = "pocketdeck.v1";
var PERIODS = { week:{ n:52, label:"a week", unit:"week", adj:"weekly" },
                month:{ n:12, label:"a month", unit:"month", adj:"monthly" },
                quarter:{ n:4, label:"a quarter", unit:"quarter", adj:"quarterly" } };
var FELTS = ["#06584A", "#1B3C8C", "#7A1350", "#8C3A10", "#0F5E6E", "#5C2A86"];
var DESK_FELT = "#2E1A66";

var S = null;      /* the whole family */
var storageOk = true;

function blank(){
  return { v:1, sample:false, opened: mondayOf(addDays(today(), -7)),
           house:"Our house", kids:[], chores:[], cards:[], entries:[], loans:[],
           loanEvents:[], commits:[], perks:defaultPerks(), done:{} };
}
function defaultPerks(){
  return [
    { id:uid("p"), title:"30 minutes extra screen", cost:30 },
    { id:uid("p"), title:"An hour of console time", cost:60 },
    { id:uid("p"), title:"Friend over after school", cost:45 },
    { id:uid("p"), title:"Pick the Friday film", cost:20 },
    { id:uid("p"), title:"Skip one chore, no argument", cost:75 }
  ];
}
function load(){
  var raw = null;
  try { raw = window.localStorage.getItem(KEY); }
  catch(e){ storageOk = false; raw = null; }
  if(!raw) return null;
  try {
    var o = JSON.parse(raw);
    if(!o || typeof o !== "object" || !Array.isArray(o.kids)) return null;
    return normalise(o);
  } catch(e){ return null; }
}
function save(){
  if(!storageOk) return;
  try { window.localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOk = false; }
}
function normalise(o){
  var b = blank();
  var out = {
    v:1,
    sample: !!o.sample,
    opened: dParse(o.opened) ? o.opened : b.opened,
    house: typeof o.house === "string" && o.house.trim() ? o.house.slice(0,60) : b.house,
    kids:[], chores:[], cards:[], entries:[], loans:[], loanEvents:[], commits:[],
    perks: Array.isArray(o.perks) && o.perks.length ? o.perks.map(function(p){
      return { id: p.id || uid("p"), title: String(p.title||"Perk").slice(0,70),
               cost: Math.max(0, Math.round(Number(p.cost)||0)) };
    }) : b.perks,
    done: (o.done && typeof o.done === "object") ? o.done : {}
  };
  (Array.isArray(o.kids)?o.kids:[]).forEach(function(k, i){
    var sp = k.split || {};
    var sv = Math.max(0, Math.round(Number(sp.save))||0),
        gv = Math.max(0, Math.round(Number(sp.give))||0);
    if(sv + gv > 100){ sv = Math.min(sv,100); gv = Math.max(0, 100 - sv); }
    out.kids.push({
      id: k.id || uid("k"),
      name: String(k.name||"Child").slice(0,28),
      dob: dParse(k.dob) ? k.dob : addDays(today(), -3650),
      felt: k.felt || FELTS[i % FELTS.length],
      split: { save: sv, give: gv, spend: 100 - sv - gv },
      rate: Math.max(0, Math.min(50, Number(k.rate)||0)),
      period: PERIODS[k.period] ? k.period : "week",
      match: { pct: Math.max(0, Math.min(200, Number(k.match && k.match.pct)||0)),
               cap: Math.max(0, Number(k.match && k.match.cap)||0) },
      goals: (Array.isArray(k.goals)?k.goals:[]).map(function(g){
        return { id: g.id||uid("g"), title:String(g.title||"A goal").slice(0,60),
                 price: Math.max(0, r2(Number(g.price)||0)) };
      })
    });
  });
  var kidIds = {}; out.kids.forEach(function(k){ kidIds[k.id] = true; });
  (Array.isArray(o.chores)?o.chores:[]).forEach(function(c){
    if(!kidIds[c.kid]) return;
    out.chores.push({
      id: c.id||uid("c"), kid: c.kid, title:String(c.title||"Chore").slice(0,64),
      value: Math.max(0, r2(Number(c.value)||0)),
      screen: Math.max(0, Math.round(Number(c.screen)||0)),
      cadence: (c.cadence === "once" || c.cadence === "daily") ? c.cadence : "weekly",
      day: Math.max(0, Math.min(6, Math.round(Number(c.day)||6))),
      bandLo: Math.max(2, Math.min(19, Math.round(Number(c.bandLo)||5))),
      bandHi: Math.max(2, Math.min(21, Math.round(Number(c.bandHi)||18))),
      since: dParse(c.since) ? c.since : out.opened,
      fresh: dParse(c.fresh) ? c.fresh : (dParse(c.since) ? c.since : out.opened),
      retired: dParse(c.retired) ? c.retired : null,
      why: c.why || null
    });
  });
  var chIds = {}; out.chores.forEach(function(c){ chIds[c.id] = true; });
  (Array.isArray(o.cards)?o.cards:[]).forEach(function(c){
    if(!kidIds[c.kid]) return;
    var st = ["todo","done","paid","back"].indexOf(c.state) >= 0 ? c.state : "todo";
    out.cards.push({ id:c.id||uid("d"), kid:c.kid, chore: chIds[c.chore] ? c.chore : null,
      title:String(c.title||"Chore").slice(0,64),
      value: Math.max(0, r2(Number(c.value)||0)),
      screen: Math.max(0, Math.round(Number(c.screen)||0)),
      due: dParse(c.due) ? c.due : today(), state: st,
      markedOn: dParse(c.markedOn) ? c.markedOn : null,
      note: c.note ? String(c.note).slice(0,80) : null });
  });
  (Array.isArray(o.entries)?o.entries:[]).forEach(function(e){
    if(!kidIds[e.kid]) return;
    var pot = ["save","spend","give","screen"].indexOf(e.pot) >= 0 ? e.pot : "spend";
    out.entries.push({ id:e.id||uid("e"), kid:e.kid, on: dParse(e.on)?e.on:today(),
      pot: pot, kind: String(e.kind||"adjust").slice(0,16),
      what: String(e.what||"Entry").slice(0,90),
      amt: pot === "screen" ? Math.round(Number(e.amt)||0) : r2(Number(e.amt)||0),
      ref: e.ref || null, key: e.key || null, seq: Number(e.seq)||0 });
  });
  (Array.isArray(o.loans)?o.loans:[]).forEach(function(l){
    if(!kidIds[l.kid]) return;
    out.loans.push({ id:l.id||uid("l"), kid:l.kid, title:String(l.title||"Loan").slice(0,60),
      principal: Math.max(0, r2(Number(l.principal)||0)),
      apr: Math.max(0, Math.min(60, Number(l.apr)||0)),
      weekly: Math.max(0, r2(Number(l.weekly)||0)),
      from: dParse(l.from) ? l.from : today(),
      closed: dParse(l.closed) ? l.closed : null });
  });
  var loanIds = {}; out.loans.forEach(function(l){ loanIds[l.id] = true; });
  (Array.isArray(o.loanEvents)?o.loanEvents:[]).forEach(function(v){
    if(!loanIds[v.loan]) return;
    out.loanEvents.push({ id:v.id||uid("v"), loan:v.loan, on: dParse(v.on)?v.on:today(),
      kind: ["draw","charge","pay"].indexOf(v.kind)>=0 ? v.kind : "pay",
      amt: r2(Number(v.amt)||0), key: v.key||null });
  });
  (Array.isArray(o.commits)?o.commits:[]).forEach(function(m){
    if(!kidIds[m.kid]) return;
    out.commits.push({ id:m.id||uid("m"), kid:m.kid, title:String(m.title||"Commitment").slice(0,60),
      amt: Math.max(0, r2(Number(m.amt)||0)),
      every: m.every === "week" ? "week" : "month",
      from: dParse(m.from) ? m.from : out.opened,
      ended: dParse(m.ended) ? m.ended : null });
  });
  return out;
}

/* ── ledger reads ─────────────────────────────────────────── */
function potAt(kid, pot, onIso){
  var t = 0, i, e;
  for(i = 0; i < S.entries.length; i++){
    e = S.entries[i];
    if(e.kid !== kid || e.pot !== pot) continue;
    if(onIso && daysBetween(e.on, onIso) < 0) continue;
    t += e.amt;
  }
  return pot === "screen" ? Math.round(t) : r2(t);
}
function potBefore(kid, pot, isoExclusive){
  var t = 0, i, e;
  for(i = 0; i < S.entries.length; i++){
    e = S.entries[i];
    if(e.kid !== kid || e.pot !== pot) continue;
    if(daysBetween(e.on, isoExclusive) <= 0) continue;   /* strictly before */
    t += e.amt;
  }
  return pot === "screen" ? Math.round(t) : r2(t);
}
function cashAt(kid){ return r2(potAt(kid,"save") + potAt(kid,"spend") + potAt(kid,"give")); }
function sumEntries(kid, test){
  var t = 0;
  S.entries.forEach(function(e){ if(e.kid === kid && test(e)) t += e.amt; });
  return r2(t);
}
function loanBalance(loanId, onIso){
  var t = 0;
  S.loanEvents.forEach(function(v){
    if(v.loan !== loanId) return;
    if(onIso && daysBetween(v.on, onIso) < 0) return;
    t += (v.kind === "pay") ? -v.amt : v.amt;
  });
  return r2(t);
}
function pushEntry(o){
  o.id = o.id || uid("e");
  o.seq = S.entries.length;
  S.entries.push(o);
  return o;
}
function hasKey(k){
  for(var i=0;i<S.entries.length;i++) if(S.entries[i].key === k) return true;
  for(var j=0;j<S.loanEvents.length;j++) if(S.loanEvents[j].key === k) return true;
  return false;
}

/* ══════════════════════════════════════════════════════════════
   3. THE MONEY RULES
   ══════════════════════════════════════════════════════════════ */
/* THE SPLIT. Every payout divides by percentage into save, spend and give.
   save and give are rounded to the cent; spend takes the remainder, so the
   three parts always add back to exactly the gross. */
function splitOf(kid, gross){
  var g = r2(gross);
  var sv = r2(g * kid.split.save / 100);
  var gv = r2(g * kid.split.give / 100);
  var sp = r2(g - sv - gv);
  return { save: sv, give: gv, spend: sp, gross: g };
}
/* PARENT MATCH: a percentage of the save share, capped per calendar week. */
function matchFor(kid, saveShare, onIso){
  if(!kid.match || !kid.match.pct || saveShare <= 0) return 0;
  var wk = mondayOf(onIso);
  var used = sumEntries(kid.id, function(e){
    return e.kind === "match" && mondayOf(e.on) === wk;
  });
  var want = r2(saveShare * kid.match.pct / 100);
  var room = kid.match.cap > 0 ? r2(kid.match.cap - used) : want;
  var got = Math.min(want, Math.max(0, room));
  return r2(got);
}
/* Post a payout: three pot entries sharing one reference, plus the match. */
function payout(kid, gross, what, onIso, kind, screenMins){
  var sp = splitOf(kid, gross), ref = uid("r"), made = [];
  if(sp.save !== 0) made.push(pushEntry({kid:kid.id,on:onIso,pot:"save",kind:kind||"earn",
      what:what,amt:sp.save,ref:ref}));
  if(sp.spend !== 0) made.push(pushEntry({kid:kid.id,on:onIso,pot:"spend",kind:kind||"earn",
      what:what,amt:sp.spend,ref:ref}));
  if(sp.give !== 0) made.push(pushEntry({kid:kid.id,on:onIso,pot:"give",kind:kind||"earn",
      what:what,amt:sp.give,ref:ref}));
  var m = matchFor(kid, sp.save, onIso);
  if(m > 0) made.push(pushEntry({kid:kid.id,on:onIso,pot:"save",kind:"match",
      what:"Parent match on " + what,amt:m,ref:ref}));
  if(screenMins) pushEntry({kid:kid.id,on:onIso,pot:"screen",kind:kind||"earn",
      what:what,amt:Math.round(screenMins),ref:ref});
  return { split: sp, match: m, ref: ref, entries: made };
}

/* INTEREST. Rate is an annual percentage; it is divided by the number of
   compounding periods in a year and applied to the save-pot balance standing
   at the start of that period. Each tick is posted as its own ledger line. */
function ratePerPeriod(kid){
  var p = PERIODS[kid.period] || PERIODS.week;
  return (kid.rate / 100) / p.n;
}
function interestBoundaries(kid, uptoIso){
  var out = [], guard = 0, at = S.opened;
  var step = kid.period;
  at = (step === "week") ? addDays(S.opened, 7)
     : addMonths(S.opened, step === "month" ? 1 : 3);
  while(daysBetween(at, uptoIso) >= 0 && guard++ < 4000){
    out.push(at);
    at = (step === "week") ? addDays(at, 7) : addMonths(at, step === "month" ? 1 : 3);
  }
  return out;
}
function nextInterestDate(kid, uptoIso){
  var at = (kid.period === "week") ? addDays(S.opened, 7)
         : addMonths(S.opened, kid.period === "month" ? 1 : 3);
  var guard = 0;
  while(daysBetween(at, uptoIso) >= 0 && guard++ < 4000){
    at = (kid.period === "week") ? addDays(at, 7) : addMonths(at, kid.period === "month" ? 1 : 3);
  }
  return at;
}

/* Every dated, automatic thing the bank does — interest ticks, loan interest
   charges, loan repayments — is collected, sorted, and applied in order, so
   compounding and repayment see each other's effects. Idempotent by key. */
function runBank(uptoIso){
  var jobs = [];
  S.kids.forEach(function(k){
    if(k.rate > 0){
      interestBoundaries(k, uptoIso).forEach(function(b){
        jobs.push({ on:b, ord:1, key:"int:"+k.id+":"+b, run:function(){
          var base = potBefore(k.id, "save", b);
          if(base <= 0) return;
          var amt = r2(base * ratePerPeriod(k));
          if(amt < 0.01) return;
          pushEntry({kid:k.id,on:b,pot:"save",kind:"interest",
            what:"Interest on " + usd(base) + " at " + k.rate.toFixed(2) + "% a year",
            amt:amt,key:"int:"+k.id+":"+b});
        }});
      });
    }
  });
  S.loans.forEach(function(l){
    var k = kidById(l.kid); if(!k) return;
    /* the draw */
    jobs.push({ on:l.from, ord:0, key:"draw:"+l.id, run:function(){
      S.loanEvents.push({id:uid("v"),loan:l.id,on:l.from,kind:"draw",amt:l.principal,key:"draw:"+l.id});
      pushEntry({kid:l.kid,on:l.from,pot:"spend",kind:"loan",
        what:"Family loan for " + l.title,amt:l.principal,key:"drawcash:"+l.id});
    }});
    /* monthly interest charge on what is still owed */
    var at = addMonths(l.from, 1), g = 0;
    while(daysBetween(at, uptoIso) >= 0 && g++ < 400){
      (function(when){
        jobs.push({ on:when, ord:1, key:"lint:"+l.id+":"+when, run:function(){
          var bal = loanBalance(l.id, when);
          if(bal <= 0.004 || l.apr <= 0) return;
          var chg = r2(bal * (l.apr/100) / 12);
          if(chg < 0.01) return;
          S.loanEvents.push({id:uid("v"),loan:l.id,on:when,kind:"charge",amt:chg,
            key:"lint:"+l.id+":"+when});
        }});
      })(at);
      at = addMonths(at, 1);
    }
    /* weekly repayment, taken from spend first then save */
    var pd = addDays(l.from, 7), g2 = 0;
    while(daysBetween(pd, uptoIso) >= 0 && g2++ < 1200){
      (function(when){
        jobs.push({ on:when, ord:2, key:"lpay:"+l.id+":"+when, run:function(){
          var bal = loanBalance(l.id, when);
          if(bal <= 0.004) return;
          var want = Math.min(l.weekly, bal);
          var sp = potBefore(l.kid,"spend",addDays(when,1)),
              sv = potBefore(l.kid,"save",addDays(when,1));
          var have = r2(Math.max(0,sp) + Math.max(0,sv));
          var pay = r2(Math.min(want, have));
          if(pay < 0.01) return;
          var fromSpend = r2(Math.min(pay, Math.max(0, sp)));
          var fromSave  = r2(pay - fromSpend);
          if(fromSpend > 0) pushEntry({kid:l.kid,on:when,pot:"spend",kind:"repay",
            what:"Loan repayment — " + l.title,amt:-fromSpend,key:"lpaya:"+l.id+":"+when});
          if(fromSave > 0) pushEntry({kid:l.kid,on:when,pot:"save",kind:"repay",
            what:"Loan repayment (from save) — " + l.title,amt:-fromSave,key:"lpayb:"+l.id+":"+when});
          S.loanEvents.push({id:uid("v"),loan:l.id,on:when,kind:"pay",amt:pay,
            key:"lpay:"+l.id+":"+when});
        }});
      })(pd);
      pd = addDays(pd, 7);
    }
  });
  commitJobs(uptoIso, jobs);
  jobs.sort(function(a,b){
    var c = daysBetween(b.on, a.on);
    if(c !== 0) return c > 0 ? 1 : -1;
    return a.ord - b.ord;
  });
  jobs.forEach(function(j){ if(!hasKey(j.key)) j.run(); });
  S.loans.forEach(function(l){
    if(!l.closed && loanBalance(l.id) <= 0.004){
      var last = null;
      S.loanEvents.forEach(function(v){ if(v.loan === l.id) last = (!last || daysBetween(last, v.on) > 0) ? v.on : last; });
      l.closed = last || uptoIso;
    }
  });
}

function kidById(id){
  for(var i=0;i<S.kids.length;i++) if(S.kids[i].id === id) return S.kids[i];
  return null;

function choreById(id){

/* ── weekly completion rate (the parent's number, not the child's) ────── */
function weekRate(kid, weekMondayIso){
  var due = 0, got = 0;
  S.cards.forEach(function(c){
    if(c.kid !== kid) return;
    if(mondayOf(c.due) !== weekMondayIso) return;
    due++;
    if(c.state === "paid") got++;
  });
  var q = div(got, due);
  return { due: due, got: got, pct: q === null ? null : Math.round(q * 100) };
}
/* Forgiving form: the best of the last four completed weeks, so one bad week
   never resets anything to zero. */
function bestOfFour(kid, fromIso){
  var best = null, weeks = [];
  for(var i = 1; i <= 4; i++){
    var wk = addDays(mondayOf(fromIso), -7*i);
    var r = weekRate(kid, wk);
    weeks.push(r);
    if(r.pct !== null && (best === null || r.pct > best)) best = r.pct;
  }
  return { best: best, weeks: weeks };
}
/* Average weekly money arriving in the save pot over the last 4 weeks. */
function saveRate(kid, fromIso){
  var since = addDays(fromIso, -28);
  var t = sumEntries(kid.id, function(e){
    return e.pot === "save" && e.amt > 0 && daysBetween(since, e.on) >= 0;
  });
  var q = div(t, 4);
  return q === null ? 0 : r2(q);
}
function weeksToGoal(kid, price, fromIso){
  var have = potAt(kid.id, "save");
  var need = r2(price - have);
  if(need <= 0) return { need:0, weeks:0, rate:saveRate(kid, fromIso), done:true };
  var rate = saveRate(kid, fromIso);
  if(rate <= 0) return { need:need, weeks:null, rate:0, done:false };
  var q = div(need, rate);
  return { need:need, weeks: q === null ? null : Math.ceil(q), rate:rate, done:false };
}

function cardId(choreId, dueIso){ return "d:" + choreId + ":" + dueIso; }
function haveCard(id){
  for(var i=0;i<S.cards.length;i++) if(S.cards[i].id === id) return S.cards[i];
  return null;
}
function dueInWeek(chore, mondayIso){
  var off = (chore.day === 0) ? 6 : chore.day - 1;      /* Monday-first week */
  return addDays(mondayIso, off);
}
/* Deal this week's cards for every live chore. Idempotent. */
function dealWeek(nowIso){
  var wk = mondayOf(nowIso);
  S.chores.forEach(function(c){
    if(c.retired) return;
    if(c.cadence === "once"){
      if(!haveCard(cardId(c.id, c.since))) newCard(c, c.since);
      return;
    }
    if(c.cadence === "daily"){
      for(var i=0;i<7;i++){
        var d = addDays(wk, i);
        if(daysBetween(c.since, d) < 0) continue;
        if(!haveCard(cardId(c.id, d))) newCard(c, d);
      }
      return;
    }
    var due = dueInWeek(c, wk);
    if(daysBetween(c.since, due) < 0) return;
    if(!haveCard(cardId(c.id, due))) newCard(c, due);
  });
}
function newCard(c, dueIso){
  S.cards.push({ id:cardId(c.id, dueIso), kid:c.kid, chore:c.id, title:c.title,
    value:c.value, screen:c.screen, due:dueIso, state:"todo", markedOn:null, note:null });
}
function cardsFor(kid, states){
  return S.cards.filter(function(c){
    return c.kid === kid && states.indexOf(c.state) >= 0;
  }).sort(function(a,b){ return daysBetween(b.due, a.due); });
}
/* Only this week's and last week's cards are live. A chore missed a month ago
   has lapsed — putting it back in the deck would only breed guilt. */
function openFor(kid, nowIso){
  return S.cards.filter(function(c){
    return c.kid === kid && (c.state === "todo" || c.state === "back") &&
           daysBetween(mondayOf(c.due), mondayOf(nowIso)) <= 7 &&
           daysBetween(mondayOf(nowIso), mondayOf(c.due)) <= 7;
  }).sort(function(a,b){ return daysBetween(b.due, a.due); });
}
function waitingAll(){
  return S.cards.filter(function(c){ return c.state === "done"; })
    .sort(function(a,b){ return daysBetween(b.due, a.due); });
}

function dobForAge(age, month, day){
  var t = dParse(today());
  var y = t.getUTCFullYear() - age;
  var had = (t.getUTCMonth()+1 > month) || (t.getUTCMonth()+1 === month && t.getUTCDate() >= day);
  if(!had) y -= 1;
  return dIso(new Date(Date.UTC(y, month-1, day, 12)));
}
function leapFeb29Near(age){
  var t = dParse(today()).getUTCFullYear() - age;
  for(var y = t; y > t - 8; y--){
    if((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) return y + "-02-29";
  }
  return dobForAge(age, 3, 1);
}

/* ══════════════════════════════════════════════════════════════
   7. RECURRING COMMITMENTS (the teen years)
   ══════════════════════════════════════════════════════════════ */
function commitJobs(uptoIso, jobs){
  (S.commits||[]).forEach(function(m){
    var k = kidById(m.kid); if(!k) return;
    var at = m.every === "week" ? addDays(m.from, 7) : addMonths(m.from, 1), g = 0;
    while(daysBetween(at, uptoIso) >= 0 && g++ < 1200){
      if(m.ended && daysBetween(m.ended, at) > 0) break;
      (function(when){
        jobs.push({ on:when, ord:3, key:"cm:"+m.id+":"+when, run:function(){
          var sp = potBefore(m.kid,"spend",addDays(when,1)),
              sv = potBefore(m.kid,"save",addDays(when,1));
          var have = r2(Math.max(0,sp) + Math.max(0,sv));
          var pay = r2(Math.min(m.amt, have));
          if(pay < 0.01) return;
          var a = r2(Math.min(pay, Math.max(0, sp))), b = r2(pay - a);
          if(a > 0) pushEntry({kid:m.kid,on:when,pot:"spend",kind:"commit",
            what:m.title,amt:-a,key:"cm:"+m.id+":"+when});
          if(b > 0) pushEntry({kid:m.kid,on:when,pot:"save",kind:"commit",
            what:m.title + " (from save)",amt:-b,key:"cmb:"+m.id+":"+when});
        }});
      })(at);
      at = m.every === "week" ? addDays(at, 7) : addMonths(at, 1);
    }
  });
}

      POTNAME[pot] + '</span>' +
    '<span class="pot-fig">' + (isScreen ? mins(amount) : usd(amount)) + '</span>' +
    (note ? '<span class="pot-note">' + note + '</span>' : '') +
    '<span class="pot-bar"><i style="width:' + Math.max(0, Math.min(100, share||0)).toFixed(1) +
      '%;background:var(--pot-' + pot + ')"></i></span></div>';
}
function fact(dt, dd, cls){
  return '<div class="fact"><dt>' + dt + '</dt><dd' + (cls?' class="'+cls+'"':'') + '>' + dd + '</dd></div>';
}
function field(label, attrs, k){
  return '<label class="fieldline"><span>' + esc(label) + '</span>' +
    '<input ' + attrs + ' data-k="' + esc(k) + '"></label>';
}

/* ══════════════════════════════════════════════════════════════
   9. A CHILD'S LANE
   ══════════════════════════════════════════════════════════════ */
function kidLeaves(k, now){
  var out = [];
  var sv = potAt(k.id,"save"), sp = potAt(k.id,"spend"), gv = potAt(k.id,"give"),
      sc = potAt(k.id,"screen");
  var cash = r2(sv + sp + gv);
  var big = Math.max(Math.abs(sv), Math.abs(sp), Math.abs(gv), 0.01);
  var owed = 0;
  S.loans.forEach(function(l){ if(l.kid === k.id) owed = r2(owed + Math.max(0, loanBalance(l.id))); });

  /* ── 1. THE FRONT DOOR: the balance and the interest tick ── */
  var since = addDays(now, -7);
  var tickNow = sumEntries(k.id, function(e){
    return e.kind === "interest" && daysBetween(since, e.on) >= 0;
  });
  var matchNow = sumEntries(k.id, function(e){
    return e.kind === "match" && daysBetween(since, e.on) >= 0;
  });
  var nextTick = nextInterestDate(k, now);
  var dueTick = r2(sv * ratePerPeriod(k));
  var tickLine = tickNow > 0
    ? "Your save pot grew " + usd(tickNow) + " this week."
    : (k.rate > 0
        ? "Next tick " + prettyFull(nextTick) + ": about " + usd(dueTick) + "."
        : "Parent bank interest is switched off.");

  out.push({ key:"bal", kicker:"Where you stand today",
    title: esc(k.name) + "&rsquo;s money",
    body:
      '<p class="tick">' + ICON.coin + '<span>' + esc(tickLine) + '</span></p>' +
      '<div class="pots">' +
        potRow("save", sv, k.rate > 0
            ? "Earning " + k.rate.toFixed(2) + "% a year, added " + (PERIODS[k.period]||PERIODS.week).adj
            : "No interest set", Math.abs(sv)/big*100) +
        potRow("spend", sp, "Yours to spend", Math.abs(sp)/big*100) +
        potRow("give", gv, "Set aside to give away", Math.abs(gv)/big*100) +
        potRow("screen", sc, "Earned, and spent on perks", Math.min(100, Math.abs(sc)/240*100)) +
      '</div>' +
      '<dl class="lines">' +
        fact("All three money pots together", usd(cash)) +
        (matchNow > 0 ? fact("Parent match added this week", "+" + usd(matchNow), "gain") : "") +
        (owed > 0 ? fact("Still owed to the family bank", usd(owed), "owe") : "") +
      '</dl>' +
      '<p class="tab-note"><strong>A record-keeping and teaching aid.</strong> No real money moves here; ' +
      'you settle up between yourselves.</p>',
    hint:"The save pot"
  });

  /* ── 2. THE SAVE POT: interest, match, and what it becomes ── */
  var intAll = sumEntries(k.id, function(e){ return e.kind === "interest"; });
  var matAll = sumEntries(k.id, function(e){ return e.kind === "match"; });
  var wkIn = saveRate(k, now);
  var proj = sv, projInt = 0, pp = PERIODS[k.period] || PERIODS.week;
  var ticksAYear = pp.n, rpp = ratePerPeriod(k);
  for(var ti = 0; ti < ticksAYear; ti++){
    var add = r2(proj * rpp);
    projInt = r2(projInt + add);
    proj = r2(proj + add + r2(wkIn * (52 / ticksAYear)));
  }
  out.push({ key:"grow", kicker:"The lesson in one number",
    title:"Money that earns money",
    body:
      '<p class="figure">' + usd(sv) + '</p>' +
      '<p class="sub">in the save pot right now</p>' +
      '<dl class="lines">' +
        fact("Interest earned since day one", "+" + usd(intAll), "gain") +
        fact("Parent match earned since day one", "+" + usd(matAll), "gain") +
        fact("Next interest lands", prettyFull(nextTick)) +
        fact("And it should be about", "+" + usd(dueTick), "gain") +
        fact("Going into save, on average", usd(wkIn) + " a week") +
        fact("At this rate, twelve months from now",
             usd(proj) + " <span class=\"badge\">" + usd(projInt) + " of it interest</span>") +
      '</dl>' +
      '<hr class="rule">' +
      '<p class="kicker">The parent bank, set by you</p>' +
      '<div class="duo">' +
        field("Interest, % a year", 'type="number" min="0" max="50" step="0.25" value="' +
          k.rate + '" data-live="rate" data-kid="' + k.id + '" inputmode="decimal"', "rate:"+k.id) +
        '<label class="fieldline"><span>Added how often</span><select data-live="period" data-kid="' +
          k.id + '" data-k="per:' + k.id + '">' +
          ['week','month','quarter'].map(function(p){
            return '<option value="' + p + '"' + (k.period===p?' selected':'') + '>Every ' + p + '</option>';
          }).join("") + '</select></label>' +
      '</div>' +
      '<div class="duo">' +
        field("Parent match, % of save", 'type="number" min="0" max="200" step="5" value="' +
          k.match.pct + '" data-live="matchpct" data-kid="' + k.id + '" inputmode="decimal"', "mp:"+k.id) +
        field("Match cap, $ a week", 'type="number" min="0" step="0.5" value="' +
          usdPlain(k.match.cap) + '" data-live="matchcap" data-kid="' + k.id + '" inputmode="decimal"', "mc:"+k.id) +
      '</div>' +
      '<p class="tab-note">Interest is worked out on the balance standing at the start of each ' +
      esc(pp.unit) + ', then added as its own line in the ledger so it can be seen and argued with.</p>'
  });

  /* ── 3. THE SPLIT ─────────────────────────────────────────── */
  var demo = splitOf(k, 10);
  var demoMatch = k.match.pct ? r2(demo.save * k.match.pct / 100) : 0;
  out.push({ key:"split", kicker:"Every payout, every time",
    title:"Save, spend, give",
    body:
      '<p class="sub">Of every <strong>' + usd(10) + '</strong> ' + esc(k.name) + ' earns:</p>' +
      '<div class="pots">' +
        potRow("save", demo.save, k.split.save + "% of everything", demo.save/10*100) +
        potRow("spend", demo.spend, k.split.spend + "% of everything", demo.spend/10*100) +
        potRow("give", demo.give, k.split.give + "% of everything", demo.give/10*100) +
      '</div>' +
      (demoMatch > 0 ? '<dl class="lines">' + fact("…and the parent match adds", "+" + usd(demoMatch),
        "gain") + '</dl>' : "") +
      '<hr class="rule">' +
      '<div class="duo">' +
        field("Save %", 'type="number" min="0" max="100" step="1" value="' + k.split.save +
          '" data-live="save" data-kid="' + k.id + '" inputmode="numeric"', "sv:"+k.id) +
        field("Give %", 'type="number" min="0" max="100" step="1" value="' + k.split.give +
          '" data-live="give" data-kid="' + k.id + '" inputmode="numeric"', "gv:"+k.id) +
      '</div>' +
      '<p class="tab-note">Spend takes whatever is left — <strong>' + k.split.spend +
      '%</strong> — and carries the odd cent, so the three parts always add back to the exact amount earned.</p>'
  });

  /* ── 4. GOALS ─────────────────────────────────────────────── */
  var goalBody = "";
  if(!k.goals.length){
    goalBody = '<p class="sub">Nothing being saved for yet. Put a price on something and the ' +
      'arithmetic does the arguing.</p>';
  } else {
    k.goals.forEach(function(g, gi){
      var w = weeksToGoal(k, g.price, now);
      var pct = g.price > 0 ? Math.max(0, Math.min(100, (sv / g.price) * 100)) : 0;
      goalBody += (gi ? '<hr class="rule">' : "") +
        '<p class="kicker" style="margin-top:' + (gi ? 0 : 14) + 'px">Goal ' + (gi+1) + '</p>' +
        '<p class="leaf-title" style="font-size:1.42rem;margin-top:3px">' + esc(g.title) + '</p>' +
        '<p class="figure mid" style="margin-top:.16em">' +
          (w.done ? "Paid for" : usd(w.need)) + '</p>' +
        '<p class="sub" style="margin-top:2px">' +
          (w.done ? "there is enough in the save pot already"
                  : (w.weeks === null ? "still to find, and nothing is going in yet"
                     : "still to find &mdash; about " + w.weeks + " more week" +
                       (w.weeks === 1 ? "" : "s") + " at this rate")) + '</p>' +
        '<p class="metre"><i style="width:' + pct.toFixed(1) + '%"></i></p>' +
        '<dl class="lines">' +
          fact("Price", usd(g.price)) +
          fact("In the save pot", usd(sv)) +
          fact("Still to find", w.done ? "Nothing — it is paid for" : usd(w.need),
               w.done ? "gain" : "") +
          fact("Going in each week", w.rate > 0 ? usd(w.rate) : EM) +
          fact("Weeks at that rate", w.done ? "0" :
               (w.weeks === null ? EM + " <span class=\"badge\">nothing going in yet</span>"
                                 : String(w.weeks))) +
          (w.weeks ? fact("Which lands about", prettyFull(addDays(now, w.weeks * 7))) : "") +
        '</dl>' +
        '<div class="duo">' +
          field("Price, $", 'type="number" min="0" step="0.01" value="' + usdPlain(g.price) +
            '" data-live="goalprice" data-kid="' + k.id + '" data-id="' + g.id +
            '" inputmode="decimal"', "gp:"+g.id) +
          '<label class="fieldline"><span>&nbsp;</span>' +
          '<button class="press press-no press-small" type="button" data-act="delgoal" data-kid="' +
          k.id + '" data-id="' + g.id + '" style="width:100%">Remove this goal</button></label>' +
        '</div>';
    });
  }
  out.push({ key:"goal", kicker:"Wanting it now, priced up",
    title:"Saving up for",
    body: goalBody + '<hr class="rule">' +
      field("Add a goal", 'type="text" maxlength="60" placeholder="A skateboard, a game, a trip…" ' +
        'data-hold="goaltitle" data-kid="' + k.id + '"', "ngt:"+k.id) +
      '<div class="duo">' +
        field("Its price, $", 'type="number" min="0" step="0.01" placeholder="0.00" ' +
          'data-hold="goalprice" data-kid="' + k.id + '" inputmode="decimal"', "ngp:"+k.id) +
        '<label class="fieldline"><span>&nbsp;</span><button class="press press-coin press-small" ' +
          'type="button" data-act="addgoal" data-kid="' + k.id + '" style="width:100%">Add goal</button></label>' +
      '</div>'
  });

  /* ── 5. THE CHORE CARDS THEMSELVES ────────────────────────── */
  var mine = openFor(k.id, now);
  mine.slice(0, 8).forEach(function(c){
    var late = daysBetween(c.due, now);
    out.push({ key:"do:"+c.id, kicker: late > 0 ? "Due " + pretty(c.due) + " — " + late + " day" +
        (late===1?"":"s") + " ago" : (late === 0 ? "Due today" : "Due " + pretty(c.due)),
      title: esc(c.title),
      body:
        '<p class="figure mid">' + usd(c.value) + '</p>' +
        '<p class="sub">' + (c.screen ? "plus " + mins(c.screen) + " of screen time" :
          "no screen time on this one") + '</p>' +
        (c.note ? '<p class="tab-note warn">Sent back: <strong>' + esc(c.note) + '</strong></p>' : "") +
        '<div class="presses">' +
          '<button class="press press-yes" type="button" data-act="done" data-id="' + c.id +
            '">I&rsquo;ve done it</button>' +
          '<button class="press press-no" type="button" data-act="later" data-id="' + c.id +
            '">Not yet</button>' +
        '</div>' +
        '<p class="tab-note">Marking it done does not move any money. A parent has to approve it first ' +
        '— that is the whole point of the two steps.</p>',
      foot:'<span class="badge">' + esc(k.name) + '&rsquo;s to do</span>'
    });
  });

  /* ── 6. LOANS RUNNING THE OTHER WAY ───────────────────────── */
  S.loans.forEach(function(l){
    if(l.kid !== k.id) return;
    var bal = loanBalance(l.id);
    var charged = 0, paid = 0, lastPay = null;
    S.loanEvents.forEach(function(v){
      if(v.loan !== l.id) return;
      if(v.kind === "charge") charged = r2(charged + v.amt);
      if(v.kind === "pay"){ paid = r2(paid + v.amt); lastPay = v.on; }
    });
    var left = (bal > 0 && l.weekly > 0) ? Math.ceil(bal / l.weekly) : 0;
    out.push({ key:"loan:"+l.id, kicker: bal <= 0.004 ? "Paid off in full" : "Owed to the family bank",
      title: esc(l.title),
      body:
        '<p class="figure mid"' + (bal > 0 ? ' style="color:var(--flag)"' : '') + '>' +
          usd(Math.max(0, bal)) + '</p>' +
        '<p class="sub">' + (bal <= 0.004 ? "Cleared on " + prettyFull(l.closed || lastPay || now) :
          "still to pay back") + '</p>' +
        '<dl class="lines">' +
          fact("Borrowed", usd(l.principal)) +
          fact("Interest charged so far", usd(charged), "owe") +
          fact("Paid back so far", usd(paid), "gain") +
          fact("Coming out each week", usd(l.weekly)) +
          fact("Interest rate charged", l.apr.toFixed(2) + "% a year") +
          (bal > 0 ? fact("Weeks left at that rate", String(left)) : "") +
          (bal > 0 ? fact("Clear by", prettyFull(addDays(now, left*7))) : "") +
        '</dl>' +
        (bal > 0 ?
          '<hr class="rule"><div class="duo">' +
            field("Pay extra now, $", 'type="number" min="0" step="0.5" placeholder="0.00" ' +
              'data-hold="extra" data-kid="' + k.id + '" inputmode="decimal"', "ex:"+l.id) +
            '<label class="fieldline"><span>&nbsp;</span><button class="press press-coin press-small" ' +
            'type="button" data-act="loanextra" data-id="' + l.id + '" style="width:100%">' +
            'Pay it off faster</button></label></div>' +
          '<p class="tab-note">Every week the bank charges nothing extra for paying early — but every ' +
          'week it is not paid, <strong>' + usd(r2(bal * (l.apr/100) / 12)) +
          '</strong> of interest goes on in a month. That is the lesson.</p>'
          : '<p class="tab-note">Paid off. ' + esc(k.name) + ' borrowed ' + usd(l.principal) +
            ' and it cost ' + usd(charged) + ' in interest to do it.</p>')
    });
  });

  /* ── 7. MONEY THAT IS NOT CHORE MONEY ─────────────────────── */
  out.push({ key:"in", kicker:"Birthdays, grandparents, payslips",
    title:"Money in",
    body:
      '<p class="sub">Anything that arrives gets split the same way — ' + k.split.save +
      '% save, ' + k.split.spend + '% spend, ' + k.split.give + '% give — unless you say otherwise.</p>' +
      '<div class="chiprow">' +
        ["Birthday money","Grandparent cash","Wages","Sold something","Tooth fairy"].map(function(t){
          return '<button class="chip" type="button" data-act="preset" data-kid="' + k.id +
            '" data-t="' + esc(t) + '">' + esc(t) + '</button>';
        }).join("") +
      '</div>' +
      field("What was it?", 'type="text" maxlength="70" placeholder="Birthday money from Nan" ' +
        'data-hold="inwhat" data-kid="' + k.id + '"', "iw:"+k.id) +
      '<div class="duo">' +
        field("How much, $", 'type="number" min="0" step="0.01" placeholder="0.00" ' +
          'data-hold="inamt" data-kid="' + k.id + '" inputmode="decimal"', "ia:"+k.id) +
        field("On what date", 'type="date" value="' + now + '" data-hold="indate" data-kid="' +
          k.id + '"', "id:"+k.id) +
      '</div>' +
      '<div class="presses side">' +
        '<button class="press press-yes" type="button" data-act="income" data-kid="' + k.id +
          '" data-split="1">Split it three ways</button>' +
        '<button class="press press-no" type="button" data-act="income" data-kid="' + k.id +
          '" data-split="0">All to spend</button>' +
      '</div>'
  });

  /* ── 8. MONEY OUT ─────────────────────────────────────────── */
  out.push({ key:"out", kicker:"Spent it, gave it away",
    title:"Money out",
    body:
      '<p class="sub">Take money out of a pot so the ledger tells the truth.</p>' +
      field("What for?", 'type="text" maxlength="70" placeholder="Cinema ticket" ' +
        'data-hold="outwhat" data-kid="' + k.id + '"', "ow:"+k.id) +
      '<div class="duo">' +
        field("How much, $", 'type="number" min="0" step="0.01" placeholder="0.00" ' +
          'data-hold="outamt" data-kid="' + k.id + '" inputmode="decimal"', "oa:"+k.id) +
        '<label class="fieldline"><span>Out of which pot</span><select data-hold="outpot" data-kid="' +
          k.id + '" data-k="op:' + k.id + '">' +
          '<option value="spend">Spend — ' + usd(sp) + '</option>' +
          '<option value="give">Give — ' + usd(gv) + '</option>' +
          '<option value="save">Save — ' + usd(sv) + '</option>' +
        '</select></label>' +
      '</div>' +
      '<div class="presses"><button class="press" type="button" data-act="spendout" data-kid="' +
        k.id + '">Take it out</button></div>' +
      '<hr class="rule">' +
      '<p class="kicker">Screen time — the other currency</p>' +
      '<p class="sub">' + esc(k.name) + ' has <strong>' + mins(sc) + '</strong> banked.</p>' +
      S.perks.map(function(p){
        return '<div class="stub"><span class="stub-what">' + esc(p.title) + '</span>' +
          '<span class="stub-amt">' + mins(p.cost) + '</span>' +
          '<span class="stub-acts"><button class="press press-no press-small" type="button" ' +
          'data-act="perk" data-kid="' + k.id + '" data-id="' + p.id + '"' +
          (sc < p.cost ? ' disabled style="opacity:.45"' : '') + '>' +
          (sc < p.cost ? "Not enough banked" : "Spend " + mins(p.cost)) + '</button></span></div>';
      }).join("")
  });

  /* ── 9. THE LEDGER ────────────────────────────────────────── */
  var recent = S.entries.filter(function(e){ return e.kid === k.id; })
    .sort(function(a,b){ var c = daysBetween(b.on, a.on); return c !== 0 ? (c>0?1:-1) : b.seq - a.seq; })
    .slice(0, 14);
  var q = quarterOf(now);
  out.push({ key:"ledger", kicker:"Every credit and every debit",
    title:"The ledger",
    body:
      (recent.length ? recent.map(function(e){
        var amtTxt = e.pot === "screen" ? (e.amt > 0 ? "+" : "") + mins(e.amt)
                                        : (e.amt > 0 ? "+" : "") + usd(e.amt);
        return '<div class="ledger-line"><span class="lg-when">' + pretty(e.on) + '</span>' +
          '<span class="lg-what">' + esc(e.what) + '</span>' +
          '<span class="lg-amt ' + (e.amt >= 0 ? "money-in" : "money-out") + '">' + amtTxt + '</span>' +
          '<span class="lg-tag">' + esc(POTNAME[e.pot]) + ' &middot; ' + esc(e.kind) + '</span></div>';
      }).join("") : '<p class="sub">Nothing in the ledger yet.</p>') +
      '<hr class="rule">' +
      '<dl class="lines">' +
        fact("Chores approved, all time",
          String(S.cards.filter(function(c){ return c.kid === k.id && c.state === "paid"; }).length)) +
        fact("Earned from chores, all time",
          usd(sumEntries(k.id, function(e){ return e.kind === "earn" && e.amt > 0 && e.pot !== "screen"; }))) +
        fact("Interest and match, all time", usd(r2(intAll + matAll)), "gain") +
      '</dl>' +
      '<div class="presses">' +
        '<button class="press press-coin" type="button" data-act="print" data-kid="' + k.id +
          '">Print ' + esc(k.name) + '&rsquo;s ' + esc(q.label) + ' statement</button>' +
        '<button class="press press-no" type="button" data-act="csv" data-kid="' + k.id +
          '">Export ' + esc(k.name) + '&rsquo;s ledger as CSV</button>' +
      '</div>',
    foot:'<span class="badge">' + esc(q.label) + '</span>'
  });

  return out;
}
/* ══════════════════════════════════════════════════════════════
   10. THE PARENTS' DESK
   ══════════════════════════════════════════════════════════════ */
var hold = {};
function held(name, id){
  var v = hold[name + ":" + id];
  return v === undefined ? "" : v;
}
var BACK_REASONS = ["Not finished properly","Do it again tomorrow","That was your brother",
  "Already paid for that one"];

function deskLeaves(now){
  var out = [];

  /* ── the approval queue: five cards in twenty seconds ────── */
  var q = waitingAll();
  out.push({ key:"queue", kicker: q.length ? q.length + " waiting on you" : "Nothing waiting",
    title:"Approve or send back",
    body: q.length ? q.slice(0, 12).map(function(c){
      var k = kidById(c.kid); if(!k) return "";
      var sp = splitOf(k, c.value);
      var chosen = held("reason", c.id);
      return '<div class="stub">' +
        '<span class="stub-what">' + esc(c.title) + '</span>' +
        '<span class="stub-amt">' + usd(c.value) + '</span>' +
        '<span class="stub-who">' + esc(k.name) + ' &middot; marked done ' +
          pretty(c.markedOn || c.due) + ' &middot; ' + usd(sp.save) + ' save / ' +
          usd(sp.spend) + ' spend / ' + usd(sp.give) + ' give' +
          (c.screen ? ' &middot; ' + mins(c.screen) : '') + '</span>' +
        '<span class="stub-acts">' +
          '<button class="press press-yes press-small" type="button" data-act="approve" data-id="' +
            c.id + '">Approve ' + usd(c.value) + '</button>' +
          '<button class="press press-no press-small" type="button" data-act="backopen" data-id="' +
            c.id + '">Send back</button>' +
        '</span>' +
        (chosen === "open" ? '<span class="stub-acts" style="flex-wrap:wrap">' +
          BACK_REASONS.map(function(r){
            return '<button class="chip" type="button" data-act="back" data-id="' + c.id +
              '" data-r="' + esc(r) + '">' + esc(r) + '</button>';
          }).join("") + '</span>' : "") +
      '</div>';
    }).join("")
    : (S.kids.length
      ? '<p class="sub">Every card is either done and paid or still out there. ' +
        'Nothing needs a decision from you right now.</p>' +
        '<p class="tab-note">This is the point. The deck should be empty most days &mdash; ' +
        'the interest ticks on a calendar whether or not anybody did a chore.</p>'
      : '<p class="sub">There is nobody in the deck yet, so there is nothing to approve. ' +
        'Add a child first.</p>'),
    foot:'<span class="badge' + (q.length ? ' hot' : '') + '">' + q.length + ' to approve</span>'
  });

  /* ── the children ─────────────────────────────────────────── */
  var peopleBody = S.kids.length ? S.kids.map(function(k){
    var a = ageOn(k.dob, now);
