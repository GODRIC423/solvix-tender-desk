function todayISO(){
  var n = new Date();
  var m = String(n.getMonth()+1).padStart(2,"0"), d = String(n.getDate()).padStart(2,"0");
  return n.getFullYear()+"-"+m+"-"+d;
}
function addDaysISO(iso,n){
  var t = isoToUTC(iso); if(t==null) return iso;
  var d = new Date(t + n*86400000);
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
}
function daysBetween(a,b){
  var ta=isoToUTC(a), tb=isoToUTC(b);
  if(ta==null||tb==null) return null;
  return Math.round((tb-ta)/86400000);
}
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function fmtDate(iso,short){
  var t = isoToUTC(iso); if(t==null) return "—";
  var d = new Date(t);
  var mn = MONTHS[d.getUTCMonth()];
  return d.getUTCDate()+" "+(short? mn.slice(0,3) : mn)+" "+d.getUTCFullYear();
}
function fmtSpan(a,b){
  var ta=isoToUTC(a), tb=isoToUTC(b);
  if(ta==null||tb==null) return "—";
  var da=new Date(ta), db=new Date(tb);
  if(da.getUTCFullYear()===db.getUTCFullYear() && da.getUTCMonth()===db.getUTCMonth())
    return da.getUTCDate()+"–"+db.getUTCDate()+" "+MONTHS[db.getUTCMonth()]+" "+db.getUTCFullYear();
  if(da.getUTCFullYear()===db.getUTCFullYear())
    return da.getUTCDate()+" "+MONTHS[da.getUTCMonth()].slice(0,3)+" – "+db.getUTCDate()+" "+MONTHS[db.getUTCMonth()].slice(0,3)+" "+db.getUTCFullYear();
  return fmtDate(a,true)+" – "+fmtDate(b,true);
}
/* exact age in whole years, leap-safe (29 Feb birthdays roll to 1 March) */
function ageAt(dob,at){
  var tb=isoToUTC(dob), ta=isoToUTC(at);
  if(tb==null||ta==null||ta<tb) return null;
  var b=new Date(tb), n=new Date(ta);
  var y = n.getUTCFullYear()-b.getUTCFullYear();
  var m = n.getUTCMonth()-b.getUTCMonth();
  if(m<0 || (m===0 && n.getUTCDate()<b.getUTCDate())) y--;
  return y<0?0:y;
}

/* ===================== state ===================== */
var state = null;
var view = {x:0,y:0,z:1};
var focusWho = "N";
var layoutBucket = null;

function seedState(){
  var cards = SEED_ROWS.map(function(r){
    return {
      id:r[0], dom:r[1], title:r[2],
      notice:r[3], plan:r[4], exec:r[5],
      freq:r[6], mins:r[7], stakes:r[8],
      trigger:r[9], timing:r[10], contacts:r[11], standard:r[12],
      readyAge:(r[13]==null?null:r[13]), nextDue:r[14]||"",
      transfer: SEED_TRANSFERS[r[0]] ? JSON.parse(JSON.stringify(SEED_TRANSFERS[r[0]])) : null
    };
  });
  var pa = {};
  cards.forEach(function(c){
    var d = SEED_PARTNER_DIFF[c.id] || {};
    pa[c.id] = (d.notice||c.notice||"-") + (d.plan||c.plan||"-") + (d.exec||c.exec||"-");
  });
  var st = {
    v:1, sample:true, mine:"N",
    people: JSON.parse(JSON.stringify(SEED_PEOPLE)),
    cards: cards,
    events: JSON.parse(JSON.stringify(SEED_EVENTS)),
    partner: {who:"T", when:"2026-09-02", a:pa},
    gapLog: [{date:"2026-03-08", gap:16.3, parts:29, of:177}],
    pack: {who:"N", from:"", to:"", cover:"T"}
  };
  var g = gapOf(st, st.partner);
  st.gapLog.push({date:st.partner.when, gap:g.pct, parts:g.parts, of:g.of});
  return st;
}
function load(){
  var raw = null;
  try{ raw = window.localStorage.getItem(LSK); }catch(e){ raw = null; }
  if(!raw) return seedState();
  try{
    var s = JSON.parse(raw);
    if(!s || !Array.isArray(s.cards) || !Array.isArray(s.people)) return seedState();
    s.events = Array.isArray(s.events)? s.events : [];
    s.gapLog = Array.isArray(s.gapLog)? s.gapLog : [];
    s.pack = s.pack || {who:"N",from:"",to:"",cover:"T"};
    s.mine = s.mine || (s.people[0] && s.people[0].id) || "N";
    s.cards.forEach(function(c){
      c.readyAge = (c.readyAge===null||c.readyAge===undefined||c.readyAge==="")?null:num(c.readyAge,null);
      c.nextDue = c.nextDue || "";
      if(!FREQ[c.freq]) c.freq = "w";
      c.mins = Math.max(0, num(c.mins,0));
      c.stakes = STAKES[c.stakes]? c.stakes : 2;
    });
    return s;
  }catch(e){ return seedState(); }
}
var saveWarned = false;
function save(){
  try{ window.localStorage.setItem(LSK, JSON.stringify(state)); }
  catch(e){
    if(!saveWarned){ saveWarned = true; var s=$("#podSub"); if(s){ s.textContent = "Not saved on this device"; } }
  }
}

/* ===================== people ===================== */
function person(id){
  for(var i=0;i<state.people.length;i++) if(state.people[i].id===id) return state.people[i];
  return null;
}
function personName(id){ var p=person(id); return p? p.name : (id? id : "Nobody"); }
function holdColour(id){
  var p = person(id);
  if(!p) return "var(--hold-x)";
  var v = getComputedStyle(document.documentElement).getPropertyValue("--hold-"+id);
  return v && v.trim() ? v.trim() : "var(--hold-x)";
}
function holdVar(id){ return person(id) ? ("var(--hold-"+id+", var(--hold-x))") : "var(--hold-x)"; }
function adults(){ return state.people.filter(function(p){ return p.kind==="adult"; }); }
function otherAdult(id){
  var a = adults();
  for(var i=0;i<a.length;i++) if(a[i].id!==id) return a[i].id;
  return a.length? a[0].id : null;
}
function initials(id){ var p=person(id); return p? p.name.slice(0,1).toUpperCase()+(p.name.slice(1,2)||"").toLowerCase() : "–"; }

/* ===================== the computation ===================== */
function cardMetrics(c){
  var per   = FREQ[c.freq] ? FREQ[c.freq].per : 0;
  var mins  = Math.max(0, num(c.mins,0));
  var sk    = STAKES[c.stakes] || STAKES[2];
  var nMin  = Math.max(NOTICE_FLOOR, NOTICE_SHARE*mins) * sk.factor;
  var pMin  = Math.max(PLAN_FLOOR,   PLAN_SHARE*mins)   * sk.factor;
  var execH = per*mins/60;
  var notH  = per*nMin/60;
  var plnH  = per*pMin/60;
  return {
    per:per, mins:mins, noticeMins:nMin, planMins:pMin,
    execH:execH, noticeH:notH, planH:plnH,
    noticeW:KAPPA*notH, planW:KAPPA*plnH,
    invisW:KAPPA*(notH+plnH),
    weighted:execH + KAPPA*(notH+plnH)
  };
}
/* one card holds all three parts with the same person */
function soloHolder(c){
  if(!c.notice) return null;
  return (c.notice===c.plan && c.plan===c.exec) ? c.notice : null;
}
function driftOf(c){
  if(!c.transfer || !c.transfer.want) return null;
  var gone = [];
  PART_KEYS.forEach(function(k){
    var want = c.transfer.want[k];
    if(want && c[k]!==want) gone.push(k);
  });
  var days = daysBetween(c.transfer.date, todayISO());
  return {parts:gone, drifted:gone.length>0, days:(days==null?null:days), want:c.transfer.want, date:c.transfer.date, note:c.transfer.note||""};
}
/* who a card could be handed to next, by age */
function readyFor(c){
  if(c.readyAge==null) return null;
  var t = todayISO(), best = null;
  state.people.forEach(function(p){
    if(p.kind!=="child" || !p.dob) return;
    var a = ageAt(p.dob,t);
    if(a==null || a < c.readyAge) return;
    if(c.exec===p.id && c.plan===p.id) return;      /* already theirs enough */
    if(!best || a<best.age) best = {id:p.id, name:p.name, age:a};
  });
  return best;
}

function tally(override){
  var who = {}, i;
  state.people.forEach(function(p){ who[p.id] = {id:p.id, cardShare:0, execH:0, invisW:0, noticeW:0, planW:0, weighted:0}; });
  who["-"] = {id:"-", cardShare:0, execH:0, invisW:0, noticeW:0, planW:0, weighted:0};
  var tot = {cards:0, cardShare:0, execH:0, invisW:0, weighted:0};
  var spf = [], drifts = [], ready = [];
  for(i=0;i<state.cards.length;i++){
    var c = state.cards[i];
    var g = {notice:c.notice, plan:c.plan, exec:c.exec};
    if(override && override.id===c.id){
      if(override.parts){ override.parts.forEach(function(k){ g[k]=override.who; }); }
    }
    var m = cardMetrics(c);
    tot.cards++;
    tot.execH  += m.execH;
    tot.invisW += m.invisW;
    tot.weighted += m.weighted;
    tot.cardShare += 1;
    var slot = function(id){ return who[id] || who["-"]; };
    slot(g.exec).execH += m.execH;
    slot(g.exec).weighted += m.execH;
    slot(g.notice).noticeW += m.noticeW;
    slot(g.notice).invisW  += m.noticeW;
    slot(g.notice).weighted += m.noticeW;
    slot(g.plan).planW += m.planW;
    slot(g.plan).invisW += m.planW;
    slot(g.plan).weighted += m.planW;
    slot(g.notice).cardShare += 1/3;
    slot(g.plan).cardShare   += 1/3;
    slot(g.exec).cardShare   += 1/3;
    if(!override){
      var s = (g.notice && g.notice===g.plan && g.plan===g.exec) ? g.notice : null;
      if(s) spf.push({card:c, who:s, m:m});
      var d = driftOf(c);
      if(d) drifts.push({c:c, d:d});
      var r = readyFor(c);
      if(r) ready.push({card:c, to:r});
    }
  }
  spf.sort(function(a,b){ return b.m.weighted - a.m.weighted; });
  drifts.sort(function(a,b){ return (b.d.drifted?1:0)-(a.d.drifted?1:0) || (b.d.days||0)-(a.d.days||0); });
  return {who:who, tot:tot, spf:spf, drifts:drifts, ready:ready};
}

/* ===================== blind merge ===================== */
function b64enc(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64dec(b64){
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function myCode(){
  var a = {};
  state.cards.forEach(function(c){ a[c.id] = (c.notice||"-")+(c.plan||"-")+(c.exec||"-"); });
  var payload = JSON.stringify({v:1, who:state.mine, when:todayISO(), a:a});
  return "LOAD1." + b64enc(payload).replace(/=+$/,"");
}
function readCode(txt){
  txt = String(txt||"").trim().replace(/\s+/g,"");
  var ix = txt.indexOf("LOAD1.");
  if(ix<0) throw new Error("That doesn't look like a Load code. It should start with LOAD1.");
  var b = txt.slice(ix+6);
  while(b.length % 4) b += "=";
  var obj = JSON.parse(b64dec(b));
  if(!obj || !obj.a || typeof obj.a !== "object") throw new Error("The code is incomplete.");
  if(!obj.who) obj.who = "?";
  return obj;
}
function gapOf(st, partner){
  if(!partner || !partner.a) return {pct:null, parts:0, of:0, lines:[]};
  var lines = [], parts = 0, of = 0;
  st.cards.forEach(function(c){
    var s = partner.a[c.id];
    if(!s || s.length<3) return;
    var theirs = {notice:s[0], plan:s[1], exec:s[2]};
    PART_KEYS.forEach(function(k,ix){
      of++;
      var mineWho = c[k] || "-";
      var theirWho = theirs[k] || "-";
      if(mineWho===theirWho) return;
      parts++;
      var kind = "other";
      if(mineWho===st.mine && theirWho===partner.who) kind = "contested";
      else if(mineWho===partner.who && theirWho===st.mine) kind = "orphan";
      lines.push({cardId:c.id, title:c.title, dom:c.dom, part:k, mine:mineWho, theirs:theirWho, kind:kind});
    });
  });
  var order = {orphan:0, contested:1, other:2};
  lines.sort(function(a,b){ return order[a.kind]-order[b.kind] || a.title.localeCompare(b.title); });
  return {pct: (of>0 ? parts/of*100 : null), parts:parts, of:of, lines:lines};
}
</script>
<script>
"use strict";
/* ===================== board painting ===================== */
var TACK_W = 216, TACK_GAP = 11, PLOT_PADX = 15, GUTTER = 26;

function bucketOf(){
  var w = window.innerWidth;
  return w>=1240 ? "wide" : (w>=760 ? "mid" : "thin");
}
function bedCols(){ return bucketOf()==="thin" ? 1 : 2; }
function boardCols(){ var w=window.innerWidth; return w>=1700?3:(w>=760?2:1); }
function plotWidth(){ var n=bedCols(); return PLOT_PADX*2 + n*TACK_W + (n-1)*TACK_GAP; }

function tackInner(c){
  var m = cardMetrics(c);
  var solo = soloHolder(c);
  var d = driftOf(c);
  var r = readyFor(c);
  var chips = PART_KEYS.map(function(k){
    var id = c[k];
    return '<button class="chip" type="button" data-chip="'+k+'" data-cid="'+esc(c.id)+'"'
      + (id?'':' data-empty="1"')
      + ' style="--chip-hold:'+holdVar(id)+'"'
      + ' aria-label="'+esc(PART_NAME[k]+" of "+c.title+" — currently "+(id?personName(id):"nobody")+". Activate to reassign.")+'">'
      + '<span class="chip-key">'+PART_SHORT[k]+'</span>'
      + '<span class="chip-who">'+esc(id?initials(id):"—")+'</span></button>';
  }).join("");
  var nubs = [];
  var whole = d ? (d.want.notice && d.want.notice===d.want.plan && d.want.plan===d.want.exec) : false;
  if(d && d.drifted) nubs.push('<span class="nub" data-tone="alarm">'+(whole?"Full handover":"Partial")+' drifted back</span>');
  else if(d) nubs.push('<span class="nub" data-tone="hold">'+(whole?"Full handover":"Partial, agreed")+' · '+esc(fmtDate(d.date,true))+'</span>');
  if(r) nubs.push('<span class="nub" data-tone="pass">Ready for '+esc(r.name)+' ('+r.age+')</span>');
  if(c.nextDue) nubs.push('<span class="nub" data-tone="watch">Due '+esc(fmtDate(c.nextDue,true))+'</span>');
  return ''
    + '<button class="tack-grip" type="button" data-grip="'+esc(c.id)+'" aria-label="'+esc(c.title+" — open, or drag to hand over all three parts")+'">'
    +   '<span class="tack-name">'+esc(c.title)+'</span>'
    +   '<span class="tack-meta"><span class="tack-freq">'+esc(FREQ[c.freq]?FREQ[c.freq].label:"—")+'</span>'
    +   '<span class="tack-figs"><span class="tack-hrs">'+f1(m.execH)+'h</span> <em>doing</em> &nbsp;<span class="tack-hrs">'+f1(m.invisW)+'h</span> <em>unseen</em></span></span>'
    + '</button>'
    + '<div class="tack-parts">'+chips+'</div>'
    + (nubs.length? '<div class="tack-tail">'+nubs.join("")+'</div>' : '');
}
function tackAttrs(el,c){
  var solo = soloHolder(c), d = driftOf(c);
  el.setAttribute("data-solo", solo? "1":"0");
  el.setAttribute("data-drift", (d && d.drifted)? "1":"0");
  el.style.setProperty("--hold-x", "var(--hold-"+(c.exec||"x")+", #5a554d)");
}
function repaintTack(id){
  var c = cardById(id); if(!c) return;
  var el = plane.querySelector('[data-tack="'+CSS.escape(id)+'"]');
  if(!el){ paintBoard(); return; }
  el.innerHTML = tackInner(c);
  tackAttrs(el,c);
}
function cardById(id){
  for(var i=0;i<state.cards.length;i++) if(state.cards[i].id===id) return state.cards[i];
  return null;
}
function paintBoard(){
  plane.innerHTML = "";
  layoutBucket = bucketOf();
  var cols = boardCols(), pw = plotWidth();
  if(!state.cards.length){
    var empty = document.createElement("div");
    empty.className = "plot";
    empty.style.cssText = "left:0;top:0;width:"+pw+"px";
    empty.innerHTML = '<h3 class="plot-tag">Empty board</h3>'
      + '<p style="font-size:13.5px;color:#241f1a;margin:0 0 10px">Nothing is mapped yet. Add the first thing somebody in this house has to remember.</p>'
      + '<button class="press" data-lead type="button" data-open="new">Add a responsibility</button> '
      + '<button class="press" type="button" data-open="reseed">Load the sample family</button>';
    plane.appendChild(empty);
    plane.style.width = pw+"px"; plane.style.height = "260px";
    return;
  }
  var plots = [];
  DOMAINS.concat([{id:"__other",name:"Everything else"}]).forEach(function(dm){
    var list = state.cards.filter(function(c){
      return dm.id==="__other" ? !DOMAINS.some(function(x){return x.id===c.dom;}) : c.dom===dm.id;
    });
    if(!list.length) return;
    var hrs = 0, inv = 0;
    list.forEach(function(c){ var m=cardMetrics(c); hrs+=m.execH; inv+=m.invisW; });
    var box = document.createElement("section");
    box.className = "plot";
    box.style.width = pw+"px";
    box.setAttribute("aria-label", dm.name);
    var bed = '<div class="plot-bed" style="--bed-cols:'+bedCols()+'">'
      + list.map(function(c){
          var so = soloHolder(c);
          return '<article class="tack" data-tack="'+esc(c.id)+'"'
            + (so? ' title="'+esc(personName(so)+" holds all three parts — a single point of failure")+'"':'')
            + '>'+tackInner(c)+'</article>';
        }).join("") + '</div>';
    box.innerHTML = '<h3 class="plot-tag">'+esc(dm.name)
      + '<span class="plot-tally">'+list.length+' · '+f1(hrs)+'h doing · '+f1(inv)+'h unseen</span></h3>' + bed;
    plane.appendChild(box);
    plots.push(box);
    list.forEach(function(c){
      var el = box.querySelector('[data-tack="'+CSS.escape(c.id)+'"]');
      if(el) tackAttrs(el,c);
    });
  });
  var colY = []; for(var k=0;k<cols;k++) colY.push(0);
  plots.forEach(function(p){
    var h = p.offsetHeight;
    var best = 0;
    for(var k=1;k<cols;k++) if(colY[k] < colY[best]-0.5) best = k;
    p.style.left = (best*(pw+GUTTER))+"px";
    p.style.top  = colY[best]+"px";
    colY[best] += h + GUTTER;
  });
  var maxY = 0; colY.forEach(function(v){ if(v>maxY) maxY=v; });
  plane.style.width = (cols*pw + (cols-1)*GUTTER)+"px";
  plane.style.height = Math.max(maxY-GUTTER, 200)+"px";
}

/* ===================== pan and zoom ===================== */
function applyView(){
  plane.style.transform = "translate("+view.x.toFixed(1)+"px,"+view.y.toFixed(1)+"px) scale("+view.z.toFixed(3)+")";
  var r = $("#zoomRead"); if(r) r.textContent = Math.round(view.z*100)+"%";
}
function chromeInset(){
  var thin = bucketOf()==="thin";
  return {
    top: thin? 116 : 74,
    bottom: thin? 226 : 130,
    left: 16,
    right: thin? 16 : 178
  };
}
function fitBoard(){
  var ins = chromeInset();
  var bw = plane.offsetWidth || 1, bh = plane.offsetHeight || 1;
  var availW = Math.max(120, window.innerWidth - ins.left - ins.right - 20);
  var availH = Math.max(120, window.innerHeight - ins.top - ins.bottom - 16);
  var z = clamp(availW/bw, 0.46, 1.0);
  if(bh*z < availH) z = clamp(Math.min(availW/bw, availH/bh), z, 1.0);
  view.z = z;
  view.x = clamp((window.innerWidth - bw*z)/2, ins.left, Math.max(ins.left, window.innerWidth - ins.right - bw*z));
  view.y = ins.top + 6;
  applyView();
}
function zoomAt(cx,cy,nz){
  nz = clamp(nz, 0.24, 2.4);
  view.x = cx - (cx - view.x)*(nz/view.z);
  view.y = cy - (cy - view.y)*(nz/view.z);
  view.z = nz;
  applyView();
}
function zoomCentre(mult){
  var r = frame.getBoundingClientRect();
  zoomAt(r.width/2, r.height/2, view.z*mult);
}
$("#zoomIn").addEventListener("click", function(){ zoomCentre(1.22); });
$("#zoomOut").addEventListener("click", function(){ zoomCentre(1/1.22); });
$("#zoomFit").addEventListener("click", function(){ fitBoard(); });

frame.addEventListener("wheel", function(e){
  e.preventDefault();
  var r = frame.getBoundingClientRect();
  var factor = Math.exp(-e.deltaY * (e.deltaMode===1 ? 0.03 : 0.0016));
  zoomAt(e.clientX-r.left, e.clientY-r.top, view.z*factor);
}, {passive:false});

var pans = new Map(), panStart = null, pinchStart = null;
frame.addEventListener("pointerdown", function(e){
  if(drag.on) return;
  var t = e.target;
  if(t.closest && (t.closest(".chip") || t.closest(".tack-grip") || t.closest(".press"))) return;
  pans.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pans.size===1){
    panStart = {x:e.clientX, y:e.clientY, vx:view.x, vy:view.y};
    frame.classList.add("is-drag");
    try{ frame.setPointerCapture(e.pointerId); }catch(err){}
  } else if(pans.size===2){
    var pts = Array.from(pans.values());
    var d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    var r = frame.getBoundingClientRect();
    pinchStart = {d:d||1, z:view.z, cx:(pts[0].x+pts[1].x)/2-r.left, cy:(pts[0].y+pts[1].y)/2-r.top};
    panStart = null;
  }
});
frame.addEventListener("pointermove", function(e){
  if(!pans.has(e.pointerId)) return;
  pans.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinchStart && pans.size>=2){
    var pts = Array.from(pans.values());
    var d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
    zoomAt(pinchStart.cx, pinchStart.cy, pinchStart.z * (d/pinchStart.d));
  } else if(panStart){
    view.x = panStart.vx + (e.clientX - panStart.x);
    view.y = panStart.vy + (e.clientY - panStart.y);
    applyView();
  }
});
function endPan(e){
  pans.delete(e.pointerId);
  if(pans.size<2) pinchStart = null;
  if(pans.size===0){ panStart = null; frame.classList.remove("is-drag"); }
}
frame.addEventListener("pointerup", endPan);
frame.addEventListener("pointercancel", endPan);
frame.addEventListener("keydown", function(e){
  var step = e.shiftKey? 220 : 70;
  if(e.key==="ArrowLeft"){ view.x += step; applyView(); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ view.x -= step; applyView(); e.preventDefault(); }
  else if(e.key==="ArrowUp"){ view.y += step; applyView(); e.preventDefault(); }
  else if(e.key==="ArrowDown"){ view.y -= step; applyView(); e.preventDefault(); }
  else if(e.key==="+"||e.key==="="){ zoomCentre(1.22); e.preventDefault(); }
  else if(e.key==="-"||e.key==="_"){ zoomCentre(1/1.22); e.preventDefault(); }
  else if(e.key==="0"){ fitBoard(); e.preventDefault(); }
});
frame.tabIndex = 0;

/* ===================== beam + docks ===================== */
function paintBeam(preview){
  var t = tally(preview||null);
  var f = focusWho;
  var w = t.who[f] || {cardShare:0, execH:0, invisW:0};
  var base = preview ? tally(null) : t;
  var bw = base.who[f] || {cardShare:0, execH:0, invisW:0};
  var cuts = [
    {key:"Cards", val:w.cardShare, tot:t.tot.cardShare, was:bw.cardShare, wasTot:base.tot.cardShare,
     note:"Counted in thirds: noticing, planning, doing.", star:0, field:"cardShare"},
    {key:"Time", val:w.execH, tot:t.tot.execH, was:bw.execH, wasTot:base.tot.execH,
     note:"Hours a year of actually doing it.", star:0, field:"execH"},
    {key:"Invisible", val:w.invisW, tot:t.tot.invisW, was:bw.invisW, wasTot:base.tot.invisW,
     note:"Weighted noticing and planning.", star:1, field:"invisW"}
  ];
  var html = cuts.map(function(cu){
    var now = pctNum(cu.val, cu.tot);
    var before = pctNum(cu.was, cu.wasTot);
    var shift = (preview && now!=null && before!=null && Math.abs(now-before)>=0.05)
      ? '<span class="beam-shift">'+(now>before?"+":"−")+Math.abs(Math.round((now-before)*10)/10).toFixed(1)+'</span>' : "";
    var lanes = state.people.map(function(p){
      var v = t.who[p.id] ? t.who[p.id][cu.field] : 0;
      var pc = pctNum(v, cu.tot);
      return pc && pc>0 ? '<i style="width:'+pc.toFixed(2)+'%;background:'+holdVar(p.id)+'"></i>' : "";
    }).join("");
    var un = t.who["-"] ? pctNum(t.who["-"][cu.field], cu.tot) : null;
    if(un && un>0) lanes += '<i style="width:'+un.toFixed(2)+'%;background:repeating-linear-gradient(45deg,#a49c8e 0 3px,#8b8375 3px 6px)"></i>';
    return '<div class="beam-cut" data-star="'+cu.star+'">'
      + '<div class="beam-key">'+cu.key+'</div>'
      + '<div class="beam-fig"><b>'+(now==null?"—":(now>0&&now<0.5?"<1":Math.round(now)))+'</b><span>'+(now==null?"":"%")+'</span>'+shift+'</div>'
      + '<div class="beam-lane" role="img" aria-label="'+esc(cu.key+" split across the household")+'">'+lanes+'</div>'
      + '<div class="beam-note">'+esc(cu.note)+'</div>'
      + '</div>';
  }).join("");
  $("#beamSet").innerHTML = html;
  var other = otherAdult(f);
  var oNow = other && t.who[other] ? pctNum(t.who[other].invisW, t.tot.invisW) : null;
  $("#beamWho").innerHTML = '<b>'+esc(personName(f))+'</b>'
    + (oNow!=null? ' · '+esc(personName(other))+' carries '+pctShort(t.who[other].invisW, t.tot.invisW)+' of the invisible' : '');
  paintDocks(t, preview);
}
var dockSig = "";
function paintDocks(t, preview){
  t = t || tally(preview||null);
  var rail = $("#dockRail");
  var maxW = 0;
  state.people.forEach(function(p){ var v=t.who[p.id]?t.who[p.id].weighted:0; if(v>maxW) maxW=v; });
  var sig = state.people.map(function(p){ return p.id+"~"+p.name+"~"+(p.dob||""); }).join("|")+"/"+state.mine;
  if(sig !== dockSig){
    rail.innerHTML = state.people.map(function(p){
      var age = (p.kind==="child" && p.dob) ? ageAt(p.dob, todayISO()) : null;
      return '<button class="dock" type="button" data-dock="'+esc(p.id)+'" style="--dock-hold:'+holdVar(p.id)+'">'
        + '<span class="dock-top"><span class="dock-name">'+esc(p.name)+'</span>'
        + (age!=null? '<span class="dock-age">'+age+'</span>' : (p.id===state.mine? '<span class="dock-age">you</span>':''))+'</span>'
        + '<span class="dock-fig"></span><span class="dock-sub"></span>'
        + '<span class="dock-bar"><i style="width:0%"></i></span></button>';
    }).join("");
    dockSig = sig;
  }
  state.people.forEach(function(p){
    var el = rail.querySelector('[data-dock="'+CSS.escape(p.id)+'"]');
    if(!el) return;
    var w = t.who[p.id] || {weighted:0};
    var txt = pctShort(w.weighted, t.tot.weighted);
    el.querySelector(".dock-fig").textContent = txt;
    el.querySelector(".dock-sub").textContent = f1(w.weighted)+" weighted hrs/yr";
    el.querySelector(".dock-bar i").style.width = (maxW>0? (w.weighted/maxW*100):0).toFixed(1)+"%";
    el.setAttribute("aria-label", personName(p.id)+" carries "+txt
      + " of the weighted load. Select to focus, or drop a part here.");
  });
}

/* ===================== the signature: drag a part to a person ===================== */
var drag = {on:false, id:null, parts:null, ghost:null, target:null, moved:false, startX:0, startY:0, pid:null};
function ghostFor(cardId, parts){
  var c = cardById(cardId);
  var g = document.createElement("div");
  g.className = "ghost";
  g.innerHTML = '<small>'+(parts.length===3? "All three parts" : PART_NAME[parts[0]])+'</small>'+esc(c?c.title:"");
  document.body.appendChild(g);
  return g;
}
function dockUnder(x,y){
  var els = document.elementsFromPoint(x,y);
  for(var i=0;i<els.length;i++){
    var d = els[i].closest && els[i].closest("[data-dock]");
    if(d) return d;
  }
  return null;
}
function beginDrag(e, cardId, parts){
  drag.on = true; drag.id = cardId; drag.parts = parts; drag.moved = false;
  drag.startX = e.clientX; drag.startY = e.clientY; drag.pid = e.pointerId;
  drag.ghost = null; drag.target = null;
}
function moveDrag(e){
  if(!drag.on) return;
  var dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if(!drag.moved){
    if(Math.hypot(dx,dy) < 6) return;
    drag.moved = true;
    drag.ghost = ghostFor(drag.id, drag.parts);
    var tk = plane.querySelector('[data-tack="'+CSS.escape(drag.id)+'"]');
    if(tk) tk.classList.add("is-lift");
    document.querySelectorAll("[data-dock]").forEach(function(d){ d.classList.add("is-live"); });
  }
  drag.ghost.style.left = e.clientX+"px";
  drag.ghost.style.top = e.clientY+"px";
  var d = dockUnder(e.clientX, e.clientY);
  if(d !== drag.target){
    if(drag.target) drag.target.classList.remove("is-target");
    drag.target = d;
    if(d) d.classList.add("is-target");
    paintBeam(d ? {id:drag.id, parts:drag.parts, who:d.getAttribute("data-dock")} : null);
  }
}
function endDrag(e){
  if(!drag.on) return;
  var moved = drag.moved, tgt = drag.target, id = drag.id, parts = drag.parts;
  if(drag.ghost) drag.ghost.remove();
  var tk = plane.querySelector('[data-tack="'+CSS.escape(id)+'"]');
  if(tk) tk.classList.remove("is-lift");
  document.querySelectorAll("[data-dock]").forEach(function(d){ d.classList.remove("is-live","is-target"); });
  drag.on=false; drag.ghost=null; drag.target=null; drag.moved=false; drag.id=null; drag.parts=null;
  if(moved && tgt){
    assign(id, parts, tgt.getAttribute("data-dock"));
  } else {
    paintBeam(null);
  }
  return moved;
}
function assign(cardId, parts, who){
  var c = cardById(cardId); if(!c) return;
  parts.forEach(function(k){ c[k] = who; });
  save();
  repaintTack(cardId);
  paintBeam(null);
  announce(personName(who)+" now holds "+(parts.length===3?"all three parts":PART_NAME[parts[0]].toLowerCase())+" of "+c.title+".");
}
var liveRegion = document.createElement("p");
liveRegion.className = "hushed";
liveRegion.setAttribute("aria-live","polite");
document.body.appendChild(liveRegion);
function announce(msg){ liveRegion.textContent = msg; }

plane.addEventListener("pointerdown", function(e){
  var chip = e.target.closest(".chip");
  var grip = e.target.closest(".tack-grip");
  if(chip){
    beginDrag(e, chip.getAttribute("data-cid"), [chip.getAttribute("data-chip")]);
    try{ chip.setPointerCapture(e.pointerId); }catch(err){}
    chip.addEventListener("pointermove", moveDrag);
    chip.addEventListener("pointerup", chipUp);
    chip.addEventListener("pointercancel", chipUp);
    function chipUp(ev){
      chip.removeEventListener("pointermove", moveDrag);
      chip.removeEventListener("pointerup", chipUp);
      chip.removeEventListener("pointercancel", chipUp);
      var wasDrag = endDrag(ev);
      if(!wasDrag) openHolderMenu(chip, chip.getAttribute("data-cid"), [chip.getAttribute("data-chip")]);
    }
    e.preventDefault();
  } else if(grip){
    beginDrag(e, grip.getAttribute("data-grip"), PART_KEYS.slice());
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    grip.addEventListener("pointermove", moveDrag);
    grip.addEventListener("pointerup", gripUp);
    grip.addEventListener("pointercancel", gripUp);
    function gripUp(ev){
      grip.removeEventListener("pointermove", moveDrag);
      grip.removeEventListener("pointerup", gripUp);
      grip.removeEventListener("pointercancel", gripUp);
      var wasDrag = endDrag(ev);
      if(!wasDrag) openSheet("card", grip.getAttribute("data-grip"));
    }
    e.preventDefault();
  }
});
plane.addEventListener("click", function(e){
  var op = e.target.closest("[data-open]");
  if(op){ var k = op.getAttribute("data-open"); if(k==="reseed"){ reseed(); } else { openSheet("card", null); } }
});
document.addEventListener("click", function(e){
  var d = e.target.closest("[data-dock]");
  if(d && !drag.on){ focusWho = d.getAttribute("data-dock"); paintBeam(null); }
});

/* keyboard route to the same interaction */
var menuEl = null;
function closeHolderMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
function openHolderMenu(anchor, cardId, parts){
  closeHolderMenu();
  var c = cardById(cardId); if(!c) return;
  var box = document.createElement("div");
  box.setAttribute("role","dialog");
  box.setAttribute("aria-label", PART_NAME[parts[0]]+" of "+c.title);
  box.style.cssText = "position:fixed;z-index:75;background:var(--tack-face);border:1px solid var(--rule-firm);"
    + "border-radius:10px;box-shadow:var(--tack-cast-high);padding:7px;min-width:172px;display:flex;flex-direction:column;gap:3px";
  var head = document.createElement("div");
  head.style.cssText = "font-family:var(--type-say);font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--glyph-quiet);padding:2px 5px 4px";
  head.textContent = (parts.length===3? "Hand over all three" : PART_NAME[parts[0]]);
  box.appendChild(head);
  var opts = state.people.map(function(p){ return {id:p.id, label:p.name + (p.kind==="child"? " ("+ageAt(p.dob,todayISO())+")" : "")}; });
  opts.push({id:"", label:"Nobody yet"});
  opts.forEach(function(o){
    var b = document.createElement("button");
    b.className = "press";
    b.type = "button";
    b.style.cssText = "text-align:left;display:flex;align-items:center;gap:7px";
    b.setAttribute("aria-pressed", String(c[parts[0]] === (o.id||null) || (!c[parts[0]] && !o.id)));
    b.innerHTML = '<span style="width:9px;height:9px;border-radius:3px;background:'+(o.id?holdVar(o.id):"#a49c8e")+';flex:0 0 auto"></span>'+esc(o.label);
    b.addEventListener("click", function(){
      closeHolderMenu();
      assign(cardId, parts, o.id||"");
      var again = plane.querySelector('[data-tack="'+CSS.escape(cardId)+'"] [data-chip="'+parts[0]+'"]');
      if(again) again.focus();
    });
    box.appendChild(b);
  });
  document.body.appendChild(box);
  var r = anchor.getBoundingClientRect();
  var bh = box.offsetHeight, bwd = box.offsetWidth;
  box.style.left = clamp(r.left + r.width/2 - bwd/2, 8, window.innerWidth - bwd - 8)+"px";
  box.style.top = (r.bottom + bh + 10 < window.innerHeight ? r.bottom+6 : Math.max(8, r.top - bh - 6))+"px";
  menuEl = box;
  var first = box.querySelector("button");
  if(first) first.focus();
  box.addEventListener("keydown", function(ev){
    if(ev.key==="Escape"){ closeHolderMenu(); anchor.focus(); }
  });
}
document.addEventListener("pointerdown", function(e){
  if(menuEl && !menuEl.contains(e.target) && !e.target.closest(".chip")) closeHolderMenu();
}, true);
plane.addEventListener("keydown", function(e){
  var chip = e.target.closest && e.target.closest(".chip");
  if(chip && (e.key==="Enter" || e.key===" ")){
    e.preventDefault();
    openHolderMenu(chip, chip.getAttribute("data-cid"), [chip.getAttribute("data-chip")]);
  }
  var grip = e.target.closest && e.target.closest(".tack-grip");
  if(grip && e.key==="h"){
    e.preventDefault();
    openHolderMenu(grip, grip.getAttribute("data-grip"), PART_KEYS.slice());
  }
});
</script>
<script>
"use strict";
/* ===================== sheets ===================== */
var sheetKind = null, lastFocus = null, moreMsg = "", moreMsgTone = "";
function shell(title, sub, body, acts){
  return '<div class="sheetup-bar"><div><h2 id="sheetTitle">'+esc(title)+'</h2></div>'
    + '<button class="press" type="button" data-close="1">Close</button></div>'
    + (sub? '<p class="lede">'+sub+'</p>' : '')
    + body
    + (acts? '<div class="pairs" style="margin:18px 0 0">'+acts+'</div>' : '');
}
function openSheet(kind, arg){
  lastFocus = document.activeElement;
  sheetKind = kind;
  sheet.hidden = false;
  sheet.setAttribute("data-open","1");
  renderSheet(arg);
  var f = sheetFace.querySelector("input,select,textarea,button");
  if(f) f.focus();
}
function closeSheet(){
  sheet.removeAttribute("data-open");
  sheet.hidden = true;
  sheetKind = null;
  if(lastFocus && lastFocus.focus) { try{ lastFocus.focus(); }catch(e){} }
}
sheet.addEventListener("click", function(e){
  if(e.target === sheet) closeSheet();
  if(e.target.closest("[data-close]")) closeSheet();
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ if(menuEl){ closeHolderMenu(); } else if(sheetKind){ closeSheet(); } }
});
function renderSheet(arg){
  if(sheetKind==="pack") sheetPack();
  else if(sheetKind==="merge") sheetMerge();
  else if(sheetKind==="drift") sheetDrift();
  else if(sheetKind==="card") sheetCard(arg);
  else if(sheetKind==="more") sheetMore();
}

/* ---------- 1. HANDOVER PACK ---------- */
function packRows(who, from, to){
  var d = daysBetween(from,to);
  var days = (d==null||d<0)? 1 : d+1;
  var tf = isoToUTC(from), tt = isoToUTC(to);
  var rows = [];
  state.cards.forEach(function(c){
    var holds = PART_KEYS.filter(function(k){ return c[k]===who; });
    if(holds.indexOf("notice")<0 && holds.indexOf("plan")<0) return;
    var m = cardMetrics(c);
    var occ = m.per * days/365.25;
    var td = isoToUTC(c.nextDue);
    var dated = (td!=null && tf!=null && tt!=null && td>=tf && td<=tt);
    rows.push({c:c, m:m, holds:holds, occ:occ, dated:dated, bucket: dated?0:(occ>=0.95?1:2)});
  });
  rows.sort(function(a,b){ return a.bucket-b.bucket || b.m.invisW-a.m.invisW; });
  return {rows:rows, days:days};
}
function sheetPack(){
  var p = state.pack;
  if(!p.from){ p.from = todayISO(); p.to = addDaysISO(todayISO(), 7); }
  if(!person(p.who)) p.who = state.mine;
  if(!p.cover || !person(p.cover)) p.cover = otherAdult(p.who) || state.mine;
  var r = packRows(p.who, p.from, p.to);
  var inWin = r.rows.filter(function(x){ return x.bucket<2; }).length;
  var soloIn = r.rows.filter(function(x){ return soloHolder(x.c)===p.who; }).length;
  var opts = state.people.map(function(x){
    return '<option value="'+esc(x.id)+'"'+(x.id===p.who?" selected":"")+'>'+esc(x.name)+'</option>';
  }).join("");
  var copts = state.people.map(function(x){
    return '<option value="'+esc(x.id)+'"'+(x.id===p.cover?" selected":"")+'>'+esc(x.name)+'</option>';
  }).join("");
  var groups = [
    {b:0, h:"Dated inside the window", n:"These have a date on them and it falls while "+personName(p.who)+" is away."},
    {b:1, h:"Will come round while they're away", n:"Frequent enough that it will certainly happen at least once."},
    {b:2, h:"Standing watch", n:"Unlikely to land in this window — but this is what stops being noticed."}
  ];
  var body = '<div class="pairs">'
    + '<div class="pair"><label for="pkWho">Who is away</label><select id="pkWho">'+opts+'</select></div>'
    + '<div class="pair"><label for="pkFrom">From</label><input type="date" id="pkFrom" value="'+esc(p.from)+'"></div>'
    + '<div class="pair"><label for="pkTo">To</label><input type="date" id="pkTo" value="'+esc(p.to)+'"></div>'
    + '<div class="pair"><label for="pkCover">Covered by</label><select id="pkCover">'+copts+'</select></div>'
    + '</div>'
    + '<div class="metagrid">'
    + '<div class="metabox"><b>'+r.rows.length+'</b><span>things '+esc(personName(p.who))+' notices or plans</span></div>'
    + '<div class="metabox"><b>'+inWin+'</b><span>land in these '+r.days+' days</span></div>'
    + '<div class="metabox"><b>'+soloIn+'</b><span>only they touch, all three parts</span></div>'
    + '</div>';
  if(!r.rows.length){
    body += '<p class="blockquiet">'+esc(personName(p.who))+' does not currently hold the noticing or planning on anything. Nothing to hand over — which is itself worth looking at.</p>';
  } else {
    groups.forEach(function(g){
      var list = r.rows.filter(function(x){ return x.bucket===g.b; });
      if(!list.length) return;
      body += '<hr class="hr"><h3 style="font-size:15px;margin-bottom:2px">'+esc(g.h)+' <span style="font-family:var(--type-tell);font-weight:400;color:var(--glyph-quiet);font-size:13px">'+list.length+'</span></h3>'
        + '<p style="font-size:12.5px;color:var(--glyph-quiet);margin:0 0 8px">'+esc(g.n)+'</p>';
      list.slice(0,60).forEach(function(x){
        var pills = x.holds.map(function(k){
          return '<span class="who-pill" style="--pill-hold:'+holdVar(p.who)+'">'+PART_NAME[k]+'</span>';
        }).join("");
        body += '<div class="regline"><div><h4>'+esc(x.c.title)+'</h4>'
          + '<p><b>Trigger.</b> '+esc(x.c.trigger||"—")+'<br><b>When.</b> '+esc(x.c.timing||"—")
          + (x.c.contacts && x.c.contacts!=="Nobody"? '<br><b>Who.</b> '+esc(x.c.contacts):"")
          + '<br><b>Standard.</b> '+esc(x.c.standard||"—")+'</p>'
          + '<div class="tag-set">'+pills+'<span class="nub">'+esc(FREQ[x.c.freq].label)+'</span>'
          + (x.dated? '<span class="nub" data-tone="watch">'+esc(fmtDate(x.c.nextDue,true))+'</span>':'')
          + '</div></div>'
          + '<div class="regline-acts"><button class="press" data-slim type="button" data-editcard="'+esc(x.c.id)+'">Edit</button></div></div>';
      });
    });
  }
  body += '<div class="saystrip"><b>A conversation tool, not a verdict.</b> This pack is only as good as what you wrote down. Read it together before you go.</div>';
  sheetFace.innerHTML = shell(
    "Handover pack",
    "Everything <b>"+esc(personName(p.who))+"</b> holds the <b>noticing</b> or the <b>planning</b> for. Not the doing — that part is easy to hand over. This is the part that stays invisible until it is missing, written out so somebody else can actually carry it.",
    body,
    '<button class="press" data-lead type="button" id="pkPrint">Print this pack</button>'
    + '<button class="press" type="button" data-close="1">Back to the board</button>'
  );
  $("#pkWho").addEventListener("change", function(){ state.pack.who=this.value; state.pack.cover = otherAdult(this.value)||state.mine; save(); sheetPack(); });
  $("#pkCover").addEventListener("change", function(){ state.pack.cover=this.value; save(); });
  $("#pkFrom").addEventListener("change", function(){ state.pack.from=this.value||todayISO(); if(daysBetween(state.pack.from,state.pack.to)<0) state.pack.to = state.pack.from; save(); sheetPack(); });
  $("#pkTo").addEventListener("change", function(){ state.pack.to=this.value||state.pack.from; save(); sheetPack(); });
  $("#pkPrint").addEventListener("click", function(){ printAs("handover"); });
  sheetFace.querySelectorAll("[data-editcard]").forEach(function(b){
    b.addEventListener("click", function(){ openSheet("card", b.getAttribute("data-editcard")); });
  });
}

/* ---------- 2. BLIND MERGE + DISCREPANCY REGISTER ---------- */
function sheetMerge(){
  var g = gapOf(state, state.partner);
  var kindName = {orphan:"Nobody is watching it", contested:"You both think it's yours", other:"Different answers"};
  var kindNote = {
    orphan:"Each of you named the other. On both boards, this is somebody else's job — which means nobody is holding it.",
    contested:"You each believe you carry this part. One of you is remembering wrong, and it is worth knowing which.",
    other:"The two boards disagree, but not head to head — usually a child, or one of you left it blank."
  };
  var body = '<div class="pairs">'
    + '<div class="pair"><label for="mgMine">This copy belongs to</label><select id="mgMine">'
    + state.people.map(function(p){ return '<option value="'+esc(p.id)+'"'+(p.id===state.mine?" selected":"")+'>'+esc(p.name)+'</option>'; }).join("")
    + '</select></div></div>'
    + '<div class="blockquiet" style="margin-bottom:14px">Fill your own board in from your own memory. Send this code to your partner. When they paste theirs back in, the gap between the two memories is the finding — not the pie chart.</div>'
    + '<div class="mapline"><span>Your code</span><div style="display:flex;gap:7px"><textarea class="codebox" id="mgOut" readonly rows="3" aria-label="Your board as a paste-able code"></textarea></div></div>'
    + '<div class="pairs"><button class="press" type="button" id="mgCopy">Copy my code</button>'
    + '<button class="press" type="button" id="mgDemo">Paste Tom&#39;s sample copy</button></div>'
    + '<div class="mapline" style="margin-top:12px"><span>Their code</span><textarea class="codebox" id="mgIn" rows="3" placeholder="Paste the code from the other copy here" aria-label="Paste your partner’s code"></textarea></div>'
    + '<div class="pairs"><button class="press" data-lead type="button" id="mgGo">Merge and compare</button>'
    + '<span id="mgMsg" style="font-size:13px;color:var(--flag-alarm);align-self:center"></span></div>';

  if(state.partner){
    body += '<hr class="hr"><h3 style="font-size:17px">The discrepancy register</h3>'
      + '<div class="metagrid">'
      + '<div class="metabox"><b>'+(g.pct==null?"—":f1(g.pct)+"%")+'</b><span>of all part-assignments disagree</span></div>'
      + '<div class="metabox"><b>'+g.parts+'</b><span>of '+g.of+' parts, two different memories</span></div>'
      + '<div class="metabox"><b>'+g.lines.filter(function(l){return l.kind==="orphan";}).length+'</b><span>nobody is watching</span></div>'
      + '</div>';
    if(state.gapLog.length>1){
      body += '<p style="font-size:13px;color:var(--glyph-mid)">Blind runs so far: '
        + state.gapLog.map(function(e){ return esc(fmtDate(e.date,true))+" — "+f1(e.gap)+"%"; }).join(" → ")
        + '. Re-run blind in six months and see whether the gap closed.</p>';
    }
    ["orphan","contested","other"].forEach(function(k){
      var list = g.lines.filter(function(l){ return l.kind===k; });
      if(!list.length) return;
      body += '<hr class="hr"><h4 style="font-size:14.5px;margin-bottom:1px">'+esc(kindName[k])+' <span style="font-family:var(--type-tell);font-weight:400;color:var(--glyph-quiet)">'+list.length+'</span></h4>'
        + '<p style="font-size:12.5px;color:var(--glyph-quiet);margin:0 0 6px">'+esc(kindNote[k])+'</p>';
      list.forEach(function(l){
        body += '<div class="regline"><div><h4>'+esc(l.title)+'</h4>'
          + '<p>'+esc(PART_NAME[l.part])+' — you said <b>'+esc(l.mine==="-"?"nobody":personName(l.mine))+'</b>, '
          + esc(personName(state.partner.who))+' said <b>'+esc(l.theirs==="-"?"nobody":personName(l.theirs))+'</b>.</p></div>'
          + '<div class="regline-acts">'
          + '<button class="press" data-slim type="button" data-settle="'+esc(l.cardId)+'|'+l.part+'|'+esc(l.mine)+'">Keep '+esc(l.mine==="-"?"nobody":personName(l.mine))+'</button>'
          + '<button class="press" data-slim type="button" data-settle="'+esc(l.cardId)+'|'+l.part+'|'+esc(l.theirs)+'">Take '+esc(l.theirs==="-"?"nobody":personName(l.theirs))+'</button>'
          + '</div></div>';
      });
    });
    if(!g.lines.length) body += '<p class="blockquiet">Both boards agree on every part. Either you have already had this conversation, or one of you filled it in while looking at the other.</p>';
  }
  body += '<div class="saystrip"><b>A conversation tool, not a verdict.</b> A disagreement here is two honest memories, not a lie.</div>';
  sheetFace.innerHTML = shell("Blind merge", "Two devices, two memories, filled in separately. Then compare.", body,
    '<button class="press" type="button" id="mgPrint">Print the register</button>'
    + '<button class="press" type="button" data-close="1">Back to the board</button>');
  $("#mgOut").value = myCode();
  $("#mgMine").addEventListener("change", function(){ state.mine=this.value; focusWho=this.value; save(); paintBeam(null); sheetMerge(); });
  $("#mgCopy").addEventListener("click", function(){
    var ta = $("#mgOut"); ta.select();
    var done = false;
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); done = true; } }catch(e){}
    if(!done){ try{ done = document.execCommand("copy"); }catch(e){} }
    this.textContent = done? "Copied" : "Select and copy";
  });
  $("#mgDemo").addEventListener("click", function(){
    var pa = {};
    state.cards.forEach(function(c){
      var d = SEED_PARTNER_DIFF[c.id] || {};
      pa[c.id] = (d.notice||c.notice||"-")+(d.plan||c.plan||"-")+(d.exec||c.exec||"-");
    });
    $("#mgIn").value = "LOAD1." + b64enc(JSON.stringify({v:1, who:"T", when:todayISO(), a:pa})).replace(/=+$/,"");
    $("#mgMsg").textContent = "";
  });
  $("#mgGo").addEventListener("click", function(){
    var msg = $("#mgMsg");
    try{
      var obj = readCode($("#mgIn").value);
      if(obj.who === state.mine) throw new Error("That code is from this same person. Change who this copy belongs to first.");
      state.partner = {who:obj.who, when:obj.when||todayISO(), a:obj.a};
      var gg = gapOf(state, state.partner);
      state.gapLog.push({date:state.partner.when, gap:(gg.pct==null?0:gg.pct), parts:gg.parts, of:gg.of});
      if(state.gapLog.length>12) state.gapLog = state.gapLog.slice(-12);
      save(); msg.textContent = ""; sheetMerge();
    }catch(err){ msg.textContent = err.message || "That code could not be read."; }
  });
  sheetFace.querySelectorAll("[data-settle]").forEach(function(b){
    b.addEventListener("click", function(){
      var bits = b.getAttribute("data-settle").split("|");
      var c = cardById(bits[0]); if(!c) return;
      c[bits[1]] = bits[2]==="-" ? "" : bits[2];
      if(state.partner && state.partner.a[c.id]){
        var s = state.partner.a[c.id].split("");
        s[PART_KEYS.indexOf(bits[1])] = c[bits[1]] || "-";
        state.partner.a[c.id] = s.join("");
      }
      save(); repaintTack(c.id); paintBeam(null); sheetMerge();
    });
  });
  $("#mgPrint").addEventListener("click", function(){ printAs("review"); });
}

/* ---------- 3. DRIFT ---------- */
var LIFE_EVENTS = ["New baby","School start","Term change","Job change","Hours changed","Illness or surgery","House move"];
function sheetDrift(){
  var t = tally();
  var moved = t.drifts;
  var gone = moved.filter(function(x){ return x.d.drifted; });
  var held = moved.filter(function(x){ return !x.d.drifted; });
  var body = '<div class="metagrid">'
    + '<div class="metabox"><b>'+moved.length+'</b><span>handovers on record</span></div>'
    + '<div class="metabox"><b>'+gone.length+'</b><span>have quietly drifted back</span></div>'
    + '<div class="metabox"><b>'+t.spf.length+'</b><span>single points of failure</span></div>'
    + '</div>';
  if(gone.length){
    body += '<div class="warnstrip"><b>'+gone.length+'</b> agreed handover'+(gone.length===1?" has":"s have")+' reverted. Nobody decided this; it just happened.</div>';
  }
  body += '<h3 style="font-size:15px">Handovers on record</h3>';
  if(!moved.length){
    body += '<p class="blockquiet">No handovers recorded yet. When you agree one, open the card and press <b>Record this handover</b> — that is what makes drift measurable later.</p>';
  }
  moved.forEach(function(x){
    var bits = PART_KEYS.map(function(k){
      var want = x.d.want[k], now = x.c[k];
      if(!want) return "";
      var ok = want===now;
      return '<span class="nub" data-tone="'+(ok?"hold":"alarm")+'">'+PART_NAME[k]+': '+esc(personName(want))
        + (ok? "" : " → back with "+esc(now?personName(now):"nobody"))+'</span>';
    }).join("");
    body += '<div class="regline"><div><h4>'+esc(x.c.title)+'</h4>'
      + '<p>Agreed '+esc(fmtDate(x.d.date))+(x.d.days!=null? " · "+x.d.days+" days ago":"")
      + (x.d.note? " · "+esc(x.d.note):"")+'</p><div class="tag-set">'+bits+'</div></div>'
      + '<div class="regline-acts">'
      + (x.d.drifted? '<button class="press" data-slim type="button" data-restore="'+esc(x.c.id)+'">Put it back</button>':'')
      + '<button class="press" data-slim type="button" data-editcard="'+esc(x.c.id)+'">Open</button></div></div>';
  });
  body += '<hr class="hr"><h3 style="font-size:15px">Single points of failure</h3>'
    + '<p style="font-size:12.5px;color:var(--glyph-quiet);margin:0 0 8px">One person notices, plans and does it. If they are ill or away, it simply stops.</p>';
  if(!t.spf.length) body += '<p class="blockquiet">None. Every responsibility has at least two people in it.</p>';
  else{
    body += '<ul class="listing">' + t.spf.slice(0,40).map(function(s){
      return '<li><b>'+esc(s.card.title)+'</b> — all three parts with '+esc(personName(s.who))
        + ' · <span style="color:var(--glyph-quiet)">'+f1(s.m.weighted)+' weighted hrs/yr</span></li>';
    }).join("") + '</ul>';
  }
  body += '<hr class="hr"><h3 style="font-size:15px">Ready to hand to a child</h3>'
    + '<p style="font-size:12.5px;color:var(--glyph-quiet);margin:0 0 8px">Cards flagged with an age, where somebody in this house is now old enough.</p>';
  if(!t.ready.length) body += '<p class="blockquiet">Nothing is waiting. Add an age to a card and it will appear here the year they reach it.</p>';
  else{
    body += t.ready.slice(0,30).map(function(r){
      return '<div class="regline"><div><h4>'+esc(r.card.title)+'</h4><p>Flagged ready at '+r.card.readyAge
        + '. '+esc(r.to.name)+' is '+r.to.age+'.</p></div><div class="regline-acts">'
        + '<button class="press" data-slim type="button" data-pass="'+esc(r.card.id)+'|'+esc(r.to.id)+'|exec">Give them the doing</button>'
        + '<button class="press" data-slim type="button" data-pass="'+esc(r.card.id)+'|'+esc(r.to.id)+'|all">All three</button>'
        + '</div></div>';
    }).join("");
  }
  body += '<hr class="hr"><h3 style="font-size:15px">Re-run on a life event, not on a reminder</h3>'
    + '<p style="font-size:12.5px;color:var(--glyph-quiet);margin:0 0 8px">The board goes stale when the household changes, not on a schedule. Log the change and re-run blind.</p>'
    + '<div class="pairs">'
    + LIFE_EVENTS.map(function(k){ return '<button class="press" data-slim type="button" data-life="'+esc(k)+'">'+esc(k)+'</button>'; }).join("")
    + '</div>';
  if(state.events.length){
    body += '<ul class="listing">' + state.events.slice().reverse().slice(0,10).map(function(e){
      var d = daysBetween(e.date, todayISO());
      return '<li><b>'+esc(e.kind)+'</b> · '+esc(fmtDate(e.date))+(d!=null? " · "+d+" days ago":"")
        + (e.note? '<br><span style="color:var(--glyph-quiet)">'+esc(e.note)+'</span>':'')+'</li>';
    }).join("") + '</ul>';
  }
  body += '<div class="saystrip"><b>A conversation tool, not a verdict.</b> Drift is normal. Noticing it early is the whole point.</div>';
  sheetFace.innerHTML = shell("Drift report", "Couples rarely fail at agreeing. They fail at holding the agreement.", body,
    '<button class="press" type="button" id="drPrint">Print drift &amp; register</button>'
    + '<button class="press" type="button" data-close="1">Back to the board</button>');
  sheetFace.querySelectorAll("[data-restore]").forEach(function(b){
    b.addEventListener("click", function(){
      var c = cardById(b.getAttribute("data-restore")); if(!c||!c.transfer) return;
      PART_KEYS.forEach(function(k){ if(c.transfer.want[k]) c[k] = c.transfer.want[k]; });
      save(); repaintTack(c.id); paintBeam(null); sheetDrift();
    });
  });
  sheetFace.querySelectorAll("[data-pass]").forEach(function(b){
    b.addEventListener("click", function(){
      var bits = b.getAttribute("data-pass").split("|");
      var c = cardById(bits[0]); if(!c) return;
      var parts = bits[2]==="all" ? PART_KEYS.slice() : [bits[2]];
      parts.forEach(function(k){ c[k] = bits[1]; });
      c.transfer = {date:todayISO(), from:state.mine, want:{notice:c.notice,plan:c.plan,exec:c.exec}, note:"Handed to "+personName(bits[1])+"."};
      save(); repaintTack(c.id); paintBeam(null); sheetDrift();
    });
  });
  sheetFace.querySelectorAll("[data-life]").forEach(function(b){
    b.addEventListener("click", function(){
      state.events.push({date:todayISO(), kind:b.getAttribute("data-life"), note:"Logged from the board. Re-run both boards blind."});
      if(state.events.length>24) state.events = state.events.slice(-24);
      save(); sheetDrift();
    });
  });
  sheetFace.querySelectorAll("[data-editcard]").forEach(function(b){
    b.addEventListener("click", function(){ openSheet("card", b.getAttribute("data-editcard")); });
  });
  $("#drPrint").addEventListener("click", function(){ printAs("review"); });
}

/* ---------- 4. ONE CARD ---------- */
function newCardId(){
  var n = 1, id;
  do { id = "c"+n; n++; } while(cardById(id));
  return id;
}
function sheetCard(id){
  var isNew = !id;
  var c = isNew ? {id:newCardId(), dom:DOMAINS[0].id, title:"", notice:state.mine, plan:state.mine, exec:state.mine,
                   freq:"w", mins:20, stakes:2, trigger:"", timing:"", contacts:"", standard:"", readyAge:null, nextDue:"", transfer:null}
                : cardById(id);
  if(!c) { closeSheet(); return; }
  var m = cardMetrics(c);
  var whoSel = function(part){
    return '<div class="pair"><label for="cd_'+part+'">'+PART_NAME[part]+'</label><select id="cd_'+part+'">'
      + '<option value=""'+(!c[part]?" selected":"")+'>Nobody</option>'
      + state.people.map(function(p){ return '<option value="'+esc(p.id)+'"'+(c[part]===p.id?" selected":"")+'>'+esc(p.name)+'</option>'; }).join("")
      + '</select></div>';
  };
  var body = '<div class="pairs">'
    + '<div class="pair wide-pair"><label for="cdTitle">What is it</label><input id="cdTitle" type="text" value="'+esc(c.title)+'" placeholder="e.g. Noticing the shoes have been outgrown"></div>'
    + '<div class="pair"><label for="cdDom">Domain</label><select id="cdDom">'
    + DOMAINS.map(function(d){ return '<option value="'+esc(d.id)+'"'+(c.dom===d.id?" selected":"")+'>'+esc(d.name)+'</option>'; }).join("")
    + '</select></div></div>'
    + '<h3 style="font-size:14px;margin:6px 0 6px">Who holds each part</h3>'
    + '<div class="pairs">'+PART_KEYS.map(whoSel).join("")+'</div>'
    + '<div class="pairs">'
    + '<div class="pair"><label for="cdFreq">How often</label><select id="cdFreq">'
    + Object.keys(FREQ).map(function(k){ return '<option value="'+k+'"'+(c.freq===k?" selected":"")+'>'+esc(FREQ[k].label)+'</option>'; }).join("")
    + '</select></div>'
    + '<div class="pair"><label for="cdMins">Minutes each time</label><input id="cdMins" type="number" min="0" max="6000" step="1" value="'+num(c.mins,0)+'"></div>'
    + '<div class="pair"><label for="cdStakes">If it slips</label><select id="cdStakes">'
    + [1,2,3].map(function(k){ return '<option value="'+k+'"'+(Number(c.stakes)===k?" selected":"")+'>'+esc(STAKES[k].label)+'</option>'; }).join("")
    + '</select></div>'
    + '<div class="pair"><label for="cdReady">Ready for a child aged</label><input id="cdReady" type="number" min="3" max="18" step="1" value="'+(c.readyAge==null?"":c.readyAge)+'" placeholder="—"></div>'
    + '<div class="pair"><label for="cdDue">Next dated occurrence</label><input id="cdDue" type="date" value="'+esc(c.nextDue||"")+'"></div>'
    + '</div>'
    + '<div class="blockquiet" style="margin:6px 0 14px"><b>'+f1(m.execH)+'</b> hours a year of doing · <b>'+f1(m.invisW)+'</b> weighted hours a year of noticing and planning · '+esc(STAKES[c.stakes].miss)+'</div>'
    + '<h3 style="font-size:14px;margin:0 0 2px">The invisible content</h3>'
    + '<p style="font-size:12.5px;color:var(--glyph-quiet);margin:0 0 8px">This is what prints in the handover pack. Without it, nobody can take this over.</p>'
    + '<div class="pairs">'
    + '<div class="pair wide-pair"><label for="cdTrig">What triggers it</label><textarea id="cdTrig" placeholder="What tells you it needs doing?">'+esc(c.trigger)+'</textarea></div>'
    + '<div class="pair wide-pair"><label for="cdTime">When it must happen</label><textarea id="cdTime" placeholder="Deadline, or the window it has to fall in">'+esc(c.timing)+'</textarea></div>'
    + '<div class="pair wide-pair"><label for="cdCon">Who to contact</label><textarea id="cdCon" placeholder="Names, numbers, which app">'+esc(c.contacts)+'</textarea></div>'
    + '<div class="pair wide-pair"><label for="cdStd">What good looks like</label><textarea id="cdStd" placeholder="The standard, including the bit only you know">'+esc(c.standard)+'</textarea></div>'
    + '</div>';
  var d = driftOf(c);
  if(d){
    body += '<hr class="hr"><h3 style="font-size:14px">Handover on record</h3><p style="font-size:13px;color:var(--glyph-mid)">Agreed '+esc(fmtDate(d.date))
      + (d.days!=null? " · "+d.days+" days ago":"")+'. '+(d.drifted? '<b style="color:var(--flag-alarm)">Drifted back: '+d.parts.map(function(k){return PART_NAME[k];}).join(", ")+'.</b>' : "Still holding.")+'</p>';
  }
  var acts = (isNew? '<button class="press" data-lead type="button" id="cdSave">Add to the board</button>'
                   : '<button class="press" data-lead type="button" id="cdSave">Save</button>')
    + '<button class="press" type="button" id="cdStamp">Record this handover today</button>'
    + (isNew? "" : '<button class="press" type="button" id="cdDel">Remove this card</button>')
    + '<button class="press" type="button" data-close="1">Cancel</button>';
  sheetFace.innerHTML = shell(isNew? "New responsibility" : c.title || "Responsibility",
    "Three parts, three people if you like. That decomposition is the whole product.", body, acts);
  function pull(){
    c.title = $("#cdTitle").value.trim();
    c.dom = $("#cdDom").value;
    PART_KEYS.forEach(function(k){ c[k] = $("#cd_"+k).value; });
    c.freq = $("#cdFreq").value;
    c.mins = clamp(num($("#cdMins").value,0), 0, 6000);
    c.stakes = num($("#cdStakes").value,2);
    var ra = $("#cdReady").value;
    c.readyAge = ra==="" ? null : clamp(num(ra,8),3,18);
    c.nextDue = $("#cdDue").value || "";
    c.trigger = $("#cdTrig").value.trim();
    c.timing = $("#cdTime").value.trim();
    c.contacts = $("#cdCon").value.trim();
    c.standard = $("#cdStd").value.trim();
  }
  $("#cdSave").addEventListener("click", function(){
    pull();
    if(!c.title) c.title = "Untitled responsibility";
    if(isNew) state.cards.push(c);
    save(); paintBoard(); paintBeam(null); closeSheet();
  });
  $("#cdStamp").addEventListener("click", function(){
    pull();
    if(isNew){ state.cards.push(c); }
    c.transfer = {date:todayISO(), from:state.mine, want:{notice:c.notice, plan:c.plan, exec:c.exec}, note:"Agreed at the board."};
    save(); paintBoard(); paintBeam(null); openSheet("card", c.id);
  });
  var del = $("#cdDel");
  if(del) del.addEventListener("click", function(){
    if(del.getAttribute("data-armed")==="1"){
      state.cards = state.cards.filter(function(x){ return x.id!==c.id; });
      save(); paintBoard(); paintBeam(null); closeSheet();
    } else { del.setAttribute("data-armed","1"); del.textContent = "Tap again to remove"; }
  });
}

/* ---------- 5. MORE ---------- */

  sheetFace.innerHTML = shell("The Load", "The board, the weights, the household, and your data.", body,

  $("#mrAddAdult").addEventListener("click", function(){ addPerson("adult"); });
  $("#mrAddCard").addEventListener("click", function(){ openSheet("card", null); });
  sheetFace.querySelectorAll("[data-print]").forEach(function(b){
    b.addEventListener("click", function(){ printAs(b.getAttribute("data-print")); });
  });
  $("#mrCsv").addEventListener("click", exportCSV);
  $("#mrJson").addEventListener("click", exportJSON);
  $("#mrImp").addEventListener("click", function(){ $("#mrFile").click(); });

    var b = this;
    if(b.getAttribute("data-armed")==="1"){ clearAll(); }
    else { b.setAttribute("data-armed","1"); b.textContent = "Tap again — this wipes the board"; }
  });
