function paintPeopleEditor(){
  var host = $("#mrPeople"); if(!host) return;
  host.innerHTML = state.people.map(function(p,i){
    return '<div class="pairs" style="margin-bottom:8px;align-items:flex-end">'
      + '<span style="width:10px;height:26px;border-radius:4px;background:'+holdVar(p.id)+'"></span>'
      + '<div class="pair"><label for="pn'+i+'">Name</label><input id="pn'+i+'" type="text" value="'+esc(p.name)+'" data-pname="'+esc(p.id)+'" style="width:150px"></div>'
      + (p.kind==="child"
          ? '<div class="pair"><label for="pd'+i+'">Date of birth</label><input id="pd'+i+'" type="date" value="'+esc(p.dob||"")+'" data-pdob="'+esc(p.id)+'"></div>'
            + '<div class="pair"><span>Age</span><b style="font-family:var(--type-say);font-size:17px">'+(p.dob? (ageAt(p.dob,todayISO())==null?"—":ageAt(p.dob,todayISO())) : "—")+'</b></div>'
          : '<div class="pair"><span>Role</span><b style="font-family:var(--type-say);font-size:13px;padding-bottom:8px">Adult</b></div>')
      + (state.people.length>2? '<button class="press" data-slim type="button" data-prm="'+esc(p.id)+'">Remove</button>':'')
      + '</div>';
  }).join("");
  host.querySelectorAll("[data-pname]").forEach(function(inp){
    inp.addEventListener("input", function(){
      var p = person(inp.getAttribute("data-pname")); if(!p) return;
      p.name = inp.value || p.id; save(); paintBeam(null); paintBoard();
    });
  });
  host.querySelectorAll("[data-pdob]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var p = person(inp.getAttribute("data-pdob")); if(!p) return;
      p.dob = inp.value || null; save(); paintBoard(); paintBeam(null); paintPeopleEditor();
    });
  });
  host.querySelectorAll("[data-prm]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.getAttribute("data-prm");
      state.people = state.people.filter(function(p){ return p.id!==id; });
      state.cards.forEach(function(c){ PART_KEYS.forEach(function(k){ if(c[k]===id) c[k]=""; }); });
      if(state.mine===id) state.mine = state.people[0].id;
      if(focusWho===id) focusWho = state.people[0].id;
      save(); paintBoard(); paintBeam(null); paintPeopleEditor();
    });
  });
}
function addPerson(kind){
  var used = {}; state.people.forEach(function(p){ used[p.id]=1; });
  var pool = "NTIRABCDEFGHJKLMPQSUVWXYZ".split("");
  var id = null;
  for(var i=0;i<pool.length;i++) if(!used[pool[i]]){ id = pool[i]; break; }
  if(!id) return;
  state.people.push({id:id, name:(kind==="child"?"New child":"New adult"), kind:kind, dob:(kind==="child"? addDaysISO(todayISO(), -2922) : null)});
  document.documentElement.style.setProperty("--hold-"+id, kind==="child"? "#5b5f7a" : "#5a554d");
  save(); paintBoard(); paintBeam(null); paintPeopleEditor();
}
function reseed(){
  state = seedState();
  dockSig = "";
  focusWho = state.mine;
  save(); paintBoard(); fitBoard(); paintBeam(null);
  $("#podSub").textContent = "Sample family";
  if(sheetKind) closeSheet();
}
function clearAll(){
  dockSig = "";
  state = {
    v:1, sample:false, mine:"N",
    people:[{id:"N",name:"You",kind:"adult",dob:null},{id:"T",name:"Partner",kind:"adult",dob:null}],
    cards:[], events:[], partner:null, gapLog:[],
    pack:{who:"N", from:todayISO(), to:addDaysISO(todayISO(),7), cover:"T"}
  };
  focusWho = "N";
  save(); paintBoard(); fitBoard(); paintBeam(null);
  $("#podSub").textContent = "Your household";
  if(sheetKind) closeSheet();
}
</script>
<script>
"use strict";
/* ===================== export / import ===================== */
function csvCell(v){
  var s = String(v==null? "" : v);
  if(/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function download(name, mime, text){
  var blob = new Blob([text], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
}
function stamp(){ return todayISO(); }
function exportCSV(){
  var t = tally();
  var head = ["Domain","Responsibility","Noticing","Planning","Executing","Frequency","Times per year",
    "Minutes per time","If it slips","Doing hours per year","Noticing hours per year","Planning hours per year",
    "Invisible load (weighted hrs/yr)","Total weighted hrs/yr","Single point of failure","Ready for age",
    "Handover agreed","Drifted parts","Next dated","Trigger","When","Who to contact","Standard"];
  var lines = [head.map(csvCell).join(",")];
  state.cards.forEach(function(c){
    var m = cardMetrics(c), s = soloHolder(c), d = driftOf(c);
    var dm = DOMAINS.filter(function(x){ return x.id===c.dom; })[0];
    lines.push([
      dm? dm.name : c.dom, c.title, personName(c.notice)||"", personName(c.plan)||"", personName(c.exec)||"",
      FREQ[c.freq]? FREQ[c.freq].label : "", m.per, m.mins, STAKES[c.stakes].label,
      f2(m.execH), f2(m.noticeH), f2(m.planH), f2(m.invisW), f2(m.weighted),
      s? personName(s) : "", c.readyAge==null? "" : c.readyAge,
      d? d.date : "", (d && d.drifted)? d.parts.map(function(k){return PART_NAME[k];}).join("; ") : "",
      c.nextDue||"", c.trigger||"", c.timing||"", c.contacts||"", c.standard||""
    ].map(csvCell).join(","));
  });
  lines.push("");
  lines.push(["SPLIT","Person","Share of cards %","Share of doing time %","Share of invisible load %","Weighted hrs/yr"].map(csvCell).join(","));
  state.people.forEach(function(p){
    var w = t.who[p.id];
    lines.push(["SPLIT", p.name, pctText(w.cardShare,t.tot.cardShare,1), pctText(w.execH,t.tot.execH,1),
      pctText(w.invisW,t.tot.invisW,1), f2(w.weighted)].map(csvCell).join(","));
  });
  lines.push(["NOTE","A conversation tool, not a verdict. Noticing and planning are weighted x"+KAPPA+"."].map(csvCell).join(","));
  download("the-load-"+stamp()+".csv","text/csv;charset=utf-8","﻿"+lines.join("\r\n")+"\r\n");
}
function exportJSON(){
  download("the-load-"+stamp()+".json","application/json", JSON.stringify(state,null,2));
}
function importJSON(e){
  var file = e.target.files && e.target.files[0];
  var msg = $("#mrMsg");
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var s = JSON.parse(String(fr.result));
      if(!s || !Array.isArray(s.cards) || !Array.isArray(s.people)) throw new Error("bad");
      state = s;
      state.events = Array.isArray(state.events)? state.events : [];
      state.gapLog = Array.isArray(state.gapLog)? state.gapLog : [];
      state.pack = state.pack || {who:state.mine||"N", from:todayISO(), to:addDaysISO(todayISO(),7), cover:"T"};
      state.mine = state.mine || state.people[0].id;
      state.cards.forEach(function(c){
        if(!FREQ[c.freq]) c.freq="w";
        c.mins = Math.max(0,num(c.mins,0));
        c.stakes = STAKES[c.stakes]? c.stakes : 2;
        c.readyAge = (c.readyAge===null||c.readyAge===undefined||c.readyAge==="")? null : num(c.readyAge,null);
      });
      focusWho = state.mine;
      save(); paintBoard(); fitBoard(); paintBeam(null);
      $("#podSub").textContent = state.sample? "Sample family":"Your household";
      moreMsg = "Imported "+state.cards.length+" cards."; moreMsgTone = "var(--flag-hold)";
      sheetMore();
    }catch(err){
      moreMsg = "That file could not be read as a Load export."; moreMsgTone = "var(--flag-alarm)";
      if(msg){ msg.textContent = moreMsg; msg.style.color = moreMsgTone; }
    }
  };
  fr.onerror = function(){ moreMsg = "That file could not be read."; moreMsgTone = "var(--flag-alarm)";
    if(msg){ msg.textContent = moreMsg; msg.style.color = moreMsgTone; } };
  fr.readAsText(file);
  e.target.value = "";
}

/* ===================== print ===================== */
var SAY = "A conversation tool, not a verdict.";
var SAY_LONG = "Every figure here comes from your own estimates and the weighting rule printed below. It is a way of seeing the same picture at the same time. It is not evidence, and it does not settle anything.";
var METHOD_LINE = "Doing = times a year × minutes. Noticing = max(3 min, 25% of doing). Planning = max(5 min, 40% of doing). "
  + "Both scaled by stakes (routine ×0.8, matters ×1.0, serious ×1.35) and weighted ×" + KAPPA + " to give the invisible load.";

function splitBlock(t){
  var f = focusWho, o = otherAdult(f);
  var mk = function(label, field, note){
    var a = t.who[f]? t.who[f][field] : 0;
    var b = (o && t.who[o])? t.who[o][field] : null;
    return '<div><h3>'+esc(label)+'</h3><b>'+pctText(a,t.tot[field==="cardShare"?"cardShare":(field==="execH"?"execH":"invisW")],0)+'%</b>'
      + '<small>'+esc(personName(f))+(b!=null? ' &middot; '+esc(personName(o))+' '+pctText(b,t.tot[field==="cardShare"?"cardShare":(field==="execH"?"execH":"invisW")],0)+'%':'')+'</small>'
      + '<small>'+esc(note)+'</small></div>';
  };
  return '<div class="paper-splits">'
    + mk("Cards","cardShare","counted in thirds")
    + mk("Time","execH","hours a year of doing")
    + mk("Invisible","invisW","weighted noticing + planning")
    + '</div>';
}
function paperDivision(){
  var t = tally();
  var rows = "";
  DOMAINS.concat([{id:"__other",name:"Everything else"}]).forEach(function(dm){
    var list = state.cards.filter(function(c){
      return dm.id==="__other" ? !DOMAINS.some(function(x){return x.id===c.dom;}) : c.dom===dm.id;
    });
    if(!list.length) return;
    rows += '<tr><td colspan="9" style="border-bottom:1pt solid #000;padding-top:6pt"><b>'+esc(dm.name)+'</b></td></tr>';
    list.forEach(function(c){
      var m = cardMetrics(c), s = soloHolder(c), d = driftOf(c);
      var flags = [];
      if(s) flags.push("All three: "+personName(s));
      if(d && d.drifted) flags.push("Drifted back");
      else if(d) flags.push("Handed over "+fmtDate(d.date,true));
      if(c.readyAge!=null) flags.push("Ready at "+c.readyAge);
      rows += '<tr><td>'+esc(c.title)+'</td>'
        + '<td>'+esc(c.notice?personName(c.notice):"—")+'</td>'
        + '<td>'+esc(c.plan?personName(c.plan):"—")+'</td>'
        + '<td>'+esc(c.exec?personName(c.exec):"—")+'</td>'
        + '<td>'+esc(FREQ[c.freq].label)+'</td>'
        + '<td class="num">'+f1(m.execH)+'</td>'
        + '<td class="num">'+f1(m.invisW)+'</td>'
        + '<td class="num">'+f1(m.weighted)+'</td>'
        + '<td>'+esc(flags.join(" · "))+'</td></tr>';
    });
  });
  var spf = t.spf.length
    ? '<p style="font-size:9.5pt;margin:0 0 5pt">One person notices it, arranges it <i>and</i> does it. If that person is ill or away, each of these simply stops. '
      + t.spf.length+' of '+state.cards.length+' responsibilities, heaviest first.</p>'
      + '<ul class="paper-list paper-two">'+t.spf.map(function(x){
          return '<li><b>'+esc(x.card.title)+'</b> — '+esc(personName(x.who))+'</li>'; }).join("")+'</ul>'
    : '<p>None. Every responsibility has at least two people inside it.</p>';
  var per = '<table class="paper-tbl"><thead><tr><th>Person</th><th>Cards</th><th>Doing time</th><th>Invisible load</th><th class="num">Weighted hrs/yr</th></tr></thead><tbody>'
    + state.people.map(function(p){
        var w = t.who[p.id];
        return '<tr><td>'+esc(p.name)+'</td><td>'+pctText(w.cardShare,t.tot.cardShare,1)+'%</td><td>'+pctText(w.execH,t.tot.execH,1)
          + '%</td><td>'+pctText(w.invisW,t.tot.invisW,1)+'%</td><td class="num">'+f2(w.weighted)+'</td></tr>';
      }).join("")
    + '</tbody></table>';
  return '<div class="paper-doc" data-doc="division">'
    + '<div class="paper-head"><h2>The division of responsibilities</h2>'
    + '<p>'+esc(state.people.map(function(p){return p.name;}).join(", "))+' &middot; '+state.cards.length+' responsibilities &middot; printed '+esc(fmtDate(todayISO()))+'</p></div>'
    + '<p class="paper-say"><b>'+SAY+'</b> '+esc(SAY_LONG)+'</p>'
    + splitBlock(t)
    + '<h3 class="paper-rule">Single points of failure</h3>'+spf
    + '<h3 class="paper-rule">Where each person sits</h3>'+per
    + '<h3 class="paper-rule">Every card, and who holds each part</h3>'
    + '<table class="paper-tbl"><thead><tr><th>Responsibility</th><th>Notices</th><th>Plans</th><th>Does</th><th>How often</th>'
    + '<th class="num">Doing h/yr</th><th class="num">Invisible h/yr</th><th class="num">Weighted</th><th>Notes</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table>'
    + '<div class="paper-foot"><b>'+SAY+'</b> How it is counted: '+esc(METHOD_LINE)+'</div>'
    + '</div>';
}
function paperHandover(){
  var p = state.pack;
  if(!p.from){ p.from = todayISO(); p.to = addDaysISO(todayISO(),7); }
  var who = person(p.who)? p.who : state.mine;
  var r = packRows(who, p.from, p.to);
  var cover = person(p.cover)? p.cover : otherAdult(who);
  var heads = ["Dated inside this window","Will come round while they are away","Standing watch — what stops being noticed"];
  var out = "";
  [0,1,2].forEach(function(b){
    var list = r.rows.filter(function(x){ return x.bucket===b; });
    if(!list.length) return;
    out += '<h3 class="paper-rule">'+esc(heads[b])+' ('+list.length+')</h3>';
    list.forEach(function(x){
      var held = x.holds.filter(function(k){ return k!=="exec"; }).map(function(k){ return PART_NAME[k]; }).join(" + ");
      out += '<div class="paper-hand"><h4>'+esc(x.c.title)+'</h4>'
        + '<p class="who">'+esc(personName(who))+' holds the '+esc(held.toLowerCase())+'.'
        + ' Doing it: '+esc(x.c.exec? personName(x.c.exec):"nobody named")+'.'
        + ' While away, this falls to '+esc(cover? personName(cover):"whoever is here")+'.'
        + ' '+esc(FREQ[x.c.freq].label)+(x.dated? " · dated "+esc(fmtDate(x.c.nextDue)) : (x.occ>=0.95? " · about "+ (x.occ>=3? Math.round(x.occ) : f1(x.occ)) +"× in this window" : ""))+'</p>'
        + '<div class="lines">'
        + '<div><b>Trigger</b> '+esc(x.c.trigger||"—")+'</div>'
        + '<div><b>When</b> '+esc(x.c.timing||"—")+'</div>'
        + (x.c.contacts && !/^nobody\.?$/i.test(x.c.contacts) ? '<div><b>Who</b> '+esc(x.c.contacts)+'</div>' : "")
        + '<div><b>Standard</b> '+esc(x.c.standard||"—")+'</div>'
        + '<div><b>If missed</b> '+esc(STAKES[x.c.stakes].miss)+'</div>'
        + '</div></div>';
    });
  });
  if(!r.rows.length) out = '<p>'+esc(personName(who))+' does not hold the noticing or planning on anything currently on the board.</p>';
  var inWin = r.rows.filter(function(x){ return x.bucket<2; }).length;
  return '<div class="paper-doc" data-doc="handover">'
    + '<div class="paper-head"><h2>Handover pack &mdash; '+esc(personName(who))+'</h2>'
    + '<p>'+esc(fmtSpan(p.from,p.to))+' &middot; '+r.days+' days &middot; covered by '+esc(cover? personName(cover):"—")
    + ' &middot; prepared '+esc(fmtDate(todayISO()))+'</p></div>'
    + '<p class="paper-say"><b>'+SAY+'</b> This is the noticing and the planning &mdash; the part that is invisible until it is missing. '
    + esc(personName(who))+' holds '+r.rows.length+' of these; '+inWin+' land inside this window.</p>'
    + out
    + '<div class="paper-foot"><b>'+SAY+'</b> Generated from the household board on '+esc(fmtDate(todayISO()))+'. Re-generate it for the next trip &mdash; it will have changed.</div>'
    + '</div>';
}
function paperReview(){
  var t = tally();
  var g = gapOf(state, state.partner);
  var gone = t.drifts.filter(function(x){ return x.d.drifted; });
  var kindName = {orphan:"Nobody is watching it", contested:"You both think it is yours", other:"Different answers"};
  var reg = "";
  ["orphan","contested","other"].forEach(function(k){
    var list = g.lines.filter(function(l){ return l.kind===k; });
    if(!list.length) return;
    var packed = [], seen = {};
    list.forEach(function(l){
      var key = l.cardId+"|"+l.mine+"|"+l.theirs;
      if(seen[key]){ seen[key].parts.push(l.part); return; }
      seen[key] = {title:l.title, mine:l.mine, theirs:l.theirs, parts:[l.part]};
      packed.push(seen[key]);
    });
    reg += '<h3 class="paper-rule">'+esc(kindName[k])+' ('+list.length+' part'+(list.length===1?"":"s")+')</h3><ul class="paper-list">'
      + packed.map(function(g){
          var pn = g.parts.length===3 ? "all three parts"
                 : g.parts.map(function(k2){ return PART_NAME[k2].toLowerCase(); }).join(" and ");
          return '<li><b>'+esc(g.title)+'</b> — '+esc(pn)+': '
            + esc(personName(state.mine))+' said '+esc(g.mine==="-"?"nobody":personName(g.mine))
            + ', '+esc(personName(state.partner.who))+' said '+esc(g.theirs==="-"?"nobody":personName(g.theirs))+'.</li>';
        }).join("") + '</ul>';
  });
  if(!state.partner) reg = '<p>No second board has been merged yet. Each of you fills in your own copy blind, then swaps codes.</p>';
  else if(!g.lines.length) reg = '<p>Both boards agree on every part.</p>';
  var drift = t.drifts.length
    ? '<table class="paper-tbl"><thead><tr><th>Responsibility</th><th>Agreed</th><th>Days</th><th>Noticing</th><th>Planning</th><th>Doing</th><th>State</th></tr></thead><tbody>'
      + t.drifts.map(function(x){
          var cell = function(k){
            var want = x.d.want[k]; if(!want) return '<td>—</td>';
            var ok = x.c[k]===want;
            return '<td>'+esc(personName(want))+(ok? "" : " → "+esc(x.c[k]? personName(x.c[k]) : "nobody"))+'</td>';
          };
          return '<tr><td>'+esc(x.c.title)+'</td><td>'+esc(fmtDate(x.d.date,true))+'</td><td class="num">'+(x.d.days==null?"—":x.d.days)+'</td>'
            + cell("notice")+cell("plan")+cell("exec")
            + '<td>'+(x.d.drifted? "DRIFTED":"holding")+'</td></tr>';
        }).join("")+'</tbody></table>'
    : '<p>No handovers have been recorded yet.</p>';
  return '<div class="paper-doc" data-doc="review">'
    + '<div class="paper-head"><h2>Drift &amp; discrepancy</h2><p>Printed '+esc(fmtDate(todayISO()))+' &middot; '
    + t.drifts.length+' handovers on record &middot; '+gone.length+' drifted back</p></div>'
    + '<p class="paper-say"><b>'+SAY+'</b> '+esc(SAY_LONG)+'</p>'
    + '<h3 class="paper-rule">Handovers, and whether they held</h3>'+drift
    + '<h3 class="paper-rule">The discrepancy register'+(g.pct==null? "" : " — "+f1(g.pct)+"% of parts remembered differently")+'</h3>'+reg
    + '<div class="paper-foot"><b>'+SAY+'</b> '+esc(METHOD_LINE)+'</div>'
    + '</div>';
}
function buildPapers(){
  $("#paperout").innerHTML = paperDivision() + paperHandover() + paperReview();
}
function printAs(kind){
  document.body.setAttribute("data-paper", kind);
  buildPapers();
  window.setTimeout(function(){ window.print(); }, 40);
}
window.addEventListener("beforeprint", buildPapers);

/* ===================== boot ===================== */
$("#actPack").addEventListener("click", function(){ openSheet("pack"); });
$("#actMerge").addEventListener("click", function(){ openSheet("merge"); });
$("#actDrift").addEventListener("click", function(){ openSheet("drift"); });
$("#actMenu").addEventListener("click", function(){ moreMsg = ""; moreMsgTone = ""; openSheet("more"); });

var resizeTimer = null;
window.addEventListener("resize", function(){
  window.clearTimeout(resizeTimer);
  resizeTimer = window.setTimeout(function(){
    if(bucketOf() !== layoutBucket){ paintBoard(); fitBoard(); }
    paintBeam(null);
  }, 180);
});

function boot(){
  state = load();
  if(!person(state.mine)) state.mine = state.people[0] ? state.people[0].id : "N";
  focusWho = state.mine;
  $("#podSub").textContent = state.sample? "Sample family" : "Your household";
  paintBoard();
  fitBoard();
  paintBeam(null);
  buildPapers();
  save();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){
      if(bucketOf()===layoutBucket){ paintBoard(); fitBoard(); }
    }).catch(function(){});
  }
}
boot();
</script>
</body>
</html>
