<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Load — who carries the household, including the part nobody sees</title>
<meta name="description" content="Map every household responsibility into noticing, planning and executing. See the three splits, find the single points of failure, and print a handover pack for the week one of you is away.">
<meta name="theme-color" content="#8d877c">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238d877c'/%3E%3Crect x='4.5' y='9' width='6' height='14' rx='2' fill='%231c5c68'/%3E%3Crect x='13' y='9' width='6' height='14' rx='2' fill='%231c5c68'/%3E%3Crect x='21.5' y='9' width='6' height='14' rx='2' fill='%238a5a10'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   THE LOAD — custom property scheme
   --haul-*  the board ground        --tack-*  the responsibility cards
   --glyph-* lettering               --hold-*  a person's colour
   --rule-*  hairlines               --flag-*  alarms and watches
   --nudge-* motion                  --pin-*   geometry
   --type-*  the two families
   ------------------------------------------------------------------ */
:root{
  --haul-ground:#8d877c;
  --haul-deep:#6d685f;
  --haul-lift:#9a9489;
  --tack-face:#f4f1ea;
  --tack-face-sunk:#e8e3d8;
  --tack-face-well:#ded8cb;
  --tack-edge:rgba(38,35,32,.20);
  --tack-cast:0 1px 0 rgba(255,255,255,.55), 0 7px 16px -8px rgba(28,25,21,.62);
  --tack-cast-high:0 2px 0 rgba(255,255,255,.5), 0 22px 38px -14px rgba(24,21,18,.72);
  --glyph-full:#231f1b;
  --glyph-mid:#4b463d;
  --glyph-quiet:#676156;
  --glyph-haul:#1c1915;
  --glyph-flip:#f7f4ed;
  --hold-N:#175a66;
  --hold-T:#8a5410;
  --hold-I:#476a1e;
  --hold-R:#9a3350;
  --hold-x:#5a554d;
  --rule-hair:rgba(38,35,32,.16);
  --rule-firm:rgba(38,35,32,.40);
  --flag-alarm:#a02718;
  --flag-watch:#dfae1c;
  --flag-hold:#3d6a38;
  --nudge-quick:110ms cubic-bezier(.2,.75,.3,1);
  --nudge-settle:360ms cubic-bezier(.16,.86,.3,1);
  --pin-nub:6px;
  --pin-slab:12px;
  --type-say:'Sora','Trebuchet MS',system-ui,sans-serif;
  --type-tell:'Source Sans 3','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--type-tell);
  font-size:15px;
  line-height:1.45;
  color:var(--glyph-haul);
  background:var(--haul-ground);
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:var(--type-say);font-weight:700;margin:0;letter-spacing:-.008em}
p{margin:0 0 .6em}
.hushed{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:2.5px solid #17130f;outline-offset:2px;box-shadow:0 0 0 5px rgba(223,174,28,.9)}
button{font:inherit;color:inherit}

/* ---------- the plane: pan + zoom ground ---------- */
.plane-frame{
  position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background:
    radial-gradient(135% 100% at 50% -10%, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 46%),
    radial-gradient(120% 92% at 50% 105%, rgba(52,48,42,.40) 0%, rgba(52,48,42,0) 62%),
    var(--haul-ground);
}
.plane-frame.is-drag{cursor:grabbing}
.plane{
  position:absolute;left:0;top:0;transform-origin:0 0;
  background-image:radial-gradient(rgba(40,36,31,.17) 1px, rgba(0,0,0,0) 1.3px);
  background-size:34px 34px;
}
.plot{
  position:absolute;padding:13px 15px 16px;border-radius:var(--pin-slab);
  background:linear-gradient(178deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 -1px 0 rgba(40,36,31,.10);
}
.plot-tag{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-family:var(--type-say);font-weight:700;font-size:11.5px;letter-spacing:.17em;
  text-transform:uppercase;color:#231f1a;margin:0 0 11px;
}
.plot-tally{font-family:var(--type-tell);font-weight:600;letter-spacing:.04em;font-size:11px;color:#231f1a;white-space:nowrap}
.plot-bed{column-count:var(--bed-cols,2);column-gap:11px;width:100%}

/* ---------- a tack: one responsibility ---------- */
.tack{
  position:relative;background:var(--tack-face);border:1px solid var(--tack-edge);
  border-radius:9px;box-shadow:var(--tack-cast);padding:0 0 8px;overflow:hidden;display:block;
  break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 11px;
  transition:box-shadow var(--nudge-quick),transform var(--nudge-quick);
}
.tack::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hold-x);opacity:.55}
.tack[data-solo="1"]::before{background:var(--flag-alarm);opacity:1;width:5px}
.tack[data-drift="1"]{box-shadow:var(--tack-cast),0 0 0 2px var(--flag-alarm)}
.tack.is-lift{transform:translateY(-2px);box-shadow:var(--tack-cast-high)}
.tack-grip{
  display:block;width:100%;text-align:left;background:none;border:0;cursor:grab;
  padding:9px 10px 7px 12px;
}
.tack-grip:active{cursor:grabbing}
.tack-name{font-family:var(--type-say);font-weight:600;font-size:14px;line-height:1.2;color:var(--glyph-full);display:block}
.tack-meta{display:block;margin-top:5px;font-size:11.5px;color:var(--glyph-mid);letter-spacing:.01em}
.tack-freq{display:block;font-family:var(--type-say);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--glyph-quiet)}
.tack-figs{display:block;margin-top:2px;line-height:1.3}
.tack-figs em{font-style:normal;color:var(--glyph-quiet)}
.tack-hrs{font-family:var(--type-say);font-weight:600;font-variant-numeric:tabular-nums;color:var(--glyph-mid)}
.tack-parts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;padding:0 9px 0 12px}
.chip{
  display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:4px 3px;border-radius:6px;
  background:var(--tack-face-sunk);border:1px solid rgba(38,35,32,.10);cursor:grab;
  transition:background var(--nudge-quick),transform var(--nudge-quick);
}
.chip:hover{background:var(--tack-face-well)}
.chip:active{cursor:grabbing}
.chip-key{font-family:var(--type-say);font-size:8px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#5c564b;text-align:center}
.chip-who{
  font-family:var(--type-say);font-weight:700;font-size:12.5px;line-height:1.45;color:#fff;
  border-radius:4px;text-align:center;background:var(--chip-hold,var(--hold-x));
}
.chip[data-empty="1"] .chip-who{background:transparent;color:#8d867a;border:1px dashed rgba(38,35,32,.35)}
.tack-tail{display:flex;gap:5px;flex-wrap:wrap;padding:7px 9px 0 12px}
.nub{
  font-family:var(--type-say);font-weight:700;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 5px;border-radius:4px;background:var(--tack-face-well);color:#443f36;
}
.nub[data-tone="alarm"]{background:#f2ddd8;color:#7d1d12}
.nub[data-tone="hold"]{background:#dfead9;color:#2f5329}
.nub[data-tone="watch"]{background:#f6ecc9;color:#6b5209}
.nub[data-tone="pass"]{background:#dce8ea;color:#0f4750}

/* ---------- the floating pod ---------- */
.pod{
  position:fixed;top:14px;left:14px;z-index:30;display:flex;align-items:center;gap:10px;
  background:var(--tack-face);border:1px solid var(--tack-edge);border-radius:13px;
  box-shadow:var(--tack-cast-high);padding:9px 10px 9px 13px;max-width:calc(100vw - 28px);
}
.pod-mark{display:flex;flex-direction:column;line-height:1;padding-right:2px}
.pod-mark h1{font-size:16px;font-weight:800;letter-spacing:-.02em}
.pod-sub{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--glyph-quiet);margin-top:3px;font-weight:600}
.say-sm{display:none}
.press{
  font-family:var(--type-say);font-weight:600;font-size:12.5px;letter-spacing:-.005em;
  border:1px solid var(--rule-hair);background:var(--tack-face-sunk);color:var(--glyph-full);
  border-radius:8px;padding:8px 11px;cursor:pointer;white-space:nowrap;
  transition:background var(--nudge-quick),transform var(--nudge-quick),box-shadow var(--nudge-quick);
}
.press:hover{background:var(--tack-face-well)}
.press:active{transform:translateY(1px)}
.press[data-lead]{background:#231f1b;color:var(--glyph-flip);border-color:#231f1b}
.press[data-lead]:hover{background:#3a342c}
.press[data-slim]{padding:6px 9px;font-size:11.5px}
.press[aria-pressed="true"]{background:#231f1b;color:var(--glyph-flip);border-color:#231f1b}
.knob{
  position:fixed;right:14px;bottom:14px;z-index:30;display:flex;flex-direction:column;gap:5px;
  background:var(--tack-face);border:1px solid var(--tack-edge);border-radius:11px;
  box-shadow:var(--tack-cast);padding:5px;
}
.knob button{
  width:36px;height:32px;border:0;background:none;border-radius:7px;cursor:pointer;
  font-family:var(--type-say);font-weight:700;font-size:14px;color:var(--glyph-mid);
}
.knob button:hover{background:var(--tack-face-well)}
.knob-read{font-family:var(--type-say);font-size:9.5px;font-weight:600;text-align:center;color:var(--glyph-quiet);font-variant-numeric:tabular-nums}

/* ---------- the beam: the three splits ---------- */
.beam{
  position:fixed;left:14px;bottom:14px;z-index:28;width:min(468px,calc(100vw - 28px));
  background:var(--tack-face);border:1px solid var(--tack-edge);border-radius:13px;
  box-shadow:var(--tack-cast-high);padding:11px 13px 10px;
}
.beam-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:9px}
.beam-head h2{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--glyph-quiet);font-weight:700;white-space:nowrap}
.beam-who{font-size:11px;color:var(--glyph-quiet)}
.beam-who b{font-family:var(--type-say);font-weight:700;color:var(--glyph-full)}
.beam-set{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:10px}
.beam-cut{padding:7px 8px 8px;border-radius:9px;background:var(--tack-face-sunk)}
.beam-cut[data-star="1"]{background:#2c2721;color:var(--glyph-flip)}
.beam-key{font-family:var(--type-say);font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--glyph-quiet)}
.beam-cut[data-star="1"] .beam-key{color:#cdc4b2}
.beam-fig{display:flex;align-items:baseline;gap:4px;margin:3px 0 6px}
.beam-fig b{font-family:var(--type-say);font-weight:800;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.beam-fig span{font-family:var(--type-say);font-size:11px;font-weight:600;color:var(--glyph-quiet)}
.beam-cut[data-star="1"] .beam-fig span{color:#cdc4b2}
.beam-shift{font-family:var(--type-say);font-size:10.5px;font-weight:700;padding:1px 4px;border-radius:4px;background:var(--flag-watch);color:#2b2208}
.beam-lane{display:flex;height:8px;border-radius:4px;overflow:hidden;background:rgba(38,35,32,.16)}
.beam-cut[data-star="1"] .beam-lane{background:rgba(255,255,255,.18)}
.beam-lane i{display:block;transition:width var(--nudge-settle)}
.beam-note{font-size:10.5px;color:var(--glyph-quiet);margin-top:5px;line-height:1.3}
.beam-cut[data-star="1"] .beam-note{color:#cbc2b0}
.beam-say{
  margin-top:9px;padding-top:8px;border-top:1px solid var(--rule-hair);
  font-size:11.5px;line-height:1.35;color:var(--glyph-mid);display:block;
}
.beam-say b{font-family:var(--type-say);font-weight:700;color:var(--glyph-full);margin-right:4px}

/* ---------- the docks: drop a part on a person ---------- */
.dock-rail{
  position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:29;
  display:flex;flex-direction:column;gap:7px;
}
.dock{
  position:relative;display:block;width:150px;text-align:left;background:var(--tack-face);
  border:1px solid var(--tack-edge);border-radius:11px;box-shadow:var(--tack-cast);
  padding:8px 10px 9px 14px;cursor:pointer;overflow:hidden;
  transition:transform var(--nudge-quick),box-shadow var(--nudge-quick);
}
.dock::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--dock-hold)}
.dock.is-target{transform:translateX(-6px);box-shadow:0 0 0 3px var(--flag-watch),var(--tack-cast-high)}
.dock-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:1px}
.dock-name{font-family:var(--type-say);font-weight:700;font-size:13px;color:var(--glyph-full)}
.dock-age{font-size:10px;color:var(--glyph-quiet)}
.dock-fig{display:block;font-family:var(--type-say);font-weight:800;font-size:20px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.dock-sub{display:block;font-size:10px;line-height:1.25;color:var(--glyph-quiet);margin:2px 0 6px}
.dock-bar{display:block;height:5px;border-radius:3px;background:rgba(38,35,32,.15);overflow:hidden}
.dock-bar i{display:block;height:100%;background:var(--dock-hold);transition:width var(--nudge-settle)}
.ghost{
  position:fixed;z-index:70;pointer-events:none;background:var(--tack-face);
  border:1px solid var(--rule-firm);border-radius:8px;box-shadow:var(--tack-cast-high);
  padding:6px 9px;font-family:var(--type-say);font-weight:600;font-size:12.5px;
  transform:translate(-50%,-140%);max-width:230px;
}
.ghost small{display:block;font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--glyph-quiet)}

/* ---------- sheets ---------- */
.sheetup{position:fixed;inset:0;z-index:80;background:rgba(30,27,22,.62);display:none;overflow:auto;padding:26px 20px 40px}
.sheetup[data-open="1"]{display:block}
.sheetup-face{
  max-width:860px;margin:0 auto;background:var(--tack-face);border-radius:15px;
  box-shadow:0 34px 80px -24px rgba(20,17,14,.8);padding:22px 24px 30px;
}
.sheetup-bar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:4px}
.sheetup-bar h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.lede{font-size:14px;color:var(--glyph-mid);max-width:62ch;margin:2px 0 16px}
.hr{border:0;border-top:1px solid var(--rule-hair);margin:18px 0}
.pairs{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.pair{display:flex;flex-direction:column;gap:4px}
.pair label,.pair>span{font-family:var(--type-say);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--glyph-quiet)}
.pair input,.pair select,.pair textarea{
  font-family:var(--type-tell);font-size:14px;padding:7px 9px;border-radius:7px;
  border:1px solid var(--rule-firm);background:#fdfcf8;color:var(--glyph-full);min-width:0;
}
.pair textarea{min-height:56px;resize:vertical}
.pair input[type=date]{min-width:150px}
.wide-pair{flex:1 1 260px}
.wide-pair input,.wide-pair textarea{width:100%}
.regline{
  display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:start;
  padding:11px 0;border-top:1px solid var(--rule-hair);
}
.regline:first-of-type{border-top:0}
.regline h4{font-size:14.5px;font-weight:600}
.regline p{margin:3px 0 0;font-size:13px;color:var(--glyph-mid)}
.regline-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag-set{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.who-pill{
  font-family:var(--type-say);font-weight:700;font-size:10.5px;color:#fff;background:var(--pill-hold,var(--hold-x));
  padding:2px 7px;border-radius:20px;
}
.blockquiet{background:var(--tack-face-sunk);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--glyph-mid)}
.blockquiet b{color:var(--glyph-full)}
.codebox{
  width:100%;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:11px;
  line-height:1.5;padding:10px;border-radius:8px;border:1px solid var(--rule-firm);
  background:#fdfcf8;min-height:110px;resize:vertical;word-break:break-all;color:var(--glyph-mid);
}
.seg{display:flex;gap:0;border:1px solid var(--rule-firm);border-radius:8px;overflow:hidden;background:#fdfcf8}
.seg button{flex:1;border:0;background:none;padding:9px 6px;cursor:pointer;font-family:var(--type-say);font-weight:600;font-size:12.5px;color:var(--glyph-mid);border-right:1px solid var(--rule-hair)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--seg-hold,#231f1b);color:#fff}
.mapline{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.mapline>span{font-family:var(--type-say);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--glyph-quiet)}
.metagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.metabox{background:var(--tack-face-sunk);border-radius:9px;padding:9px 11px}
.metabox b{display:block;font-family:var(--type-say);font-weight:800;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums}
.metabox span{font-size:11px;color:var(--glyph-quiet);letter-spacing:.03em}
.listing{margin:0;padding:0;list-style:none}
.listing li{padding:9px 0;border-top:1px solid var(--rule-hair);font-size:13.5px}
.listing li:first-child{border-top:0}
.listing b{font-family:var(--type-say);font-weight:600}
.warnstrip{background:#f6e6e2;border-left:4px solid var(--flag-alarm);padding:10px 13px;border-radius:0 8px 8px 0;font-size:13.5px;color:#5f1c11;margin-bottom:14px}
.saystrip{background:#efeade;border-left:4px solid #231f1b;padding:11px 14px;border-radius:0 8px 8px 0;font-size:13.5px;margin:16px 0 0}
.saystrip b{font-family:var(--type-say)}

/* ---------- print ---------- */
.paperout{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000;font-size:10.5pt}
  .plane-frame,.pod,.beam,.dock-rail,.knob,.sheetup,.ghost{display:none!important}
  .paperout{display:block}
  @page{size:A4;margin:14mm 13mm}
  .paper-doc{display:none}
  body[data-paper="division"] .paper-doc[data-doc="division"],
  body[data-paper="handover"] .paper-doc[data-doc="handover"],
  body[data-paper="review"] .paper-doc[data-doc="review"]{display:block}
  .paper-head{border-bottom:2.5pt solid #000;padding-bottom:6pt;margin-bottom:10pt}
  .paper-head h2{font-size:19pt;letter-spacing:-.02em;margin-bottom:2pt}
  .paper-head p{font-size:9.5pt;margin:0;color:#333}
  .paper-say{border:1.5pt solid #000;padding:6pt 8pt;margin:0 0 10pt;font-size:10pt}
  .paper-say b{font-family:var(--type-say)}
  .paper-splits{display:flex;gap:8pt;margin:0 0 11pt}
  .paper-splits div{flex:1;border:.75pt solid #999;padding:5pt 7pt}
  .paper-splits h3{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;margin:0 0 3pt}
  .paper-splits b{font-family:var(--type-say);font-size:15pt;display:block;line-height:1.1}
  .paper-splits small{font-size:8pt;color:#333;display:block}
  h3.paper-rule{font-size:11pt;border-bottom:.75pt solid #000;padding-bottom:2pt;margin:13pt 0 6pt;page-break-after:avoid}
  table.paper-tbl{width:100%;border-collapse:collapse;font-size:8.6pt}
  table.paper-tbl th{text-align:left;border-bottom:1pt solid #000;padding:3pt 4pt;font-family:var(--type-say);font-size:7.5pt;letter-spacing:.09em;text-transform:uppercase}
  table.paper-tbl td{border-bottom:.5pt solid #bbb;padding:3pt 4pt;vertical-align:top}
  table.paper-tbl tr{page-break-inside:avoid}
  .paper-tbl .num{text-align:right;font-variant-numeric:tabular-nums}
  .paper-hand{border:.75pt solid #666;padding:6pt 8pt;margin:0 0 7pt;page-break-inside:avoid}
  .paper-hand h4{font-size:11pt;margin:0 0 1pt}
  .paper-hand .lines{font-size:9pt;margin:4pt 0 0}

  return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;")

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function num(v,d){ v=Number(v); return isFinite(v)?v:(d||0); }
function f1(v){ return isFinite(v)? (Math.round(v*10)/10).toFixed(1) : "—"; }
function f2(v){ return isFinite(v)? (Math.round(v*100)/100).toFixed(2) : "—"; }
function pctText(part,total,dp){
  if(!isFinite(part)||!isFinite(total)||total<=0) return "—";
  var v = part/total*100;
  if(dp===1) return (Math.round(v*10)/10).toFixed(1);
  if(v>0 && v<0.5) return "<1";
  return String(Math.round(v));
}
function pctShort(part,total){
  if(!isFinite(part)||!isFinite(total)||total<=0) return "—";
  var v = part/total*100;
  if(v<=0) return "0%";
  if(v<0.5) return "<1%";
  if(v<10) return (Math.round(v*10)/10).toFixed(1)+"%";
  return Math.round(v)+"%";
}
function pctNum(part,total){
  if(!isFinite(part)||!isFinite(total)||total<=0) return null;
  return part/total*100;
