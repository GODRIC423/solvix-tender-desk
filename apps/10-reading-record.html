<script>
"use strict";
/* ============================================================================
   THE ONE-MINUTE CHECK
   ========================================================================== */
function viewCheck(echo){
  var kid=kidOr(); if(!kid) return;
  var open=lastTouched(kid.id);
  var h='<h2 class="celltitle">One-minute check <span class="qual">'+esc(kid.name)+'</span></h2>'+
    '<p class="prose" style="margin-bottom:9px">Hand '+esc(kid.name)+' whatever book is nearest'+(open?' — '+esc(open.title)+' is open':'')+
    '. Press start, let '+(kid.name)+' read aloud for sixty seconds, then type how many words were read and how many were wrong. '+
    'A word is wrong if it is misread, skipped or given to them. Self-corrections do not count.</p>'+
    '<div class="checkbox2">'+
      '<span class="bigclock" data-role="clock">60</span>'+
      '<div class="clockbar" aria-hidden="true"><i data-role="bar"></i></div>'+
      '<div class="acts" style="margin-top:0">'+
        '<button class="act hot" data-role="start">Start the minute</button>'+
        '<button class="act" data-role="skip">Skip the timer</button>'+
      '</div>'+
      '<div data-role="tally" hidden>'+
        '<div class="tally">'+
          '<div><label for="w-'+esc(kid.id)+'">Words read</label><input id="w-'+esc(kid.id)+'" data-role="words" type="number" min="1" max="400" inputmode="numeric"></div>'+
          '<div><label for="e-'+esc(kid.id)+'">Errors</label><input id="e-'+esc(kid.id)+'" data-role="errs" type="number" min="0" max="200" inputmode="numeric" value="0"></div>'+
        '</div>'+
        '<div class="acts"><button class="act hot" data-role="score">Score it</button></div>'+
      '</div>'+
      '<p class="checkout" data-role="out"></p>'+
    '</div>'+DISCLAIM;
  var cell=emit(echo,h,{fresh:true});
  var clock=cell.querySelector('[data-role=clock]'), bar=cell.querySelector('[data-role=bar]');
  var tally=cell.querySelector('[data-role=tally]'), out=cell.querySelector('[data-role=out]');
  var wIn=cell.querySelector('[data-role=words]'), eIn=cell.querySelector('[data-role=errs]');
  var timer=null, left=60;
  function reveal(){
    tally.hidden=false; clock.classList.remove("running");
    out.innerHTML='<b>Time.</b> Mark the last word read, then count back.';
    try{ wIn.focus(); }catch(e){}
  }
  cell.querySelector('[data-role=start]').addEventListener("click",function(){
    if(timer) return;
    left=60; clock.textContent="60"; clock.classList.add("running"); bar.style.width="0%";
    var t0=Date.now();
    timer=setInterval(function(){
      var el2=(Date.now()-t0)/1000;
      left=Math.max(0,60-el2);
      clock.textContent=Math.ceil(left);
      bar.style.width=fx(clamp(el2/60,0,1)*100,1)+"%";
      if(left<=0){ clearInterval(timer); timer=null; clock.textContent="0"; reveal(); }
    },100);
  });
  cell.querySelector('[data-role=skip]').addEventListener("click",function(){
    if(timer){ clearInterval(timer); timer=null; }
    bar.style.width="100%"; clock.textContent="0"; reveal();
  });
  cell.querySelector('[data-role=score]').addEventListener("click",function(){
    var words=intOr(wIn.value,NaN), errs=intOr(eIn.value,0);
    if(!isFinite(words)||words<1){ out.innerHTML='<b style="color:var(--mark-red)">Type how many words were read.</b>'; try{wIn.focus();}catch(e){} return; }
    if(!isFinite(errs)||errs<0) errs=0;
    if(errs>words) errs=words;
    var rec={ id:uid(), childId:kid.id, date:ymd(today()), words:words, errors:errs,
              bookId:open?open.id:null, bookTitle:open?open.title:"" };
    S.checks.push(rec); save();
    var r=checkRow(rec);
    var lines='<span class="bignum">'+r.wcpm+'</span> words correct per minute · accuracy <b>'+fx(r.accuracy,1)+'%</b>';
    if(r.norm&&r.pct!==null){
      lines+='<br>Grade '+r.grade+' '+SEASON_LABEL[r.season]+' median is <b>'+r.norm.p50+'</b>. That puts '+esc(kid.name)+
             ' at about the <b>'+ordinal(r.pct)+' percentile</b>.';
    } else {
      lines+='<br>No published norm for grade '+r.grade+' '+SEASON_LABEL[r.season]+', so no percentile this time.';
    }
    if(r.accuracy!==null&&r.accuracy<95) lines+='<br>Below 95% accuracy — this book is at instructional level, not independent.';
    out.innerHTML=lines;
    tally.hidden=true;
    renderChrome();
    toast("Check saved · "+r.wcpm+" wcpm");
  });
  [wIn,eIn].forEach(function(inp){
    inp.addEventListener("keydown",function(ev){
      if(ev.key==="Enter"){ ev.preventDefault(); cell.querySelector('[data-role=score]').click(); }
    });
  });
}

      h+='<div class="flagitem" style="margin-bottom:11px"><p class="flaghead" style="font-size:12.5px">'+(i+1)+'. '+esc(x.ask)+'</p>'+
         '<p class="flagwhy" style="font-size:10.5px">'+x.why+'</p>'+
         '<table class="bkt" style="margin-top:5px"><tbody>';
      x.rows.forEach(function(r){ h+='<tr><th style="width:38%">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>'; });
      h+='</tbody></table></div>';
    });
  }
  if(ser.length>=2){
    h+='<p style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin:8px 0 3px">Fluency checks</p>';
    h+='<table class="bkt"><thead><tr><th>Date</th><th>Book</th><th class="num">Words</th><th class="num">Err</th><th class="num">WCPM</th><th class="num">Accuracy</th><th class="num">Grade median</th><th class="num">Percentile</th></tr></thead><tbody>';
    ser.slice(-8).reverse().forEach(function(r){
      h+='<tr><td>'+esc(fmtNum(r.date))+'</td><td>'+esc(r.book||"—")+'</td><td class="num">'+r.words+'</td><td class="num">'+r.errors+
         '</td><td class="num">'+r.wcpm+'</td><td class="num">'+(r.accuracy===null?"—":fx(r.accuracy,1)+"%")+
         '</td><td class="num">'+(r.norm?r.norm.p50:"—")+'</td><td class="num">'+(r.pct===null?"—":ordinal(r.pct))+'</td></tr>';
    });
    h+='</tbody></table>';
    h+='<p style="font-size:9.5px;color:#4a4a4a;margin-top:5px">Norms: '+ORF_CITE+'</p>';
  }
  h+=PRINT_WARN;
  doPrint(h);
}

/* ============================================================================
   EXPORT / IMPORT

function csvCell(v){
  var s=(v==null?"":String(v));
  if(/[",\r\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';
  return s;
}
function csvDoc(rows){
  return "﻿"+rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n")+"\r\n";
}
function download(name,mime,text){
  try{
    var blob=new Blob([text],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },800);
    return true;
  }catch(e){ return false; }
}
function exportEntriesCSV(){
  var rows=[["child","date","book","level","genre","page_from","page_to","minutes","finished","tags","note","comment"]];
  S.entries.slice(0).sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:a.seq-b.seq); }).forEach(function(e){
    var k=childById(e.childId), b=e.bookId?bookById(e.bookId):null;
    rows.push([ k?k.name:"", e.date, b?b.title:"", b&&b.level!=null?b.level:"", b?b.genre:"",
                e.from==null?"":e.from, e.to==null?"":e.to, isFinite(e.minutes)?e.minutes:"",
                e.fin?"yes":"", (e.tags||[]).join("; "), e.note||"", commentFor(e) ]);
  });
  download("reading-record-entries.csv","text/csv;charset=utf-8",csvDoc(rows));
}
function exportChecksCSV(){
  var rows=[["child","date","book","genre","words","errors","wcpm","accuracy_pct","grade","season","norm_p50","percentile"]];
  S.checks.slice(0).sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(c){
    var r=checkRow(c); if(!r) return;
    var k=childById(c.childId);
    rows.push([ k?k.name:"", r.date, r.book, r.genre||"", r.words, r.errors, r.wcpm,
                r.accuracy===null?"":fx(r.accuracy,2), r.grade, r.season,
                r.norm?r.norm.p50:"", r.pct===null?"":fx(r.pct,1) ]);
  });
  download("reading-record-fluency.csv","text/csv;charset=utf-8",csvDoc(rows));
}
function exportJSON(){
  download("reading-record.json","application/json",JSON.stringify(S,null,2));
}
function importJSON(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json"; inp.style.display="none";
  document.body.appendChild(inp);
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];
    if(!f){ inp.remove(); return; }
    var rd=new FileReader();
    rd.onload=function(){
      var ok=false;
      try{
        var o=JSON.parse(String(rd.result));
        if(o&&typeof o==="object"&&Array.isArray(o.children)&&Array.isArray(o.entries)){
          o.books=Array.isArray(o.books)?o.books:[];
          o.checks=Array.isArray(o.checks)?o.checks:[];
          o.settings=(o.settings&&typeof o.settings==="object")?o.settings:{schoolApp:false,signature:"",termStart:null,termEnd:null};
          o.sample=false;
          S=o; active=(S.children[0]||{}).id||null; save(); ok=true;
        }
      }catch(e){ ok=false; }
      inp.remove();
      if(ok){ clearBack(); renderChrome(); boot(true); toast("Imported."); }
      else emit("/import",'<p class="prose"><b style="color:var(--mark-red)">That file did not read as a Reading Record export.</b> Nothing was changed.</p>');
    };
    rd.onerror=function(){ inp.remove(); emit("/import",'<p class="prose"><b style="color:var(--mark-red)">Could not read that file.</b></p>'); };
    rd.readAsText(f);
  });
  inp.click();
}

<script>
"use strict";
/* ============================================================================
   COMMIT / UNDO
   ========================================================================== */
var undoStack=[];
function reseq(){
  S.entries.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:(a.seq||0)-(b.seq||0)); });
  S.entries.forEach(function(e,i){ e.seq=i; });
}
function commitParse(p){
  var book=p.bookId?bookById(p.bookId):null, madeBook=false;
  if(!book&&p.title){
    book=mkBook(p.childId,p.title,p.level,p.genre||"fiction",null);
    S.books.push(book); madeBook=true;
  }
  if(book){
    if(p.level!=null) book.level=p.level;
    if(p.genre) book.genre=p.genre;
  }
  var e={ id:uid(), childId:p.childId, bookId:book?book.id:null, date:p.date,
          from:p.from, to:p.to, minutes:p.minutes, tags:p.tags.slice(0),
          note:p.note, fin:!!p.fin, seq:S.entries.length };
  S.entries.push(e); reseq();
  undoStack.push({ kind:"entry", id:e.id, bookId:madeBook&&book?book.id:null });
  if(S.sample===true && !S._touched){ S._touched=true; }
  save();
  return e;
}
function undoLast(){
  var u=undoStack.pop();
  if(!u){ emit("/undo",'<p class="prose">Nothing to undo in this session.</p>'); return; }
  if(u.kind==="entry"){
    var idx=-1,i;
    for(i=0;i<S.entries.length;i++) if(S.entries[i].id===u.id) idx=i;
    if(idx<0){ emit("/undo",'<p class="prose">That night is already gone.</p>'); return; }
    var e=S.entries[idx];
    var b=e.bookId?bookById(e.bookId):null;
    S.entries.splice(idx,1);
    if(u.bookId){
      var stillUsed=S.entries.some(function(x){ return x.bookId===u.bookId; });
      if(!stillUsed){ for(i=0;i<S.books.length;i++) if(S.books[i].id===u.bookId){ S.books.splice(i,1); break; } }
    }
    reseq(); save(); renderChrome();
    emit("/undo",'<p class="prose">Removed <b>'+esc(fmtShort(e.date))+'</b> — '+esc(b?b.title:"—")+
      ((e.from!==null)?', pp.'+e.from+'–'+e.to:'')+'. The page count went back with it.</p>',{fresh:true});
  } else if(u.kind==="check"){
    for(var j=0;j<S.checks.length;j++) if(S.checks[j].id===u.id){ S.checks.splice(j,1); break; }
    save(); renderChrome();
    emit("/undo",'<p class="prose">Removed that fluency check.</p>',{fresh:true});
  }
}

/* ============================================================================
   COMMANDS
   ========================================================================== */
function argDate(tok,fallback){
  if(!tok) return fallback;
  if(/^\d{4}-\d{2}-\d{2}$/.test(tok)&&parseYMD(tok)) return tok;
  var off=resolveDateToken(tok);
  return off===null?fallback:offYMD(off);
}
function runCommand(line){
  var raw=line.trim();
  var parts=raw.slice(1).split(/\s+/);
  var cmd=(parts[0]||"").toLowerCase();
  var rest=raw.slice(1+cmd.length).trim();
  var kid=activeChild();

  switch(cmd){
    case "": case "help": case "?": case "h": viewHelp(raw); return;
    case "week": case "w": viewWeek(raw); return;
    case "term": case "t": case "heat": viewTerm(raw); return;
    case "books": case "shelf": case "b": viewBooks(raw); return;
    case "check": case "c": viewCheck(raw); return;
    case "fluency": case "f": case "wcpm": viewFluency(raw); return;
    case "flags": case "stall": case "x": viewFlags(raw); return;
    case "crib": viewCrib(raw); return;
    case "who": case "kids":
      if(!rest){ viewWho(raw); return; }
      var w=rest.split(/\s+/);
      if(w[0].toLowerCase()==="add"){
        var nm=w[1]?titleCase(w[1]):"";
        if(!nm){ emit(raw,'<p class="prose"><b style="color:var(--mark-red)">Give a name:</b> /who add Sam y2</p>'); return; }
        var yr=w[2]||"", gm=/y(?:ear)?\s*(\d)/i.exec(yr), grade=gm?clamp(intOr(gm[1],3)-1,1,6):3;
        var nk={ id:"kid-"+uid(), name:nm, initial:nm[0].toLowerCase(), year:gm?("Year "+gm[1]):"",
                 grade:grade, gradeYear:schoolYear(today()), target:100, free:false };
        S.children.push(nk); active=nk.id; save(); renderChrome();
        emit(raw,'<p class="prose">Added <b>'+esc(nm)+'</b>'+(gm?', Year '+gm[1]+' (grade '+grade+' for the norm table)':'')+
          '. Start a line with <b>'+esc(nm.toLowerCase())+'</b> or <b>'+esc(nm[0].toLowerCase())+'</b> to route to '+esc(nm)+'.</p>',{fresh:true});
        return;
      }
      var target=null;
      S.children.forEach(function(k){
        if(k.name.toLowerCase()===w[0].toLowerCase()||String(k.initial).toLowerCase()===w[0].toLowerCase()) target=k;
      });
      if(target){ active=target.id; save(); renderChrome(); emit(raw,'<p class="prose">Now logging for <b>'+esc(target.name)+'</b>.</p>',{fresh:true}); }
      else emit(raw,'<p class="prose"><b style="color:var(--mark-red)">No reader called '+esc(w[0])+'.</b> /who lists them.</p>');
      return;
    case "target":
      if(!kid) return;
      var tv=intOr(rest,NaN);
      if(!isFinite(tv)||tv<1||tv>2000){ emit(raw,'<p class="prose"><b style="color:var(--mark-red)">Give minutes a week:</b> /target 100</p>'); return; }
      kid.target=tv; save(); renderChrome();
      emit(raw,'<p class="prose">'+esc(kid.name)+'’s weekly target is now <b>'+tv+' minutes</b>.</p>',{fresh:true});
      return;
    case "grade":
      if(!kid) return;
      var gv=intOr(rest,NaN);
      if(!isFinite(gv)||gv<1||gv>6){ emit(raw,'<p class="prose"><b style="color:var(--mark-red)">Grade 1 to 6</b> — the norm table only covers those. UK Year 3 is grade 2, Year 4 is grade 3, and so on.</p>'); return; }
      kid.grade=gv; kid.gradeYear=schoolYear(today()); save(); renderChrome();
      emit(raw,'<p class="prose">'+esc(kid.name)+' is now scored against <b>grade '+gv+'</b> norms.</p>',{fresh:true});
      return;
    case "level": case "band":
      if(!kid) return;
      var lm=/^(.*)\s+(\d{1,3})$/.exec(rest);
      if(!lm){ emit(raw,'<p class="prose"><b style="color:var(--mark-red)">Try:</b> /level charlottes web 12</p>'); return; }
      var lb=findBook(kid.id,lm[1]);
      if(!lb){ emit(raw,'<p class="prose"><b style="color:var(--mark-red)">No book called '+esc(lm[1])+'</b> for '+esc(kid.name)+'.</p>'); return; }
      lb.level=intOr(lm[2],null); save(); renderChrome();
      emit(raw,'<p class="prose">'+esc(lb.title)+' is level <b>'+lb.level+'</b>.</p>',{fresh:true});
      return;
    case "nf": case "nonfiction": case "fic": case "fiction":
      if(!kid) return;
      var gb=findBook(kid.id,rest);
      if(!gb){ emit(raw,'<p class="prose"><b style="color:var(--mark-red)">No book called '+esc(rest)+'</b> for '+esc(kid.name)+'.</p>'); return; }
      gb.genre=(cmd==="nf"||cmd==="nonfiction")?"nonfiction":"fiction"; save();
      emit(raw,'<p class="prose">'+esc(gb.title)+' marked <b>'+gb.genre+'</b>.</p>',{fresh:true});
      return;
    case "free":
      if(!kid) return;
      kid.free = rest.toLowerCase()!=="off"; save(); renderChrome();
      emit(raw,'<p class="prose">'+esc(kid.name)+' is on the <b>'+(kid.free?"independent-reading track":"school booklet track")+'</b>. '+
        (kid.free? 'Streak pressure and the weekly minutes target drop away. Books finished, genre breadth, series progression and the weekly fluency check carry on — they are what keeps working after the booklet stops.'
                 : 'Weekly minutes and the night streak are back.')+'</p>',{fresh:true});
      return;
    case "schoolapp":
      S.settings.schoolApp = rest.toLowerCase()!=="off"; save(); renderChrome();
      emit(raw,'<p class="prose">School-uses-an-app mode is <b>'+(S.settings.schoolApp?"on":"off")+'</b>. '+
        (S.settings.schoolApp? 'Logging drops to a stub — type <b>ella done</b> or <b>ella 20m</b> and nothing more is asked of you. The measurement track is untouched: the weekly one-minute check, the percentile against published norms, and the stall detector all carry on, because the school’s app will not give you any of them.'
                             : 'Full logging is back.')+'</p>',{fresh:true});
      return;
    case "sig": case "signature":
      S.settings.signature=rest; save();
      emit(raw,'<p class="prose">Signature column will read <b>'+esc(rest||"(blank)")+'</b> where it is pre-filled.</p>',{fresh:true});
      return;
    case "record": case "booklet": case "print":
      var a=rest.split(/\s+/).filter(Boolean), tr=termRange();
      if(cmd==="print"&&a[0]&&/^(crib|evening|record)$/i.test(a[0])){
        var which=a[0].toLowerCase();
        if(which==="crib"){ printCrib(); toast("Crib sent to print"); return; }
        if(which==="evening"){ printEvening(); toast("Evening sheet sent to print"); return; }
        a=a.slice(1);
      }
      var f1=argDate(a[0],tr.from), f2=argDate(a[1],ymd(today()));
      if(f1>f2){ var sw=f1; f1=f2; f2=sw; }
      emit(raw,'<p class="prose">Printing the booklet record for <b>'+esc(kid?kid.name:"—")+'</b>, '+
        esc(fmtShort(f1))+' to '+esc(fmtShort(f2))+'. Every night, with a signature column.</p>',{fresh:true});
      printRecord(f1,f2);
      return;
    case "evening": case "parents":
      emit(raw,'<p class="prose">Printing the parents’ evening sheet — three questions with the data underneath.</p>',{fresh:true});
      printEvening(); return;
    case "export":
      var kind=(rest||"csv").toLowerCase();
      if(kind==="json"){ exportJSON(); emit(raw,'<p class="prose">Full JSON exported — <b>/import</b> reads it back.</p>',{fresh:true}); }
      else if(kind==="checks"||kind==="fluency"){ exportChecksCSV(); emit(raw,'<p class="prose">Fluency checks exported as CSV.</p>',{fresh:true}); }
      else { exportEntriesCSV(); emit(raw,'<p class="prose">Every night exported as CSV, comment column included.</p>',{fresh:true}); }
      return;
    case "import": importJSON(); return;
    case "undo": case "u": undoLast(); return;
    case "clear": case "cls": clearBack(); emit(null,'<p class="prose">Screen cleared. Nothing was deleted — <b>/term</b> brings it all back.</p>'); return;
    case "sample":
      if(rest.toLowerCase()==="clear"){ wipe(); return; }
      emit(raw,'<p class="prose">This is the sample family. <b>/sample clear</b> empties it and leaves you with your own readers.</p>');
      return;
    case "reset": wipe(); return;
    default:
      emit(raw,'<p class="prose"><b style="color:var(--mark-red)">No command called /'+esc(cmd)+'.</b> '+
        'Type <b>/help</b> for the list — or drop the slash and it will be read as a night of reading.</p>');
  }
}
function wipe(){
  var names=S.children.map(function(k){ return {name:k.name,year:k.year,grade:k.grade,target:k.target,free:k.free}; });
  S=blankState();
  S.sample=false;
  names.forEach(function(n){
    S.children.push({ id:"kid-"+uid(), name:n.name, initial:n.name[0].toLowerCase(), year:n.year,
                      grade:n.grade, gradeYear:schoolYear(today()), target:n.target, free:n.free });
  });
  active=(S.children[0]||{}).id||null;
  undoStack=[];
  save(); clearBack(); renderChrome();
  emit(null,'<h2 class="celltitle">Empty and yours</h2><p class="prose">The sample nights, books and checks are gone. '+
    (S.children.length? 'Your readers are still set up — '+esc(S.children.map(function(k){return k.name;}).join(", "))+'.'
                      : 'Add a reader with <b>/who add Ella y3</b>.')+
    ' Log tonight and the record starts from here.</p>'+
    '<div class="acts"><button class="act" data-do="help">Commands</button><button class="act hot" data-do="check">First fluency check</button></div>');
}

<script>
"use strict";
/* ============================================================================
   THE LIVE LINE — interpretation before commitment
   ========================================================================== */
var CMDS=["help","week","term","books","check","fluency","flags","crib","record","evening","who","target",
          "grade","level","nf","fic","free","schoolapp","sig","export","import","undo","clear","sample","reset"];
function chit(text,cls){ return '<span class="chit'+(cls?" "+cls:"")+'">'+text+'</span>'; }

function renderPreview(){
  var strip=el("parsestrip"), v=el("feed").value;
  if(!v.trim()){ strip.hidden=true; strip.innerHTML=""; el("blinkline").classList.remove("lit"); return; }
  strip.hidden=false;
  el("blinkline").classList.remove("lit");
  if(v.trim().charAt(0)==="/"){
    var w=v.trim().slice(1).split(/\s+/)[0].toLowerCase();
    var hits=CMDS.filter(function(c){ return c.indexOf(w)===0; });
    var h=chit("command","lead");
    if(!w){ h+='<span class="parsenote">'+CMDS.map(function(c){ return "/"+c; }).join("  ")+'</span>'; }
    else if(hits.length){
      hits.slice(0,8).forEach(function(c){ h+=chit("/"+esc(c),c===w?"":"dim"); });
      h+='<span class="parsenote">'+(hits[0]===w?"Enter to run.":"Tab completes.")+'</span>';
    } else {
      h+=chit("/"+esc(w),"bad")+'<span class="parsenote bad">No such command. /help lists them.</span>';
    }
    strip.innerHTML=h;
    return;
  }
  var p=parseLine(v);
  var kid=childById(p.childId);
  var h2="";
  if(S.children.length>1) h2+=chit(esc(kid?kid.name:"?"),"lead");
  if(p.dateOff!==0) h2+=chit(esc(fmtShort(p.date)),"");
  if(p.minutes!==null) h2+=chit("<b>"+p.minutes+"</b> min","");
  if(p.title) h2+=chit(esc(p.title)+(p.newBook?" &middot; NEW":""),p.newBook?"dim":"");
  if(p.from!==null&&p.to!==null) h2+=chit("pp.<b>"+p.from+"–"+p.to+"</b>"+(p.chained?" &middot; carried on":""),"");
  if(p.fin) h2+=chit("FINISHED","lead");
  if(p.level!=null) h2+=chit("level "+p.level,"dim");
  if(p.genre) h2+=chit(esc(p.genre),"dim");
  p.tags.forEach(function(t){ h2+=chit(esc(t),"dim"); });
  if(p.problems.length){
    p.problems.forEach(function(x){ h2+=chit(esc(x),"bad"); });
    h2+='<span class="parsenote bad">Not logged yet — fix the line, or press Enter to see why.</span>';
  } else {
    var ghost={ id:"ghost", childId:p.childId, bookId:p.bookId, date:p.date, from:p.from, to:p.to,
                minutes:p.minutes, tags:p.tags, note:p.note, fin:p.fin, title:p.title };
    var es=childEntries(p.childId);
    var sentence=makeComment(ghost,es.length,es.length?es[es.length-1]:null,es.length-1);
    var extra=p.notes.length? " &nbsp;·&nbsp; "+p.notes.map(esc).join(" ") : "";
    h2+='<span class="parsenote">&ldquo;'+esc(sentence)+'&rdquo;'+extra+'</span>';
  }
  strip.innerHTML=h2;
}

/* ============================================================================
   RUN A LINE
   ========================================================================== */
function runLine(){
  var feed=el("feed"), v=feed.value.trim();
  if(!v) return;
  lineHist.push(v); if(lineHist.length>200) lineHist.shift();
  histPos=-1;
  if(v.charAt(0)==="/"){
    feed.value=""; renderPreview();
    runCommand(v);
    return;
  }
  var p=parseLine(v);
  if(!p.ok){
    emit(v,'<p class="prose"><b style="color:var(--mark-red)">Not logged.</b> '+
      p.problems.map(esc).join(" ")+'</p>'+
      '<p class="prose" style="margin-top:5px">A whole night looks like <b>ella 20m charlottes web p45-60 fluent</b> — '+
      'name, minutes, title, pages, how it went, in any order. <b>/help</b> has the rest.</p>');
    el("blinkline").classList.add("lit");
    setTimeout(function(){ el("blinkline").classList.remove("lit"); },400);
    return;
  }
  var e=commitParse(p);
  feed.value=""; renderPreview();
  var kid=childById(e.childId);
  var extra=p.notes.length?'<p class="prose" style="margin-top:5px">'+p.notes.map(esc).join(" ")+'</p>':"";
  var bs=e.bookId?bookState(bookById(e.bookId)):null;
  if(e.fin&&bs){
    extra+='<p class="prose" style="margin-top:5px"><b>Closed.</b> '+esc(bookById(e.bookId).title)+' took <b>'+
      (bs.days==null?"—":bs.days)+' days</b>, <b>'+bs.nights+' nights</b>, <b>'+bs.pages+' pages</b> and <b>'+bs.minutes+' minutes</b>.</p>';
  }
  emit(v,(S.children.length>1?'<p class="prose" style="margin-bottom:4px">'+esc(kid?kid.name:"")+'</p>':'')+
        nightHTML(e)+extra+
        '<p class="prose" style="margin-top:6px;font-size:11.5px">Comment written for you — copy it straight into the booklet. '+
        '<span class="keycap">Ctrl</span>+<span class="keycap">Z</span> or <b>/undo</b> takes it back.</p>',{fresh:true});
  renderChrome();
}

/* ============================================================================
   KEYBOARD
   ========================================================================== */
function cycleChild(dir){
  if(S.children.length<2) return;
  var i=0;
  for(var j=0;j<S.children.length;j++) if(S.children[j].id===active) i=j;
  i=(i+(dir||1)+S.children.length)%S.children.length;
  active=S.children[i].id; save(); renderChrome(); renderPreview();
  toast("Logging for "+S.children[i].name);
}
function wireKeys(){
  var feed=el("feed");
  feed.addEventListener("input",renderPreview);
  feed.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){ ev.preventDefault(); runLine(); return; }
    if(ev.key==="ArrowUp"){
      if(!lineHist.length) return;
      ev.preventDefault();
      histPos = histPos<0 ? lineHist.length-1 : Math.max(0,histPos-1);
      feed.value=lineHist[histPos]; renderPreview();
      try{ feed.setSelectionRange(feed.value.length,feed.value.length); }catch(e){}
      return;
    }
    if(ev.key==="ArrowDown"){
      if(histPos<0) return;
      ev.preventDefault();
      histPos++;
      if(histPos>=lineHist.length){ histPos=-1; feed.value=""; }
      else feed.value=lineHist[histPos];
      renderPreview();
      return;
    }
    if(ev.key==="Escape"){ ev.preventDefault(); feed.value=""; histPos=-1; renderPreview(); return; }
    if(ev.key==="Tab" && feed.value.trim().charAt(0)==="/" && feed.value.indexOf(" ")<0){
      var w=feed.value.trim().slice(1).toLowerCase();
      var hits=CMDS.filter(function(c){ return c.indexOf(w)===0; });
      if(hits.length){ ev.preventDefault(); feed.value="/"+hits[0]+" "; renderPreview(); }
      return;
    }
    if((ev.ctrlKey||ev.metaKey)&&(ev.key==="z"||ev.key==="Z")&&!feed.value){ ev.preventDefault(); undoLast(); return; }
  });
  document.addEventListener("keydown",function(ev){
    var t=ev.target;
    var inField = t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable);
    if((ev.altKey)&&/^[1-9]$/.test(ev.key)){
      var n=intOr(ev.key,1);
      if(S.children[n-1]){ ev.preventDefault(); active=S.children[n-1].id; save(); renderChrome(); renderPreview(); toast("Logging for "+S.children[n-1].name); }
      return;
    }
    if((ev.ctrlKey||ev.metaKey)&&(ev.key==="z"||ev.key==="Z")&&!inField){ ev.preventDefault(); undoLast(); return; }
    if(inField||ev.ctrlKey||ev.metaKey||ev.altKey) return;
    if(ev.key==="Escape"){ feed.focus(); return; }
    if(ev.key.length===1){ feed.focus(); }
    else if(ev.key==="Backspace"){ ev.preventDefault(); feed.focus(); }
  });
  el("scrollback").addEventListener("click",function(ev){
    var b=ev.target.closest?ev.target.closest("[data-do]"):null;
    if(!b) return;
    var d=b.getAttribute("data-do");
    if(d==="crib"){ printCrib(); toast("Sent to print"); }
    else if(d==="record"){ var tr=termRange(); printRecord(tr.from,ymd(today())); toast("Sent to print"); }
    else if(d==="evening"){ printEvening(); toast("Sent to print"); }
    else if(d==="check") viewCheck("/check");
    else if(d==="fluency") viewFluency("/fluency");
    else if(d==="flags") viewFlags("/flags");
    else if(d==="term") viewTerm("/term");
    else if(d==="week") viewWeek("/week");
    else if(d==="books") viewBooks("/books");
    else if(d==="help") viewHelp("/help");
  });
  var wn=el("whoname");
  wn.addEventListener("click",function(){ cycleChild(1); });
  el("clearsample").addEventListener("click",function(){ wipe(); });
}

/* ============================================================================
   BOOT
   ========================================================================== */
function boot(quiet){
  var kid=activeChild();
  if(!kid){
    emit(null,'<h2 class="celltitle">Nobody set up yet</h2><p class="prose">Type <b>/who add Ella y3</b> and then log tonight.</p>');
    return;
  }
  var es=childEntries(kid.id).slice(-5);
  var open=lastTouched(kid.id);
  var flags=stallFlags(kid.id);
  var h='<h2 class="celltitle">The last five nights <span class="qual">'+esc(kid.name)+
        (S.sample?' · sample family, cleared in one click':'')+'</span></h2>';
  if(es.length){ es.forEach(function(e){ h+=nightHTML(e); }); }
  else h+='<p class="prose">Nothing logged yet for '+esc(kid.name)+'.</p>';
  h+='<p class="prose" style="margin-top:9px">Type one line for tonight — <b>name, minutes, title, pages, how it went</b>, in any order. '+
     (open? 'The pages carry on by themselves: '+esc(open.title)+' is at <b>p.'+bookState(open).last+'</b>, so '+
            '<b>'+esc(String(kid.initial||kid.name[0]).toLowerCase())+' 20m '+esc(open.title.toLowerCase())+' p'+(bookState(open).last+16)+'</b> is a whole night. '
          : '')+
     'You will see it parsed before you commit, and the diary sentence written for you.</p>';
  h+='<div class="acts">'+
     '<button class="act hot" data-do="flags">What to ask the teacher</button>'+
     '<button class="act" data-do="crib">This week&rsquo;s crib</button>'+
     '<button class="act" data-do="check">One-minute check</button>'+
     '<button class="act" data-do="term">Term view</button>'+
     '<button class="act" data-do="help">All commands</button>'+
     '</div>';
  h+=DISCLAIM;
  emit(null,h);
}

/* ---------- init ---------- */
(function init(){
  var loaded=load();
  if(loaded && loaded.children && loaded.children.length){ S=loaded; }
  else { buildSample(); save(); }
  active=(S.children[0]||{}).id||null;
  try{
    renderChrome();
    wireKeys();
    boot();
  }catch(err){
    S=blankState(); buildSample(); active=S.children[0].id;
    renderChrome(); wireKeys(); boot();
  }
  var f=el("feed");
  if(window.matchMedia && window.matchMedia("(min-width:700px)").matches){ try{ f.focus(); }catch(e){} }
  var rzT=null;
  window.addEventListener("resize",function(){ clearTimeout(rzT); rzT=setTimeout(renderRibbon,120); });
  window.addEventListener("beforeprint",function(){
    var out=el("sheetout");
    if(out.innerHTML.trim()) return;
    var kid=activeChild(); if(!kid) return;
    var tr=termRange(), es=cribRows(kid,tr.from,ymd(today()));
    out.innerHTML=docHead("Reading record — "+kid.name,
      (kid.year?esc(kid.year)+" &middot; ":"")+esc(fmtShort(tr.from))+" to "+esc(fmtShort(ymd(today()))))+
      bookletTable(kid,es,{presign:false})+PRINT_WARN;
  });
})();
</script>
