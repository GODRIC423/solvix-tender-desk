/* ============================================================================
   THE FIVE SECTORS
   ========================================================================== */
function pipRow(conf, n){
  var lit = conf==="measured" ? 4 : conf==="provisional" ? 3 : conf==="weak" ? 2 : conf==="onesided" ? 2 : 1;
  var word = {measured:"Measured", provisional:"Provisional", weak:"Weak agreement",
              onesided:"One-sided sample", thin:"Not enough sleeps yet"}[conf] || "Unknown";
  var s = '<div class="confbar">';
  for(var i=0;i<4;i++) s += '<span class="confpip'+(i<lit?" lit":"")+'"></span>';
  s += '<span class="confword">'+word+' · n='+n+'</span></div>';
  return s;
}

function viewDay(){
  var b = D.bed, w = D.nextWin, out = [];
  var k = D.kid;
  out.push('<div class="leaf"><p class="leafname">The answer <em>right now</em></p>');
  if(D.asleep){
    out.push('<p class="saidplain">'+esc(k.name)+' has been asleep since <b>'+min2hm(D.asleep.a0)+
      '</b>. On '+(D.asleep.kind==="night"?"the usual morning wake":"the recent median nap length of "+dur(D.napLen))+
      ', expect waking around <b>'+min2hm(D.projWake)+'</b>, and the next window to open '+durTight(D.wLo)+' after that.</p>');
  } else if(w){
    out.push('<p class="bignum">'+min2hm(w.open)+' <span>to '+min2hm(w.close)+'</span></p>');
    out.push('<p class="saidplain">Awake since <b>'+min2hm(w.base)+'</b>. Aim to start '+
      (w.forKind==="night"?"the bedtime routine":"the next sleep")+' at about <b>'+min2hm(w.ideal)+
      '</b> — that is '+durTight(D.tol)+' awake, '+
      (D.source==="measured" ? "your own measured figure" : "the "+esc(D.band.name)+" typical figure")+
      '. Past <b>'+min2hm(w.close)+'</b> overtiredness is the likely reason it goes wrong.</p>');
  } else {
    out.push('<p class="saidplain">Nothing logged yet today. Add the morning wake below and the wheel fills in.</p>');
  }
  out.push('</div>');

  out.push('<div class="leaf"><p class="leafname">Bedtime, worked backwards <em>from the morning you want</em></p>');
  out.push('<p class="saidplain">Wake goal <b>'+esc(k.wake)+'</b> minus a night need of <b>'+
    durTight(k.nightOverride ? Math.round(num(k.nightOverride,0)*60) : nightIdealMin(D.band))+
    '</b> puts bedtime at <b>'+min2hm(b.targetAbs)+'</b>. '+
    (b.readyAbs===null
      ? 'With no nap in the day there is nothing to move it.'
      : 'The last '+(D.naps>0?'nap':'stretch')+' ends at <b>'+min2hm(b.readyAbs - D.tol)+'</b>, so '+esc(k.name)+
        ' is ready at <b>'+min2hm(b.readyAbs)+'</b>.')+
    ' Tonight’s bedtime: <b>'+min2hm(b.bedAbs)+'</b>'+
    (Math.abs(b.shift)>=3 ? ' — the naps moved it '+dur(Math.abs(b.shift))+' '+(b.shift>0?'later':'earlier')+'.' : ' — bang on target.')+
    '</p>');
  out.push('<p class="notewee">Projected night sleep <strong>'+durTight(b.projNight)+'</strong> against a band of '+
    durTight(b.niLo)+'–'+durTight(b.niHi)+' — '+(b.ok?'in range':'outside the range')+
    '. Bedtime is allowed to float '+b.flex+' minutes either side of target; change that in Table.</p>');
  out.push('</div>');

  /* the day read down */
  out.push('<div class="leaf"><p class="leafname">Today <em>logged, then projected</em></p><ul class="timeline-list">');
  var items = [], i;
  for(i=0;i<D.events.length;i++){
    var e = D.events[i];
    var startsToday = e.a0 >= D.todayIdx*DAY && e.a0 < (D.todayIdx+1)*DAY;
    var endsToday = e.a1 !== null && e.a1 >= D.todayIdx*DAY && e.a1 < (D.todayIdx+1)*DAY;
    if(!startsToday && !endsToday) continue;
    if(e.isFeed){
      items.push({at:e.a0, pip:"var(--arc-feed)", txt:"<b>"+esc(e.ref.n||"Feed")+"</b>", flag:"feed", plan:false});
    } else if(e.kind==="night" && endsToday && !startsToday){
      items.push({at:e.a1, pip:"var(--arc-night)", txt:"<b>Woke</b> after "+dur(e.len)+" of night sleep", flag:"logged", plan:false});
    } else if(e.refused){
      items.push({at:e.a0, pip:"var(--arc-late)", txt:"<b>Nap refused</b>", flag:"logged", plan:false});
    } else {
      var lbl = e.kind==="night" ? "Night sleep" : (e.kind==="quiet" ? "Quiet time" : "Nap");
      items.push({at:e.a0, pip:e.kind==="night"?"var(--arc-night)":(e.kind==="quiet"?"var(--arc-quiet)":"var(--arc-nap)"),
        txt:"<b>"+lbl+"</b> "+(e.a1===null ? "— still going" : "to "+min2hm(e.a1)+", "+dur(e.len)), flag:"logged", plan:false});
    }
  }
  if(w) items.push({at:w.open, pip:"var(--arc-window)", txt:"<b>Window opens</b> · ideal "+min2hm(w.ideal)+" · closes "+min2hm(w.close), flag:"projected", plan:true});
  for(i=0;i<D.plan.length;i++){
    var p = D.plan[i];
    if(w && i===0) continue;
    items.push({at:p.open, pip:"var(--arc-window)", txt:"<b>Window opens</b> · ideal "+min2hm(p.ideal)+" · closes "+min2hm(p.close), flag:"projected", plan:true});
  }
  for(i=0;i<D.plan.length;i++) items.push({at:D.plan[i].a0, pip:"var(--arc-nap)", txt:"<b>Nap</b> to "+min2hm(D.plan[i].a1)+", "+dur(D.napLen), flag:"projected", plan:true});
  var qLogged = false;
  for(i=0;i<D.sleeps.length;i++){ if(D.sleeps[i].kind==="quiet" && D.sleeps[i].ref.d===TODAY) qLogged = true; }
  if(D.kid.quiet && D.kid.quiet.on && D.naps===0 && !qLogged){
    var qs = D.todayIdx*DAY + (hm2min(D.kid.quiet.s)||780);
    items.push({at:qs, pip:"var(--arc-quiet)", txt:"<b>Quiet time</b> "+intOr(D.kid.quiet.len,45)+" min, not sleep", flag:"routine", plan:true});
  }
  items.push({at:b.bedAbs - Math.max(0,intOr(k.routine,20)), pip:"var(--arc-night)", txt:"<b>Start the bedtime routine</b> ("+Math.max(0,intOr(k.routine,20))+" min)", flag:"projected", plan:true});
  items.push({at:b.bedAbs, pip:"var(--arc-night)", txt:"<b>Lights out</b> · "+durTight(b.projNight)+" to a "+esc(k.wake)+" wake", flag:"projected", plan:true});
  items.sort(function(x,y){ return x.at - y.at; });
  for(i=0;i<items.length;i++){
    var it = items[i];
    out.push('<li class="'+(it.plan?"is-plan":"")+'"><span class="tstamp">'+min2hm(it.at)+'</span>'+
      '<span class="tpip" style="background:'+it.pip+'"></span><span class="tsay">'+it.txt+'</span>'+
      '<span class="tflag">'+it.flag+'</span></li>');
  }
  out.push('</ul></div>');

  /* today's entries, editable */
  out.push('<div class="leaf"><p class="leafname">Log <em>today’s entries</em></p>');
  var todays = k.logs.filter(function(L){ return L.d === TODAY; })
                     .sort(function(a,b2){ return (hm2min(a.s)||0) - (hm2min(b2.s)||0); });
  if(!todays.length) out.push('<p class="notewee">Nothing logged today yet.</p>');
  for(i=0;i<todays.length;i++){
    var L = todays[i];
    out.push('<div class="entryline">'+
      '<div><label class="slotname" for="k_'+L.i+'">What</label><select id="k_'+L.i+'" data-log="'+L.i+'" data-fld="k">'+
        opt("night","Night sleep",L.k)+opt("nap","Nap",L.k)+opt("quiet","Quiet time",L.k)+opt("feed","Feed",L.k)+'</select></div>'+
      '<div><label class="slotname" for="s_'+L.i+'">Start</label><input id="s_'+L.i+'" type="time" value="'+esc(L.s)+'" data-log="'+L.i+'" data-fld="s"></div>'+
      (L.t==="f" ? '<div><label class="slotname" for="n_'+L.i+'">Note</label><input id="n_'+L.i+'" type="text" value="'+esc(L.n||"")+'" data-log="'+L.i+'" data-fld="n"></div>'
                 : '<div><label class="slotname" for="e_'+L.i+'">End</label><input id="e_'+L.i+'" type="time" value="'+esc(L.e||"")+'" data-log="'+L.i+'" data-fld="e"></div>'+
                   '<div><label class="slotname" for="st_'+L.i+'">Settle min</label><input id="st_'+L.i+'" type="number" min="0" max="120" value="'+intOr(L.st,0)+'" data-log="'+L.i+'" data-fld="st"></div>')+
      '<button class="xout" data-del="'+L.i+'" aria-label="Delete the '+esc(L.k)+' entry at '+esc(L.s)+'">×</button></div>');
  }
  out.push('<div class="studrow">'+
    '<button class="stud prime" data-add="nap">+ Nap</button>'+
    '<button class="stud" data-add="night">+ Night sleep</button>'+
    '<button class="stud" data-add="feed">+ Feed</button>'+
    '<button class="stud" data-add="wakenow">Woke just now</button>'+
    '</div></div>');
  return out.join("");
}
function opt(v,label,cur){ return '<option value="'+v+'"'+(cur===v?" selected":"")+'>'+esc(label)+'</option>'; }

function scaleRule(per, band){
  if(!per.n) return '<p class="notewee">No sleeps with a measurable preceding awake stretch yet.</p>';
  var xs = per.rows.map(function(r){ return r.awake; });
  var lo = Math.min.apply(null, xs.concat([num(band.wLo,0)])) - 15;
  var hi = Math.max.apply(null, xs.concat([num(band.wHi,0)])) + 15;
  var span = hi - lo; if(!(span > 0)) span = 60;
  var X = function(v){ return 52 + ((v - lo)/span)*532; };
  var AX = 82, WELL = 50, BAD = 116, g = [], i;
  var bLo = X(num(band.wLo,0)), bHi = X(num(band.wHi,0)), bi = bandIdeal(band);
  g.push('<rect x="'+bLo.toFixed(1)+'" y="'+(WELL-16)+'" width="'+Math.max(1,bHi-bLo).toFixed(1)+'" height="'+(BAD+16-(WELL-16))+
    '" fill="var(--arc-window)" fill-opacity=".08"/>');
  g.push('<line x1="'+bLo.toFixed(1)+'" y1="'+(WELL-16)+'" x2="'+bLo.toFixed(1)+'" y2="'+(BAD+16)+'" stroke="var(--arc-window)" stroke-opacity=".45"/>');
  g.push('<line x1="'+bHi.toFixed(1)+'" y1="'+(WELL-16)+'" x2="'+bHi.toFixed(1)+'" y2="'+(BAD+16)+'" stroke="var(--arc-window)" stroke-opacity=".45"/>');
  g.push('<line x1="'+X(bi).toFixed(1)+'" y1="'+(WELL-16)+'" x2="'+X(bi).toFixed(1)+'" y2="'+(BAD+16)+'" stroke="var(--arc-window)" stroke-width="1.5" stroke-dasharray="4 4"/>');
  g.push('<text x="'+X(bi).toFixed(1)+'" y="18" text-anchor="middle" font-size="11" fill="var(--arc-window)" font-family="Cabin Condensed" letter-spacing="1.4">BAND SAYS '+durTight(bi)+'</text>');
  g.push('<line x1="52" y1="'+AX+'" x2="584" y2="'+AX+'" stroke="var(--tick-rule)" stroke-width="1"/>');
  /* deterministic stacking so coincident sleeps stay countable */
  var seen = {};
  for(i=0;i<per.rows.length;i++){
    var r = per.rows[i], x = X(r.awake);
    var key = (r.bad?"b":"w") + Math.round(x/7);
    var lvl = seen[key] || 0; seen[key] = lvl + 1;
    var y = r.bad ? (BAD + (lvl%3)*8) : (WELL - (lvl%3)*8);
    g.push('<circle cx="'+x.toFixed(1)+'" cy="'+y+'" r="3.6" fill="'+(r.bad?"var(--arc-late)":"var(--arc-feed)")+
      '" fill-opacity=".85"><title>'+esc(r.date+" "+r.at+" · awake "+durTight(r.awake)+" · "+(r.bad?"went badly":"went well"))+'</title></circle>');
  }
  if(per.tol !== null){
    g.push('<line x1="'+X(per.tol).toFixed(1)+'" y1="26" x2="'+X(per.tol).toFixed(1)+'" y2="136" stroke="var(--hub-glow)" stroke-width="2"/>');
    g.push('<text x="'+X(per.tol).toFixed(1)+'" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="var(--hub-glow)" font-family="Cabin Condensed" letter-spacing="1.6">YOURS '+durTight(per.tol)+'</text>');
  }
  g.push('<text x="44" y="'+(WELL+4)+'" text-anchor="end" font-size="10" fill="var(--arc-feed)" font-family="Cabin Condensed" letter-spacing="1">WELL</text>');
  g.push('<text x="44" y="'+(BAD+4)+'" text-anchor="end" font-size="10" fill="var(--arc-late)" font-family="Cabin Condensed" letter-spacing="1">BADLY</text>');
  for(i=0;i<=4;i++){
    var v = lo + span*i/4, xx = X(v);
    g.push('<line x1="'+xx.toFixed(1)+'" y1="'+AX+'" x2="'+xx.toFixed(1)+'" y2="'+(AX+5)+'" stroke="var(--tick-rule)"/>');
    g.push('<text x="'+xx.toFixed(1)+'" y="'+(AX+16)+'" text-anchor="middle" font-size="10" fill="var(--script-dim)" font-family="Cabin Condensed">'+durTight(v)+'</text>');
  }
  return '<div class="scalerule"><svg viewBox="0 0 600 154" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Each dot is one sleep: how long your child had been awake beforehand, and whether that sleep went well or badly. The vertical line is the awake time above which it starts going wrong.">'+g.join("")+'</svg></div>';
}

function viewMeasure(){
  var k = D.kid, band = D.band, out = [];
  var mode = (S.measMode && S.measMode !== "auto") ? S.measMode : D.mode;
  var per = (mode === D.mode) ? D.per : measureTolerance(k, mode);
  var bi = bandIdeal(band);
  var noun = mode === "nap" ? "nap" : "night";

  out.push('<div class="leaf"><p class="leafname">The measurement <em>this is the part an average cannot do</em></p>');
  if(per.conf === "measured" || per.conf === "provisional"){
    var delta = per.tol - bi;
    out.push('<p class="bignum">'+durTight(per.tol)+' <span>your child · band says '+durTight(bi)+'</span></p>');
    out.push('<p class="saidplain">Across <b>'+per.n+'</b> '+noun+'s with a measurable awake stretch beforehand, '+esc(k.name)+
      '&rsquo;s own logs put the edge at <b>'+durTight(per.tol)+'</b> awake. The '+esc(band.name)+
      ' band puts it at '+durTight(bi)+' — a difference of <b>'+(delta>=0?"+":"−")+dur(Math.abs(delta))+'</b>. '+
      per.ok+' of these '+noun+'s went well below that line and '+per.bad+' went badly above it; the line disagrees with '+
      per.errors+' of them, so it agrees with <b>'+pct(per.n-per.errors, per.n)+'</b>.</p>');
  } else if(per.conf === "onesided"){
    out.push('<p class="bignum">Not found yet <span>nothing has gone wrong</span></p>');
    out.push('<p class="saidplain">'+per.n+' '+noun+'s logged, but only '+per.bad+' went badly. There is no upper edge to find until things start going wrong — '+
      'the longest awake stretch so far is <b>'+durTight(per.ceiling)+'</b> and it was fine. Keep using the '+esc(band.name)+' band figure of '+durTight(bi)+'.</p>');
  } else {
    out.push('<p class="bignum">'+per.n+' <span>of the 8 '+noun+'s needed</span></p>');
    out.push('<p class="saidplain">Roughly three weeks of logs is what it takes before your own child&rsquo;s number beats the published average. '+
      'Until then the wheel uses the '+esc(band.name)+' band figure of <b>'+durTight(bi)+'</b>.</p>');
  }
  out.push(pipRow(per.conf, per.n));
  out.push('<p class="notewee">A '+noun+' counts as having gone badly when '+
    (mode==="nap"
      ? "it was refused, it ran shorter than "+dur(per.shortCut)+" (70% of the recent median), or settling took more than "+dur(per.settleCut)+"."
      : "settling took more than "+dur(per.settleCut)+", there were two or more night wakings, or the morning came more than 25 minutes early.")+
    ' The line is the single awake time that separates the two groups with the fewest mistakes. It is a decision threshold on your own data, not a diagnosis.</p>');
  out.push(scaleRule(per, band));
  out.push('<div class="slotset"><div><label class="slotname" for="mmode">Measure on</label>'+
    '<select id="mmode">'+opt("auto","Automatic ("+D.mode+"s)",S.measMode||"auto")+opt("nap","Naps",S.measMode)+opt("night","Nights",S.measMode)+'</select></div>'+
    '<div><label class="slotname" for="useper">Wheel uses</label><select id="useper">'+
      opt("1","Your measured figure when confident",S.usePersonal?"1":"0")+opt("0","The published band always",S.usePersonal?"1":"0")+
    '</select></div></div>');
  out.push('</div>');

  if(per.drift){
    var d = per.drift;
    out.push('<div class="leaf"><p class="leafname">Drift <em>the same test on the older half and the newer half</em></p>');
    out.push('<p class="saidplain">First '+d.early.n+' ('+esc(d.early.from)+' to '+esc(d.early.to)+'): <b>'+durTight(d.early.t)+
      '</b>. Latest '+d.late.n+' ('+esc(d.late.from)+' to '+esc(d.late.to)+'): <b>'+durTight(d.late.t)+'</b>. '+
      (Math.abs(d.delta) < 5 ? 'Holding steady.' : (d.delta>0
        ? 'Lengthening by '+dur(d.delta)+' — the wake windows are stretching, as they should with age.'
        : 'Shortening by '+dur(Math.abs(d.delta))+' — worth a look; illness, teeth and a growth spurt all do this.'))+'</p></div>');
  }

  /* the sleeps that say so */
  out.push('<div class="leaf"><p class="leafname">The '+noun+'s that say so <em>most recent first</em></p><div class="tablescroll">');
  out.push('<table class="gridtable"><caption>Awake beforehand, what happened, and which side of the line it fell. Shaded rows sat above your measured line.</caption><thead><tr>'+
    '<th>Date</th><th>Start</th><th>Awake</th><th>'+(mode==="nap"?"Length":"Settle")+'</th><th>'+(mode==="nap"?"Settle":"Wakings")+'</th><th>Verdict</th></tr></thead><tbody>');
  var rows = per.rows.slice().reverse().slice(0, 14);
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    out.push('<tr'+(per.tol!==null && r.awake > per.tol ? ' class="now"' : '')+'><td>'+esc(r.date)+'</td><td>'+esc(r.at)+'</td>'+
      '<td>'+durTight(r.awake)+'</td><td>'+(mode==="nap"?(r.refused?"refused":dur(r.len)):r.settle+"m")+'</td>'+
      '<td>'+(mode==="nap"?r.settle+"m":r.wakes)+'</td>'+
      '<td style="color:'+(r.bad?"var(--arc-late)":"var(--arc-feed)")+'">'+(r.bad?"badly":"well")+'</td></tr>');
  }
  if(!rows.length) out.push('<tr><td colspan="6">—</td></tr>');
  out.push('</tbody></table></div></div>');

  /* totals */
  var t0 = totalsFor(k, TODAY), roll = rollingSeven(k, TODAY);
  var tot = Math.round((num(band.dayLo,0)+num(band.niLo,0))*60), totHi = Math.round((num(band.dayHi,0)+num(band.niHi,0))*60);
  out.push('<div class="leaf"><p class="leafname">Sleep total <em>the split is what needs correcting, not the total</em></p>');
  out.push('<p class="saidplain">Last night <b>'+durTight(t0.night)+'</b> plus today&rsquo;s naps so far <b>'+durTight(t0.day)+
    '</b> makes <b>'+durTight(t0.total)+'</b>, against an age range of '+durTight(tot)+'–'+durTight(totHi)+'.</p>');
  out.push('<div class="tablescroll"><table class="gridtable"><caption>Seven complete days before today</caption><thead><tr>'+
    '<th>Date</th><th>Night</th><th>Naps</th><th>Total</th><th>Hours</th></tr></thead><tbody>');
  for(i=0;i<roll.rows.length;i++){
    var rr = roll.rows[i];
    out.push('<tr><td>'+esc(rr.date)+'</td><td>'+(rr.hasNight?durTight(rr.night):"—")+'</td><td>'+(rr.day>0?durTight(rr.day):"—")+
      '</td><td>'+(rr.has?durTight(rr.total):"—")+'</td><td>'+(rr.has?hrs2(rr.total):"—")+'</td></tr>');
  }
  out.push('<tr class="now"><td>7-day average</td><td>'+(roll.avgNight===null?"—":durTight(roll.avgNight))+'</td><td>'+
    (roll.avgDay===null?"—":durTight(roll.avgDay))+'</td><td>'+(roll.avgTotal===null?"—":durTight(roll.avgTotal))+'</td><td>'+
    (roll.avgTotal===null?"—":hrs2(roll.avgTotal))+'</td></tr>');
  out.push('</tbody></table></div>');
  if(roll.avgTotal !== null){
    var an = roll.avgNight/60, ad = roll.avgDay/60;
    var vn = an < num(band.niLo,0) ? "short" : (an > num(band.niHi,0) ? "long" : "in range");
    var vd = ad < num(band.dayLo,0) ? "short" : (ad > num(band.dayHi,0) ? "long" : "in range");
    out.push('<p class="notewee">Night averages '+durTight(roll.avgNight)+' ('+hrs2(roll.avgNight)+' h) against the '+esc(band.name)+' range '+durTight(num(band.niLo,0)*60)+'–'+durTight(num(band.niHi,0)*60)+
      ' — '+vn+'. Day averages '+durTight(roll.avgDay)+' ('+hrs2(roll.avgDay)+' h) against '+durTight(num(band.dayLo,0)*60)+'–'+durTight(num(band.dayHi,0)*60)+' — '+vd+
      '. Averaged over '+roll.n+' day'+(roll.n===1?"":"s")+' with a logged night.</p>');
  } else {
    out.push('<p class="notewee">No complete days yet, so there is no average to show.</p>');
  }
  out.push('</div>');

  /* transitions */
  var tr = transition(S, D);
  out.push('<div class="leaf"><p class="leafname">Nap transition <em>and the shape of the day after it</em></p>');
  out.push('<div class="verdict '+(tr.ready?"hot":"calm")+'"><h3>'+(tr.ready?"A transition is indicated":"No transition indicated")+'</h3>'+
    '<p style="margin:0">'+esc(tr.why.join(" "))+'</p></div>');
  if(tr.next && tr.next.ok){
    var nx = tr.next;
    out.push('<p class="saidplain">On <b>'+nx.naps+' nap'+(nx.naps===1?"":"s")+'</b>, with '+dur(nx.napLen)+' of day sleep and the same '+
      esc(k.wake)+' wake, the day spreads to a wake window of <b>'+durTight(nx.window)+'</b>:</p><ul class="timeline-list">');
    out.push('<li><span class="tstamp">'+min2hm(nx.wake)+'</span><span class="tpip" style="background:var(--arc-night)"></span><span class="tsay"><b>Wake</b></span><span class="tflag">would be</span></li>');
    for(i=0;i<nx.blocks.length;i++){
      out.push('<li><span class="tstamp">'+min2hm(nx.blocks[i].s)+'</span><span class="tpip" style="background:var(--arc-nap)"></span>'+
        '<span class="tsay"><b>Nap</b> to '+min2hm(nx.blocks[i].e)+'</span><span class="tflag">would be</span></li>');
    }
    if(nx.naps === 0 && k.quiet)
      out.push('<li><span class="tstamp">'+esc(k.quiet.s)+'</span><span class="tpip" style="background:var(--arc-quiet)"></span>'+
        '<span class="tsay"><b>Quiet time</b> '+intOr(k.quiet.len,45)+' min in the cot or on the bed, not sleep</span><span class="tflag">replaces the nap</span></li>');
    out.push('<li><span class="tstamp">'+min2hm(nx.bed)+'</span><span class="tpip" style="background:var(--arc-night)"></span><span class="tsay"><b>Bedtime</b></span><span class="tflag">would be</span></li></ul>');
    out.push('<p class="notewee">Transitions take two to six weeks. An earlier bedtime carries the gap while the new window settles.</p>');
  }
  out.push('</div>');
  return out.join("");
}

/* ============================================================================
   THE DAY CARD — the thing that goes on the fridge and to the nursery
   ========================================================================== */
var INK = {night:"#3f5f78", nap:"#a8891f", quiet:"#6d5ca0", feed:"#2f7264",
           win:"#b45f16", rule:"#b8b4a0", face:"#ffffff", ink:"#262b1a"};
function miniDial(Dx){
  var g = [], i, ts = Dx.todayIdx*DAY;
  var RS = 150, WS = 26, RF = 112, RH = 96;
  g.push('<circle cx="200" cy="200" r="176" fill="none" stroke="'+INK.rule+'" stroke-width="1"/>');
  for(i=0;i<24;i++){
    var a = polar(i%3===0?176:172, i*60), b = polar(166, i*60);
    g.push('<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+
      '" stroke="'+INK.rule+'" stroke-width="'+(i%3===0?2:1)+'"/>');
    if(i%6===0){
      var p = polar(190, i*60);
      g.push('<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+6).toFixed(1)+'" text-anchor="middle" font-size="17" fill="'+INK.ink+'" font-family="Cabin Condensed">'+pad2(i)+'</text>');
    }
  }
  function band(m0,m1,col,op,dash){
    var c = clipDay(m0-ts, m1-ts); if(!c) return;
    g.push('<path d="'+arcD(RS, c[0], c[1])+'" fill="none" stroke="'+col+'" stroke-width="'+WS+'" stroke-opacity="'+op+'"'+
      (dash?' stroke-dasharray="6 5"':'')+'/>');
  }
  for(i=0;i<Dx.sleeps.length;i++){
    var e = Dx.sleeps[i]; if(e.refused) continue;
    band(e.a0, e.a1===null?Dx.nowAbs:e.a1, e.kind==="night"?INK.night:(e.kind==="quiet"?INK.quiet:INK.nap), ".85", false);
  }
  for(i=0;i<Dx.plan.length;i++) band(Dx.plan[i].a0, Dx.plan[i].a1, INK.nap, ".38", true);
  band(Dx.bed.bedAbs, ts+DAY, INK.night, ".38", true);
  if(Dx.nextWin) band(Dx.nextWin.open, Dx.nextWin.close, INK.win, ".22", false);
  for(i=0;i<Dx.plan.length;i++){
    var c2 = clipDay(Dx.plan[i].open-ts, Dx.plan[i].close-ts);
    if(c2) g.push('<path d="'+arcD(RF, c2[0], c2[1])+'" fill="none" stroke="'+INK.win+'" stroke-width="9" stroke-opacity=".3"/>');
  }
  for(i=0;i<Dx.feedsToday.length;i++){
    var fm = Dx.feedsToday[i].a0 - ts; if(fm<0||fm>DAY) continue;
    var fp = polar(RH+8, fm);
    g.push('<circle cx="'+fp[0].toFixed(1)+'" cy="'+fp[1].toFixed(1)+'" r="5" fill="'+INK.feed+'"/>');
  }
  var bm = Dx.bed.bedAbs - ts;
  if(bm>=0 && bm<=DAY){
    var b1 = polar(RS-WS/2-4, bm), b2 = polar(RS+WS/2+4, bm);
    g.push('<line x1="'+b1[0].toFixed(1)+'" y1="'+b1[1].toFixed(1)+'" x2="'+b2[0].toFixed(1)+'" y2="'+b2[1].toFixed(1)+'" stroke="'+INK.ink+'" stroke-width="3"/>');
  }
  g.push('<circle cx="200" cy="200" r="'+(RH-6)+'" fill="'+INK.face+'" stroke="'+INK.rule+'"/>');
  g.push('<text x="200" y="188" text-anchor="middle" font-size="20" fill="'+INK.ink+'" font-family="Cabin Condensed" letter-spacing="2">BEDTIME</text>');
  g.push('<text x="200" y="228" text-anchor="middle" font-size="46" font-weight="700" fill="'+INK.ink+'" font-family="Nunito">'+min2hm(Dx.bed.bedAbs)+'</text>');
  return '<svg viewBox="0 0 400 400" role="img" aria-label="Twenty-four hour wheel for '+esc(Dx.kid.name)+
    ', midnight at the top. Sleep arcs solid where logged and dashed where expected.">'+g.join("")+'</svg>';
}

function dayCard(Dx){
  var k = Dx.kid, b = Dx.bed, out = [], i;
  var items = [];
  if(Dx.morningWakeAbs !== null) items.push({at:Dx.morningWakeAbs, t:min2hm(Dx.morningWakeAbs), s:"Woke", e:"logged"});
  for(i=0;i<Dx.sleeps.length;i++){
    var e = Dx.sleeps[i];
    if(e.ref.d !== Dx.todayISO || e.kind === "night") continue;
    if(e.refused){ items.push({at:e.a0, t:min2hm(e.a0), s:"Nap refused", e:"logged"}); continue; }
    items.push({at:e.a0, t:min2hm(e.a0)+"–"+(e.a1===null?"…":min2hm(e.a1)),
      s:(e.kind==="quiet"?"Quiet time":"Nap")+(e.a1===null?" — asleep now":""), e:e.a1===null?"in progress":"logged, "+dur(e.len)});
  }
  for(i=0;i<Dx.plan.length;i++){
    var p = Dx.plan[i];
    items.push({at:p.open, t:min2hm(p.open)+"–"+min2hm(p.close), s:"Nap window "+(i+1)+" — settle at "+min2hm(p.ideal),
      e:"expected; do not push past "+min2hm(p.close)});
    items.push({at:p.a0, t:min2hm(p.a0)+"–"+min2hm(p.a1), s:"Nap "+(i+1), e:"expected "+dur(Dx.napLen)});
  }
  if(Dx.nextWin && !Dx.plan.length && Dx.nextWin.forKind === "night")
    items.push({at:Dx.nextWin.open, t:min2hm(Dx.nextWin.open)+"–"+min2hm(Dx.nextWin.close), s:"Bedtime window — settle at "+min2hm(Dx.nextWin.ideal), e:"expected"});
  var quietLogged = false;
  for(i=0;i<Dx.sleeps.length;i++){ if(Dx.sleeps[i].kind==="quiet" && Dx.sleeps[i].ref.d===Dx.todayISO) quietLogged = true; }
  if(k.quiet && k.quiet.on && Dx.naps === 0 && !quietLogged){
    var qs = Dx.todayIdx*DAY + (hm2min(k.quiet.s)||780);
    items.push({at:qs, t:min2hm(qs)+"–"+min2hm(qs+intOr(k.quiet.len,45)), s:"Quiet time — not sleep", e:"books or dim room, in bed"});
  }
  items.push({at:b.bedAbs - Math.max(0,intOr(k.routine,20)), t:min2hm(b.bedAbs - Math.max(0,intOr(k.routine,20))), s:"Start the bedtime routine", e:Math.max(0,intOr(k.routine,20))+" minutes"});
  items.push({at:b.bedAbs, t:min2hm(b.bedAbs), s:"Lights out", e:durTight(b.projNight)+" to a "+esc(k.wake)+" wake"});
  items.sort(function(x,y){ return x.at - y.at; });

  out.push('<article class="cardsheet">');
  out.push('<div class="cardhead"><div><b>Day card · Wake Windows</b><h3>'+esc(k.name)+'</h3></div>'+
    '<p>'+esc(Dx.todayISO)+'<br>'+esc(ageWords(k.dob, Dx.todayISO))+' · '+esc(Dx.band.name)+'<br>Awake tolerance '+durTight(Dx.tol)+
    ' ('+(Dx.source==="measured"?"measured from "+Dx.per.n+" sleeps":"typical for this age")+')</p></div>');
  out.push('<div class="cardbody"><div class="carddial">'+miniDial(Dx)+
    '<p style="font-size:.66rem;color:#5d5f47;margin:.4rem 0 0;text-align:center">Midnight at the top. Solid = logged, dashed = expected.</p></div>');
  out.push('<div><span class="stampline">The day</span><ul class="cardplan">');
  for(i=0;i<items.length;i++)
    out.push('<li><span class="clockcol">'+items[i].t+'</span><span>'+esc(items[i].s)+'<br><em>'+esc(items[i].e)+'</em></span></li>');
  out.push('</ul></div></div>');

  out.push('<div class="cardgrid2"><div><span class="stampline">Feeds &amp; meals</span><ul class="cardplan">');
  if(Dx.feedsToday.length){
    for(i=0;i<Dx.feedsToday.length;i++)
      out.push('<li><span class="clockcol">'+min2hm(Dx.feedsToday[i].a0)+'</span><span>'+esc(Dx.feedsToday[i].ref.n||"Feed")+'</span></li>');
  } else out.push('<li><span class="clockcol">—</span><span>None logged for today</span></li>');
  out.push('</ul></div><div><span class="stampline">The routine</span><p style="font-size:.82rem;margin:0">'+esc(k.ritual||"—")+'</p>'+
    '<p style="font-size:.78rem;margin:.5rem 0 0;color:#5d5f47">If a nap is missed, bring lights out forward by about half the missed sleep — never later.</p></div></div>');

  out.push('<div class="cardnote"><span class="stampline">What actually happened — hand this back</span>');
  for(i=0;i<5;i++) out.push('<div class="ruled"></div>');
  out.push('</div>');
  out.push('<div class="cardwarn"><b>Not medical advice.</b> Typical ranges from published sleep guidance; every baby differs. '+
    'Follow your health visitor or paediatrician.</div>');
  out.push('</article>');
  return out.join("");
}

function viewCard(){
  var out = [];
  out.push('<div class="leaf"><p class="leafname">The printed page <em>this is the deliverable</em></p>');
  out.push('<p class="saidplain">One page per child: when the windows open, when to settle, when they close, tonight&rsquo;s bedtime, '+
    'the feeds and the routine, with ruled lines for whoever has them to write back on. Hand it over at drop-off.</p>');

    '<button class="stud" id="doprintall">Print every child</button></div></div>');

}

      hrs2(nightIdealMin(D.band))+'" value="'+esc(k.nightOverride||"")+'" data-kid="nightOverride"></div>'+

  return out.join("");
}

function viewHouse(){

    '<button class="stud wary" id="clearall">'+(S.sample?"Clear the sample and start fresh":"Delete everything")+'</button>'+
    (S.sample?"":'<button class="stud" id="restore">Load the sample family</button>')+
    '</div><input type="file" id="impfile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0">'+
    '<p class="notewee" id="iomsg">CSV carries a byte-order mark and RFC 4180 quoting, so it opens straight into a spreadsheet. '+
    'JSON round-trips the whole file — children, logs, your edited table and settings.</p></div>');
  return out.join("");
}

/* ============================================================================
   RENDER
   ========================================================================== */
var bezelRot = 0;
function render(){
  NOW = nowAbs();
  DAYS_MODEL = [];
  for(var i=0;i<S.kids.length;i++) DAYS_MODEL.push(buildDay(S, S.kids[i], TODAY, NOW));
  D = null;
  for(i=0;i<DAYS_MODEL.length;i++){ if(DAYS_MODEL[i].kid.id === S.active) D = DAYS_MODEL[i]; }
  if(!D){ D = DAYS_MODEL[0]; S.active = D.kid.id; }

  if(!document.getElementById("dial-static").childNodes.length) drawStatic();
  bezelRot = -S.view * (360/SECTORS.length);
  drawBezel(bezelRot);
  drawArcs();
  drawHub();
  drawLegend();

  var sec = SECTORS[S.view];
  var head = '<h2 class="sectorname">'+esc(sec.head)+'</h2><p class="sectorsub">'+esc(sec.sub)+'</p>';
  var tabs = '<div class="folkstrip" role="group" aria-label="Choose a child">';
  for(i=0;i<S.kids.length;i++){
    var kk = S.kids[i];
    tabs += '<button class="folktab" data-kid-pick="'+esc(kk.id)+'" aria-pressed="'+(kk.id===S.active)+'">'+
      '<b>'+esc(kk.name)+'</b><span>'+esc(ageWords(kk.dob,TODAY))+'</span></button>';
  }
  tabs += '</div>';
  var body = S.view===0 ? viewDay() : S.view===1 ? viewMeasure() : S.view===2 ? viewTable() : S.view===3 ? viewCard() : viewHouse();
  document.getElementById("sheaf").innerHTML = tabs + head + body;

  var book = [];
  for(i=0;i<DAYS_MODEL.length;i++) book.push(dayCard(DAYS_MODEL[i]));
  document.getElementById("printbook").innerHTML = book.join("");

  if(focusWant){
    var n = document.querySelector('[data-id="'+focusWant+'"]');
    if(n && n.focus) n.focus();
    focusWant = null;
  }
}
function commit(){ saveState(); render(); }

/* ============================================================================
   THE SIGNATURE INTERACTION — drag arcs and rotate the wheel
   ========================================================================== */
var dragging = null;
function findLog(id){
  for(var i=0;i<S.kids.length;i++)
    for(var j=0;j<S.kids[i].logs.length;j++)
      if(S.kids[i].logs[j].i === id) return S.kids[i].logs[j];
  return null;
}
function snap5(m){ return Math.round(m/5)*5; }
function shiftEntry(L, deltaMin){
  var s = hm2min(L.s); if(s===null) return;
  L.s = min2hm(s + deltaMin);
  if(L.e !== null && L.e !== undefined && L.e !== "" ){
    var e = hm2min(L.e);
    if(e !== null) L.e = min2hm(e + deltaMin);
  }
}
function resizeEntry(L, edge, deltaMin){
  var s = hm2min(L.s), e = hm2min(L.e);
  if(s===null || e===null) return;
  var span = ((e - s) + DAY) % DAY;
  if(edge === "s"){
    var ns = span - deltaMin;
    if(ns < 5 || ns > 900) return;
    L.s = min2hm(s + deltaMin);
  } else {
    var ne = span + deltaMin;
    if(ne < 5 || ne > 900) return;
    L.e = min2hm(e + deltaMin);
  }
}
(function wireDial(){
  var svg = document.getElementById("dial");
  svg.addEventListener("pointerdown", function(ev){
    var t = ev.target;
    var arc = t.closest ? t.closest("[data-drag]") : null;
    var sect = t.closest ? t.closest("[data-sector]") : null;
    if(arc){
      var L = findLog(arc.getAttribute("data-id"));
      if(!L) return;
      dragging = {mode:arc.getAttribute("data-drag"), id:L.i, edge:arc.getAttribute("data-edge"),
                  ang:angleOfPointer(ev, svg), acc:0};
      try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
      ev.preventDefault();
    } else if(sect){
      dragging = {mode:"bezel", ang:angleOfPointer(ev, svg), rot0:bezelRot, moved:0, sector:+sect.getAttribute("data-sector")};
      try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
      ev.preventDefault();
    }
  });
  svg.addEventListener("pointermove", function(ev){
    if(!dragging) return;
    var a = angleOfPointer(ev, svg);
    var d = a - dragging.ang;
    if(d > 180) d -= 360; if(d < -180) d += 360;
    if(dragging.mode === "bezel"){
      dragging.moved += Math.abs(d);
      dragging.ang = a;
      bezelRot += d;
      drawBezel(bezelRot);
      return;
    }
    var deltaMin = snap5((d/360)*DAY);
    if(deltaMin === 0) return;
    dragging.ang += (deltaMin/DAY)*360;
    var L = findLog(dragging.id);
    if(!L) return;
    if(dragging.mode === "arc") shiftEntry(L, deltaMin); else resizeEntry(L, dragging.edge, deltaMin);
    NOW = nowAbs();
    for(var i=0;i<S.kids.length;i++){ if(S.kids[i].id === S.active) D = buildDay(S, S.kids[i], TODAY, NOW); }
    drawArcs(); drawHub();
  });
  function endDrag(ev){
    if(!dragging) return;
    var was = dragging; dragging = null;
    try{ svg.releasePointerCapture(ev.pointerId); }catch(e){}
    if(was.mode === "bezel"){
      var step = 360/SECTORS.length, idx;
      if(was.moved < 6){ idx = was.sector; }
      else { idx = Math.round(-bezelRot/step); }
      idx = ((idx % SECTORS.length) + SECTORS.length) % SECTORS.length;
      S.view = idx;
      say(SECTORS[idx].label+" — "+SECTORS[idx].head);
      commit();
    } else {
      say("Moved. Bedtime now "+min2hm(D.bed.bedAbs)+".");
      focusWant = was.id;
      commit();
    }
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  svg.addEventListener("keydown", function(ev){
    var t = ev.target;
    if(t && t.getAttribute && t.getAttribute("data-drag") === "arc"){
      var L = findLog(t.getAttribute("data-id"));
      if(!L) return;
      var big = ev.shiftKey ? 15 : 5, done = true;
      if(ev.key === "ArrowLeft") shiftEntry(L, -big);
      else if(ev.key === "ArrowRight") shiftEntry(L, big);
      else if(ev.key === "ArrowUp") resizeEntry(L, "e", big);
      else if(ev.key === "ArrowDown") resizeEntry(L, "e", -big);
      else done = false;
      if(done){ ev.preventDefault(); focusWant = L.i; say(L.k+" now "+L.s+" to "+(L.e||"—")); commit(); }
      return;
    }
    if(t && t.id === "dial-bezel"){
      var n = SECTORS.length, moved = true;
      if(ev.key === "ArrowRight" || ev.key === "ArrowDown") S.view = (S.view+1)%n;
      else if(ev.key === "ArrowLeft" || ev.key === "ArrowUp") S.view = (S.view+n-1)%n;
      else if(ev.key === "Home") S.view = 0;
      else moved = false;
      if(moved){ ev.preventDefault(); say(SECTORS[S.view].label+" — "+SECTORS[S.view].head); commit();
        var b = document.getElementById("dial-bezel"); if(b) b.focus(); }
    }
  });
})();

/* ============================================================================
   THE READING MATTER — edits, additions, files
   ========================================================================== */
var refocus = null;
function lightUpdate(){
  NOW = nowAbs();
  DAYS_MODEL = [];
  for(var i=0;i<S.kids.length;i++) DAYS_MODEL.push(buildDay(S, S.kids[i], TODAY, NOW));
  for(i=0;i<DAYS_MODEL.length;i++){ if(DAYS_MODEL[i].kid.id === S.active) D = DAYS_MODEL[i]; }
  if(!D) D = DAYS_MODEL[0];
  drawArcs(); drawHub(); drawLegend();
  saveState();
}
function addEntry(kid, kind, absStart, absEnd, note){
  var di = Math.floor(absStart/DAY);
  var d = isoOf(new Date(di*86400000));
  var e = {i:uid("e"), d:d, t:(kind==="feed"?"f":"s"), k:kind, s:min2hm(absStart),
           e:(absEnd===null?"":min2hm(absEnd)), st:0, w:0, o:"ok", n:note||""};
  if(kind === "feed") e.e = null;
  kid.logs.push(e);
  return e;
}
function applyValue(t){
  var v = t.value, id;
  if(t.hasAttribute("data-log")){
    var L = findLog(t.getAttribute("data-log")); if(!L) return;
    var f = t.getAttribute("data-fld");
    if(f === "k"){ L.k = v; L.t = (v === "feed") ? "f" : "s"; if(v === "feed") L.e = null; else if(L.e === null) L.e = ""; }
    else if(f === "st"){ L.st = clamp(intOr(v,0),0,600); }
    else L[f] = v;
    return;
  }
  if(t.hasAttribute("data-band")){
    id = t.getAttribute("data-band");
    for(var i=0;i<S.bands.length;i++){
      if(S.bands[i].id === id){
        var bf = t.getAttribute("data-bf");
        var raw = num(v, 0);
        S.bands[i][bf] = (bf === "naps") ? clamp(Math.round(raw),0,6) : Math.max(0, Math.round(raw*100)/100);
      }
    }
    return;
  }
  if(t.hasAttribute("data-kid")){
    var k = activeKid(), f2 = t.getAttribute("data-kid");
    if(f2 === "quietOn") k.quiet.on = (v === "1");
    else if(f2 === "quietS") k.quiet.s = v;
    else if(f2 === "quietLen") k.quiet.len = clamp(intOr(v,45),5,180);
    else if(f2 === "flex") k.flex = clamp(intOr(v,45),0,180);
    else if(f2 === "routine") k.routine = clamp(intOr(v,20),0,180);
    else if(f2 === "nightOverride") k.nightOverride = (v === "" ? "" : String(clamp(num(v,0),0,18)));
    else k[f2] = v;
    return;
  }
  if(t.id === "mmode") S.measMode = v;
  else if(t.id === "useper") S.usePersonal = (v === "1");
  else if(t.id === "hadults") S.adults = clamp(intOr(v,1),1,4);
  else if(t.id === "hgap") S.gap = clamp(intOr(v,20),0,120);
}
document.getElementById("ownplate").addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("button") : null;
  if(!t) return;
  if(t.id === "dumpsample"){
    S = {v:1, sample:false, active:"c1", view:2, usePersonal:true, adults:1, gap:20, measMode:"auto",
         bands: defaultBands(),
         kids:[{id:"c1", name:"Your child", dob:addDaysISO(TODAY,-180), wake:"07:00", flex:45, routine:20,
                napsOverride:"auto", nightOverride:"", quiet:{on:false,s:"13:00",len:45}, ritual:"", logs:[]}]};
    say("Sample cleared. Set the date of birth and wake goal.");
    commit();
  } else if(t.id === "gocard"){ S.view = 3; commit(); }
});
var sheaf = document.getElementById("sheaf");
sheaf.addEventListener("input", function(ev){
  var t = ev.target;
  if(!t.matches("input,select,textarea")) return;
  applyValue(t);
  lightUpdate();
});
/* A committed edit rebuilds the reading matter — but a blur caused by clicking a
   button must not tear that button out of the DOM before its click lands, so the
   rebuild is deferred and any click flushes it first. */
var renderTimer = 0, renderPending = false;
function scheduleRender(){
  renderPending = true;
  if(renderTimer) window.clearTimeout(renderTimer);
  renderTimer = window.setTimeout(flushRender, 400);
}
function cancelRender(){
  renderPending = false;
  if(renderTimer){ window.clearTimeout(renderTimer); renderTimer = 0; }
}
function flushRender(){
  if(!renderPending) return;
  cancelRender();
  refocus = (document.activeElement && document.activeElement.id) || null;
  commit();
  if(refocus){ var n = document.getElementById(refocus); if(n && n.focus) n.focus(); refocus = null; }
}
sheaf.addEventListener("change", function(ev){
  var t = ev.target;
  if(!t.matches("input,select,textarea")) return;
  if(t.id === "impfile") return;
  applyValue(t);
  lightUpdate();
  scheduleRender();
});

var armed = null;
sheaf.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("button") : null;
  cancelRender();
  if(!t){ flushRender(); return; }
  var k = activeKid(), i;
  if(t.hasAttribute("data-kid-pick")){ S.active = t.getAttribute("data-kid-pick"); commit(); return; }
  if(t.hasAttribute("data-del")){
    var id = t.getAttribute("data-del");
    for(i=0;i<k.logs.length;i++){ if(k.logs[i].i === id){ k.logs.splice(i,1); break; } }
    say("Entry removed."); commit(); return;
  }
  if(t.hasAttribute("data-delkid")){
    if(S.kids.length < 2) return;
    var kid = t.getAttribute("data-delkid");
    for(i=0;i<S.kids.length;i++){ if(S.kids[i].id === kid){ S.kids.splice(i,1); break; } }
    if(S.active === kid) S.active = S.kids[0].id;
    commit(); return;
  }
  if(t.hasAttribute("data-add")){
    var what = t.getAttribute("data-add");
    if(what === "wakenow"){
      var live = null;
      for(i=0;i<k.logs.length;i++){
        var L = k.logs[i];
        if(L.t === "s" && (L.e === "" || L.e === null || L.e === undefined)) live = L;
      }
      if(live){ live.e = min2hm(NOW); say("Sleep closed at "+live.e+"."); }
      else {
        var band = bandFor(S.bands, ageMonths(k.dob, TODAY));
        addEntry(k, "night", NOW - nightIdealMin(band), NOW, "");
        say("Night sleep added, ending now.");
      }
      commit(); return;
    }
    if(what === "feed") addEntry(k, "feed", snap5(NOW), null, "Feed");
    else addEntry(k, what, snap5(NOW), null, "");
    say(what+" started at "+min2hm(snap5(NOW))+". Leave the end blank until they wake.");
    commit(); return;
  }
  if(t.id === "addkid"){
    var nk = {id:uid("c"), name:"New child", dob:addDaysISO(TODAY,-180), wake:"07:00", flex:45, routine:20,
              napsOverride:"auto", nightOverride:"", quiet:{on:false,s:"13:00",len:45},
              ritual:"", logs:[]};
    S.kids.push(nk); S.active = nk.id; S.view = 2; say("Child added — set the date of birth."); commit(); return;
  }
  if(t.id === "resetbands"){ S.bands = defaultBands(); say("Published values restored."); commit(); return; }
  if(t.id === "restore"){ S = makeSample(TODAY); say("Sample family loaded."); commit(); return; }
  if(t.id === "clearall"){
    if(armed !== "clearall"){
      armed = "clearall"; t.textContent = "Tap again to erase everything";
      window.setTimeout(function(){ if(armed === "clearall"){ armed = null; render(); } }, 4000);
      return;
    }
    armed = null;
    S = {v:1, sample:false, active:"c1", view:0, usePersonal:true, adults:1, gap:20, measMode:"auto",
         bands: defaultBands(),
         kids:[{id:"c1", name:"Your child", dob:addDaysISO(TODAY,-180), wake:"07:00", flex:45, routine:20,
                napsOverride:"auto", nightOverride:"", quiet:{on:false,s:"13:00",len:45}, ritual:"", logs:[]}]};
    say("Everything cleared."); commit(); return;
  }
  if(t.id === "expcsv"){ exportCSV(); return; }
  if(t.id === "expjson"){ exportJSON(); return; }
  if(t.id === "impjson"){ var f = document.getElementById("impfile"); if(f) f.click(); return; }
  if(t.id === "doprint"){ printOnly([D]); return; }
  if(t.id === "doprintall"){ printOnly(DAYS_MODEL); return; }
});
sheaf.addEventListener("change", function(ev){
  if(ev.target.id !== "impfile") return;
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    var msg = document.getElementById("iomsg");
    try {
      var o = JSON.parse(String(fr.result));
      if(!o || !o.kids || !o.kids.length || !o.bands || !o.bands.length) throw new Error("not a Wake Windows file");
      for(var i=0;i<o.kids.length;i++){ if(!o.kids[i].logs) o.kids[i].logs = []; if(!o.kids[i].quiet) o.kids[i].quiet = {on:false,s:"13:00",len:45}; }
      o.view = intOr(o.view,0); o.sample = !!o.sample;
      S = o; commit();
      var m2 = document.getElementById("iomsg");
      if(m2) m2.textContent = "Imported "+o.kids.length+" child"+(o.kids.length===1?"":"ren")+" and their logs.";
      say("Import complete.");
    } catch(err){
      if(msg) msg.textContent = "That file could not be read as a Wake Windows export: "+err.message;
      say("Import failed.");
    }
  };
  fr.onerror = function(){
    var m3 = document.getElementById("iomsg");
    if(m3) m3.textContent = "That file could not be read.";
  };
  fr.readAsText(file);
});

/* ---------- files ---------- */
function q(v){
  var s = (v === null || v === undefined) ? "" : String(v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function download(name, mime, text){
  var blob = new Blob([text], {type:mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click();
  window.setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
}
function exportCSV(){
  var head = ["child","date","type","kind","start","end","duration_min","duration_hours","settle_min","night_wakings","outcome","note"];
  var lines = [head.map(q).join(",")];
  for(var i=0;i<S.kids.length;i++){
    var k = S.kids[i], ev = allEvents(k);
    for(var j=0;j<ev.length;j++){
      var e = ev[j], L = e.ref;
      var mins = (e.isFeed || e.len === null) ? "" : e.len;
      lines.push([k.name, L.d, L.t === "f" ? "feed" : "sleep", L.k, L.s, (L.e === null ? "" : L.e),
        mins, (mins === "" ? "" : hrs2(mins)), intOr(L.st,0), intOr(L.w,0), L.o || "", L.n || ""].map(q).join(","));
    }
  }
  download("wake-windows-"+TODAY+".csv", "text/csv;charset=utf-8", "﻿"+lines.join("\r\n")+"\r\n");
  say("CSV exported.");
}
function exportJSON(){
  download("wake-windows-"+TODAY+".json", "application/json", JSON.stringify(S, null, 2));
  say("JSON exported.");
}
function printOnly(list){
  var book = document.getElementById("printbook"), out = [];
  for(var i=0;i<list.length;i++) out.push(dayCard(list[i]));
  book.innerHTML = out.join("");
  var restore = function(){
    var all = [];
    for(var j=0;j<DAYS_MODEL.length;j++) all.push(dayCard(DAYS_MODEL[j]));
    book.innerHTML = all.join("");
    window.removeEventListener("afterprint", restore);
  };
  window.addEventListener("afterprint", restore);
  window.print();
  window.setTimeout(restore, 2500);
}

/* ============================================================================
   BOOT
   ========================================================================== */
S = loadState();
if(!S.measMode) S.measMode = "auto";
S.view = clamp(intOr(S.view,0), 0, SECTORS.length-1);
drawStatic();
render();
saveState();

/* the countdown is a secondary thing, so it just ticks quietly */
window.setInterval(function(){
  var t = isoOf(new Date());
  if(t !== TODAY){ TODAY = t; render(); return; }
  NOW = nowAbs();
  for(var i=0;i<S.kids.length;i++){ if(S.kids[i].id === S.active) D = buildDay(S, S.kids[i], TODAY, NOW); }
  if(D){ drawArcs(); drawHub(); drawLegend(); }
}, 30000);
</script>
