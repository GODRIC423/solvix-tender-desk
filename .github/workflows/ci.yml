name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the tender parsers (the highest-risk code — a silent regression
      # there means a load gets the wrong pickup date) plus the urgency and QC
      # banding rules that drive the board's colours.
      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
