name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Typecheck and build are the whole gate today. The tender engine has no
      # unit tests yet (it never had any); adding fixtures for the two sample
      # tenders is the obvious next step and would catch parser regressions,
      # which is the risk that matters most in this codebase.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build
