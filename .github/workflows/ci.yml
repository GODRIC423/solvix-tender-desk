name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the tender parsers (the highest-risk code — a silent regression
      # there means a load gets the wrong pickup date) plus the urgency and QC
      # banding rules that drive the board’s colours.
      - name: Test
        run: npm test

      # The VITE_* values are read at BUILD time, not runtime — Vite inlines them
      # into the bundle. Since the build happens here and Cloudflare only
      # receives the finished dist/, setting these in the Cloudflare dashboard
      # has no effect: they have to be GitHub secrets, on this step.
      # Without them the app deploys fine and shows "Finish connecting the desk"
      # forever, which looks like a broken deploy rather than missing config.
      # The anon key is safe to inline in a browser bundle — Row Level Security
      # is what protects the data — but it lives in secrets to stay out of git.
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_INGEST_ENDPOINT: ${{ secrets.VITE_INGEST_ENDPOINT }}

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler pages deploy dist --project-name=solvix-tender-desk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
