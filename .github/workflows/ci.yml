name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the deploy pipeline be re-run by hand (Actions -> CI -> Run
  # workflow) without an empty commit — e.g. after fixing a secret.
  workflow_dispatch:

# One job, in this order, so nothing can outrun the thing it depends on:
#   typecheck -> test -> build -> MIGRATE DATABASE -> deploy function -> deploy site
# If a migration fails, the site is not deployed against a schema it does not
# match. The database and function steps run only on a push to main.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers the tender parsers (the highest-risk code — a silent regression
      # there means a load gets the wrong pickup date) plus the flag and QC
      # banding rules that drive the board’s colours.
      - name: Test
        run: npm test

      # The VITE_* values are read at BUILD time, not runtime — Vite inlines them
      # into the bundle. Since the build happens here and Cloudflare only
      # receives the finished dist/, setting these in the Cloudflare dashboard
      # has no effect: they have to be GitHub secrets, on this step.
      # Without them the app deploys fine and shows "Finish connecting the desk"
      # forever, which looks like a broken deploy rather than missing config.
      # The anon key is safe to inline in a browser bundle — Row Level Security
      # is what protects the data — but it lives in secrets to stay out of git.
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_INGEST_ENDPOINT: ${{ secrets.VITE_INGEST_ENDPOINT }}

      # ------------------------------------------------------------------
      # Database: apply any migration in supabase/migrations/ that the hosted
      # project has not run yet. This is what makes a merge self-contained —
      # nobody pastes SQL into a dashboard.
      #
      # Needs two secrets:
      #   SUPABASE_ACCESS_TOKEN  a personal access token
      #                          (supabase.com/dashboard/account/tokens)
      #   SUPABASE_DB_PASSWORD   the project's database password
      #                          (Project Settings -> Database)
      # ------------------------------------------------------------------
      - name: Set up Supabase CLI
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Before touching anything, print what the token can see. This is
      # what turns "Your account does not have the necessary privileges"
      # into an answer: if the project is not in this list, the token was
      # made in a different Supabase account (or organization) than the one
      # that owns the project.
      - name: Check the Supabase access token
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: afwwwprqpnkbmtwmasmm
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must be set as repository secrets (Settings -> Secrets and variables -> Actions). See DEPLOY.md."
            exit 1
          fi
          echo "--- organizations this token can see ---"
          supabase orgs list || true
          echo "--- projects this token can see ---"
          PROJECTS=$(supabase projects list 2>&1 || true)
          echo "$PROJECTS"
          if ! echo "$PROJECTS" | grep -q "$SUPABASE_PROJECT_REF"; then
            echo "::error::The access token cannot see project $SUPABASE_PROJECT_REF. It was generated while signed in to a Supabase account that does not own this project. Sign in to the account whose project list shows $SUPABASE_PROJECT_REF (https://supabase.com/dashboard/projects), generate a new token there, and replace the SUPABASE_ACCESS_TOKEN secret. See DEPLOY.md, 'Troubleshooting'."
            exit 1
          fi

      - name: Apply database migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: afwwwprqpnkbmtwmasmm
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

          # Migrations 0000-0007 were applied by hand in the SQL editor before
          # this step existed, so the hosted project has no record of running
          # them. Marking them applied is idempotent and stops db push from
          # trying to create tables that already exist. Anything numbered
          # after 0007 is applied for real.
          supabase migration repair --linked --status applied \
            20260101000000 20260101000001 20260101000002 20260101000003 \
            20260101000004 20260101000005 20260101000006 20260101000007

          supabase db push --linked --yes
          supabase migration list --linked

      # The ingest function is code in this repo; redeploy it on every merge so
      # the running copy can never drift from what is reviewed. --use-api
      # bundles on Supabase's side, so no Docker is needed here. verify_jwt is
      # read from supabase/config.toml (false: the function checks its own
      # x-ingest-token).
      - name: Deploy the ingest function
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ingest-load --project-ref afwwwprqpnkbmtwmasmm --use-api

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler pages deploy dist --project-name=solvix-tender-desk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
