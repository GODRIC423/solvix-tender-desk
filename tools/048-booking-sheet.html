<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appointment Booking Sheet &mdash; day book with clash prevention, utilisation &amp; booked value</title>
<meta name="description" content="A day book of appointments with a column per staff member, room, chair or bay. Click a slot to book, services snap to their set duration and price, and overlapping bookings on the same resource are refused with a clear message that names the clash. Enforces buffer time between appointments, then reports utilisation per resource, total booked value, and every bookable gap left in the day. Prints a day sheet, exports CSV and JSON, saves in your browser.">
<meta name="theme-color" content="#0F6E75">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6E75'/%3E%3Crect x='6.4' y='8.2' width='19.2' height='17.4' rx='2.6' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M6.4 14h19.2' stroke='%23fff' stroke-width='2.2'/%3E%3Cpath d='M11.6 5.4v4.6M20.4 5.4v4.6' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Crect x='9.6' y='16.8' width='6.2' height='5.4' rx='1.2' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ══ Solvix Toolkit — shared design system ══════════════════════════
   Inline this whole block in every tool. System fonts only: the tools
   must work with no network at all. Set --accent per category.        */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --sunk:#E7EAEE; --raise:#FBFCFD;
  --ink:#15191E; --ink-2:#454D57; --muted:#6B747E; --faint:#98A1AB;
  --line:#D5DAE0; --line-hard:#B4BCC5;
  --accent:#1F5FA8; --accent-ink:#17497F; --accent-wash:#E6EEF8; --on-accent:#fff;
  --ok:#1B7A4B; --ok-wash:#E3F2EA;
  --warn:#9A6510; --warn-wash:#FBF0DC;
  --bad:#B3261E; --bad-wash:#FBE7E5;
  --r:5px; --pad:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sh:0 1px 2px rgba(21,25,30,.07),0 6px 18px -12px rgba(21,25,30,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181C21; --sunk:#1E242A; --raise:#212830;
  --ink:#E8ECF0; --ink-2:#B2BBC5; --muted:#828C97; --faint:#646E79;
  --line:#2A323A; --line-hard:#3D4750;
  --accent:#5A9BE8; --accent-ink:#7FB4F0; --accent-wash:#152538; --on-accent:#0B1017;
  --ok:#43B87B; --ok-wash:#12251B; --warn:#D2A24C; --warn-wash:#2A2113;
  --bad:#E8695F; --bad-wash:#2C1614;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181C21; --sunk:#1E242A; --raise:#212830;
  --ink:#E8ECF0; --ink-2:#B2BBC5; --muted:#828C97; --faint:#646E79;
  --line:#2A323A; --line-hard:#3D4750;
  --accent:#5A9BE8; --accent-ink:#7FB4F0; --accent-wash:#152538; --on-accent:#0B1017;
  --ok:#43B87B; --ok-wash:#12251B; --warn:#D2A24C; --warn-wash:#2A2113;
  --bad:#E8695F; --bad-wash:#2C1614;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.012em;font-weight:650}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* app frame */
.app{max-width:1180px;margin:0 auto;padding:0 clamp(10px,2vw,22px) 64px}
.appbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1*clamp(10px,2vw,22px));padding:11px clamp(10px,2vw,22px);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.appbar .brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.appbar .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font:700 12px/1 var(--mono);flex:none}
.appbar h1{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font:400 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.04em}

/* layout */
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.82fr);gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>.hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px var(--pad);border-bottom:1px solid var(--line)}
.card>.hd h2{margin-right:auto}
.card>.bd{padding:var(--pad)}
.card>.ft{padding:11px var(--pad);border-top:1px solid var(--line);background:var(--sunk);
  border-radius:0 0 var(--r) var(--r);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sticky{position:sticky;top:64px}

/* fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.lbl{font:600 10.5px/1.35 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{
  font:15px/1.35 var(--sans);color:var(--ink);background:var(--raise);
  border:1px solid var(--line-hard);border-radius:4px;padding:8px 9px;width:100%;min-width:0}
input[type=number],.ta-r{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
input:disabled,select:disabled{background:var(--sunk);color:var(--muted)}
textarea{resize:vertical;min-height:64px;font-family:var(--sans);text-align:left}
.hint{font:11.5px/1.4 var(--sans);color:var(--muted)}
.inv{border-color:var(--bad)!important}
.err{font:11.5px/1.4 var(--sans);color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:4px;padding:12px;margin:0}
legend{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 5px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent)}

/* buttons */
.btn{font:600 13.5px/1 var(--sans);padding:9px 13px;border-radius:4px;cursor:pointer;
  border:1px solid var(--line-hard);background:var(--raise);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn.dgr{color:var(--bad);border-color:var(--line-hard)}
.btn.dgr:hover{background:var(--bad-wash);border-color:var(--bad)}
.btn.sm{font-size:12px;padding:6px 9px}
.btn.ico{padding:6px 8px;font-family:var(--mono)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 10.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-hard);white-space:nowrap;background:var(--sunk)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-wash)}
th.r,td.r{text-align:right}
td.n,th.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:650;border-top:2px solid var(--line-hard);background:var(--sunk)}
table input,table select{padding:5px 6px;font-size:13.5px;border-color:transparent;background:transparent}
table input:hover,table select:hover{border-color:var(--line)}
table input:focus,table select:focus{background:var(--raise)}

/* results */
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.stat .k{font:600 10px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 23px/1.15 var(--mono);letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .u{font-size:12.5px;color:var(--muted);font-weight:400}
.stat.hero{background:var(--accent-wash);border-color:var(--accent)}
.stat.hero .v{color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--sans);letter-spacing:.05em;
  text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--sunk);color:var(--ink-2)}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.note{border-left:3px solid var(--accent);background:var(--accent-wash);padding:11px 13px;border-radius:0 4px 4px 0;font-size:13.5px;line-height:1.5}
.note.warn{border-color:var(--warn);background:var(--warn-wash)}
.note.bad{border-color:var(--bad);background:var(--bad-wash)}
.note strong{font-weight:650}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}

/* print — every tool must produce a clean document */
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--surface:#fff;--sunk:#fff;--raise:#fff;--ink:#000;--ink-2:#222;--muted:#555;
        --line:#bbb;--line-hard:#888;--accent:#000;--accent-wash:#fff;--sh:none}
  body{background:#fff;font-size:11pt}
  .appbar,.noprint,.btn,.tools,nav{display:none!important}
  .app{max-width:none;padding:0}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid;margin-bottom:8mm}
  .card>.ft{background:#fff}
  .printonly{display:block!important}
  .split,.cols-2,.cols-3{display:block}
  table{font-size:10pt} th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,td,th{break-inside:avoid}
  input,select,textarea{border:0;padding:0;background:#fff;color:#000;-webkit-appearance:none;appearance:none}
  .stat{border:1px solid #bbb}
  a[href]::after{content:""}
}
.printonly{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ══ tool-specific ═══════════════════════════════════════════════ */
:root{--accent:#0F6E75;--accent-ink:#0B555A;--accent-wash:#E1F0F1;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#3FB5BE;--accent-ink:#6ED2D9;--accent-wash:#102A2E;--on-accent:#04181A}}
:root[data-theme="dark"]{--accent:#3FB5BE;--accent-ink:#6ED2D9;--accent-wash:#102A2E;--on-accent:#04181A}

[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{max-width:1320px}
.pagestack{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.fgrid{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.fgrid.wide{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.msg{margin:0}
.msg:not(:empty){padding:8px 11px;border-radius:4px;background:var(--ok-wash);color:var(--ok);
  font:600 12.5px/1.4 var(--sans)}
.msg.bad:not(:empty){background:var(--bad-wash);color:var(--bad)}

/* banner */
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.banner .bt{margin-right:auto;min-width:220px;flex:1 1 260px}

/* stat band */
.statband{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.statband .stat{display:flex;flex-direction:column;justify-content:center;min-width:0}
.statband .stat.hero{grid-column:span 2}
@media(max-width:470px){.statband{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .statband .stat.hero{grid-column:1/-1}}
.stat.hero .v{font:750 30px/1.12 var(--mono);letter-spacing:-.025em;color:var(--accent-ink);overflow-wrap:anywhere}
.stat .sub2{font:11.5px/1.38 var(--sans);color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.stat.hero .sub2{color:var(--accent-ink);font-weight:600}
.stat .v.sm{font-size:19px}
.stat.flagbad{background:var(--bad-wash);border-color:var(--bad)}
.stat.flagbad .v{color:var(--bad)}

/* day book grid */
.gridwrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:none}
table.bk{border-collapse:collapse;table-layout:fixed;font-size:13px}
table.bk tbody tr:hover{background:transparent}
table.bk th{position:sticky;top:0;z-index:2;background:var(--sunk);padding:7px 8px;white-space:normal;
  border-bottom:1px solid var(--line-hard);text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink)}
table.bk th .rn{font:650 12.5px/1.25 var(--sans);color:var(--ink);display:block;overflow-wrap:anywhere}
table.bk th .rr{font:400 10.5px/1.3 var(--mono);color:var(--muted);display:block;margin-top:2px}
table.bk th.tcol,table.bk td.tcol{width:64px}
table.bk th.tcol{text-align:right}
table.bk td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:23px;vertical-align:top}
table.bk td.tcol{border-right:1px solid var(--line-hard);text-align:right;padding:0 7px 0 2px;
  font:11.5px/23px var(--mono);color:var(--muted);white-space:nowrap;vertical-align:top}
table.bk td.tcol.hh{color:var(--ink-2);font-weight:650}
table.bk tr.hh>td{border-top:1px solid var(--line-hard)}
table.bk tr.nowrow>td.tcol{color:var(--bad);font-weight:700;box-shadow:inset 2px 0 0 0 var(--bad)}
.slotbtn{display:block;width:100%;height:100%;min-height:23px;border:0;background:transparent;cursor:pointer;
  padding:0;font:600 12px/1 var(--mono);color:transparent}
.slotbtn:hover{background:var(--accent-wash);color:var(--accent-ink)}
.slotbtn::after{content:'+ book'}
td.off{background:repeating-linear-gradient(45deg,var(--sunk),var(--sunk) 3px,transparent 3px,transparent 7px)}
td.off .slotbtn:hover{background:var(--accent-wash)}
td.grp{padding:1px;background:var(--surface)}
.bkbtn{display:block;width:100%;text-align:left;border:1px solid var(--accent);border-left-width:4px;
  background:var(--accent-wash);color:var(--ink);padding:3px 5px;cursor:pointer;overflow:hidden;
  border-radius:3px;margin-bottom:1px;min-height:21px}
.bkbtn:last-child{margin-bottom:0}
.bkbtn:hover{border-color:var(--accent-ink);box-shadow:inset 0 0 0 99px rgba(255,255,255,.28)}
.bkbtn .t{font:650 11px/1.25 var(--mono);color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bkbtn .c{font:650 12.5px/1.3 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkbtn .s{font:400 11px/1.3 var(--sans);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bkbtn .b{font:400 10px/1.3 var(--mono);color:var(--muted);white-space:nowrap}
.bkbtn.st-done{border-color:var(--ok);background:var(--ok-wash)} .bkbtn.st-done .t{color:var(--ok)}
.bkbtn.st-arrived{border-color:var(--ok);background:var(--ok-wash)} .bkbtn.st-arrived .t{color:var(--ok)}
.bkbtn.st-noshow{border-color:var(--bad);background:var(--bad-wash)} .bkbtn.st-noshow .t{color:var(--bad)}
.bkbtn.st-booked{border-color:var(--line-hard);background:var(--sunk)} .bkbtn.st-booked .t{color:var(--ink-2)}
.bkbtn.sel{outline:2px solid var(--accent);outline-offset:1px}
.bkbtn.oob{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font:11.5px/1.4 var(--sans);color:var(--muted);margin-top:9px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;border:1px solid var(--line-hard);vertical-align:-1px;margin-right:3px}
.legend b.k1{background:var(--accent-wash);border-color:var(--accent)}
.legend b.k2{background:var(--ok-wash);border-color:var(--ok)}
.legend b.k3{background:var(--bad-wash);border-color:var(--bad)}
.legend b.k4{background:var(--sunk)}

/* editor */
.edit{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
.edit .wide2{grid-column:span 2}
@media(max-width:560px){.edit .wide2{grid-column:span 1}}
.edact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edact .sp{margin-left:auto;font:11.5px/1.35 var(--sans);color:var(--muted);text-align:right}

/* tables */
#resTbl{min-width:660px} #svcTbl{min-width:540px} #bkTbl{min-width:940px}
.rmbtn{border:1px solid var(--line);background:var(--raise);color:var(--muted);border-radius:3px;
  font:700 11px/1 var(--mono);padding:5px 7px;cursor:pointer}
.rmbtn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-wash)}
.edbtn{border:1px solid var(--line);background:var(--raise);color:var(--ink-2);border-radius:3px;
  font:650 11px/1 var(--sans);padding:5px 7px;cursor:pointer}
.edbtn:hover{border-color:var(--accent);color:var(--accent)}
tr.cx td{color:var(--muted)}
tr.cx td.who{text-decoration:line-through}
tr.rowsel>td{background:var(--accent-wash)}
.tag{display:inline-block;font:700 9.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
  padding:3px 5px;border-radius:2px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-wash);color:var(--ok)}
.tag.warn{background:var(--warn-wash);color:var(--warn)}
.tag.bad{background:var(--bad-wash);color:var(--bad)}
.tag.acc{background:var(--accent-wash);color:var(--accent-ink)}
.tags{display:flex;flex-wrap:wrap;gap:3px}
td.who .nm{font-weight:650;line-height:1.25;overflow-wrap:anywhere}
td.who .ct{font:11.5px/1.35 var(--mono);color:var(--muted);overflow-wrap:anywhere}
td.tm .d1{font:650 13px/1.25 var(--mono);white-space:nowrap}
td.tm .d2{font:11px/1.3 var(--mono);color:var(--muted);white-space:nowrap}

/* summary */
.util .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.util .kv:last-child{border-bottom:0}
.util .nm{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.util .nums{font:12.5px/1.3 var(--mono);color:var(--ink-2);white-space:nowrap;text-align:right}
.util .bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:2px}
.util .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.util .bar i.hi{background:var(--ok)} .util .bar i.lo{background:var(--warn)}
.util .sub{grid-column:1/-1;font:11px/1.35 var(--sans);color:var(--muted);margin-top:2px}
.kvrow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kvrow:last-child{border-bottom:0}
.kvrow .v{font-family:var(--mono);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.kvrow .v.ok{color:var(--ok)} .kvrow .v.bad{color:var(--bad)} .kvrow .v.warn{color:var(--warn)}
