<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meal Planner &amp; Shopping List &mdash; a week of meals into one aisle-sorted shop</title>
<meta name="description" content="Plan breakfast, lunch and dinner for the week from your own recipe library. Recipes scale automatically to your household, leftovers carry over to another day, and every ingredient is aggregated into one shopping list — duplicates combined with real unit conversion (500 g + 0.5 kg = 1 kg), pantry staples you already have excluded, sorted by supermarket aisle, with an estimated cost from your own unit prices. Prints a meal plan and shopping list, exports CSV and JSON, saves in your browser. Works offline.">
<meta name="theme-color" content="#8A3A6B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238A3A6B'/%3E%3Cpath d='M9.5 7v18M9.5 7c-1.6 0-2.6 1.4-2.6 3.4S7.9 14 9.5 14s2.6-1.6 2.6-3.6S11.1 7 9.5 7z' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M22.5 25V7c-2.2.9-3.4 3.2-3.4 6.2 0 2.1 1.1 3.3 3.4 3.3' fill='none' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ══ Solvix Toolkit — shared design system ══════════════════════════
   Inline this whole block in every tool. System fonts only: the tools
   must work with no network at all. Set --accent per category.        */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --sunk:#E7EAEE; --raise:#FBFCFD;
  --ink:#15191E; --ink-2:#454D57; --muted:#6B747E; --faint:#98A1AB;
  --line:#D5DAE0; --line-hard:#B4BCC5;
  --accent:#1F5FA8; --accent-ink:#17497F; --accent-wash:#E6EEF8; --on-accent:#fff;
  --ok:#1B7A4B; --ok-wash:#E3F2EA;
  --warn:#9A6510; --warn-wash:#FBF0DC;
  --bad:#B3261E; --bad-wash:#FBE7E5;
  --r:5px; --pad:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sh:0 1px 2px rgba(21,25,30,.07),0 6px 18px -12px rgba(21,25,30,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181C21; --sunk:#1E242A; --raise:#212830;
  --ink:#E8ECF0; --ink-2:#B2BBC5; --muted:#828C97; --faint:#646E79;
  --line:#2A323A; --line-hard:#3D4750;
  --accent:#5A9BE8; --accent-ink:#7FB4F0; --accent-wash:#152538; --on-accent:#0B1017;
  --ok:#43B87B; --ok-wash:#12251B; --warn:#D2A24C; --warn-wash:#2A2113;
  --bad:#E8695F; --bad-wash:#2C1614;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181C21; --sunk:#1E242A; --raise:#212830;
  --ink:#E8ECF0; --ink-2:#B2BBC5; --muted:#828C97; --faint:#646E79;
  --line:#2A323A; --line-hard:#3D4750;
  --accent:#5A9BE8; --accent-ink:#7FB4F0; --accent-wash:#152538; --on-accent:#0B1017;
  --ok:#43B87B; --ok-wash:#12251B; --warn:#D2A24C; --warn-wash:#2A2113;
  --bad:#E8695F; --bad-wash:#2C1614;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.012em;font-weight:650}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* app frame */
.app{max-width:1180px;margin:0 auto;padding:0 clamp(10px,2vw,22px) 64px}
.appbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1*clamp(10px,2vw,22px));padding:11px clamp(10px,2vw,22px);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.appbar .brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.appbar .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font:700 12px/1 var(--mono);flex:none}
.appbar h1{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font:400 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.04em}

/* layout */
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.82fr);gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>.hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px var(--pad);border-bottom:1px solid var(--line)}
.card>.hd h2{margin-right:auto}
.card>.bd{padding:var(--pad)}
.card>.ft{padding:11px var(--pad);border-top:1px solid var(--line);background:var(--sunk);
  border-radius:0 0 var(--r) var(--r);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sticky{position:sticky;top:64px}

/* fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.lbl{font:600 10.5px/1.35 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{
  font:15px/1.35 var(--sans);color:var(--ink);background:var(--raise);
  border:1px solid var(--line-hard);border-radius:4px;padding:8px 9px;width:100%;min-width:0}
input[type=number],.ta-r{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
input:disabled,select:disabled{background:var(--sunk);color:var(--muted)}
textarea{resize:vertical;min-height:64px;font-family:var(--sans);text-align:left}
.hint{font:11.5px/1.4 var(--sans);color:var(--muted)}
.inv{border-color:var(--bad)!important}
.err{font:11.5px/1.4 var(--sans);color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:4px;padding:12px;margin:0}
legend{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 5px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent)}

/* buttons */
.btn{font:600 13.5px/1 var(--sans);padding:9px 13px;border-radius:4px;cursor:pointer;
  border:1px solid var(--line-hard);background:var(--raise);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn.dgr{color:var(--bad);border-color:var(--line-hard)}
.btn.dgr:hover{background:var(--bad-wash);border-color:var(--bad)}
.btn.sm{font-size:12px;padding:6px 9px}
.btn.ico{padding:6px 8px;font-family:var(--mono)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 10.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-hard);white-space:nowrap;background:var(--sunk)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-wash)}
th.r,td.r{text-align:right}
td.n,th.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:650;border-top:2px solid var(--line-hard);background:var(--sunk)}
table input,table select{padding:5px 6px;font-size:13.5px;border-color:transparent;background:transparent}
table input:hover,table select:hover{border-color:var(--line)}
table input:focus,table select:focus{background:var(--raise)}

/* results */
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.stat .k{font:600 10px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 23px/1.15 var(--mono);letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .u{font-size:12.5px;color:var(--muted);font-weight:400}
.stat.hero{background:var(--accent-wash);border-color:var(--accent)}
.stat.hero .v{color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--sans);letter-spacing:.05em;
  text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--sunk);color:var(--ink-2)}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.note{border-left:3px solid var(--accent);background:var(--accent-wash);padding:11px 13px;border-radius:0 4px 4px 0;font-size:13.5px;line-height:1.5}
.note.warn{border-color:var(--warn);background:var(--warn-wash)}
.note.bad{border-color:var(--bad);background:var(--bad-wash)}
.note strong{font-weight:650}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}

/* print — every tool must produce a clean document */
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--surface:#fff;--sunk:#fff;--raise:#fff;--ink:#000;--ink-2:#222;--muted:#555;
        --line:#bbb;--line-hard:#888;--accent:#000;--accent-wash:#fff;--sh:none}
  body{background:#fff;font-size:11pt}
  .appbar,.noprint,.btn,.tools,nav{display:none!important}
  .app{max-width:none;padding:0}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid;margin-bottom:8mm}
  .card>.ft{background:#fff}
  .printonly{display:block!important}
  .split,.cols-2,.cols-3{display:block}
  table{font-size:10pt} th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,td,th{break-inside:avoid}
  input,select,textarea{border:0;padding:0;background:#fff;color:#000;-webkit-appearance:none;appearance:none}
  .stat{border:1px solid #bbb}
  a[href]::after{content:""}
}
.printonly{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ══ tool: meal planner — Personal & Household ══════════════════════ */
:root{--accent:#8A3A6B;--accent-ink:#6C2D54;--accent-wash:#F7E9F1;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#D07AAC;--accent-ink:#E49CC4;--accent-wash:#2C1626;--on-accent:#180A13}}
:root[data-theme="dark"]{--accent:#D07AAC;--accent-ink:#E49CC4;--accent-wash:#2C1626;--on-accent:#180A13}

.app{padding-bottom:44px}
.mt10{margin-top:10px}.mt14{margin-top:14px}
.gap{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.f.sm{max-width:132px}
.hero-wrap{display:grid;gap:8px}
.stat.hero .v{font-size:31px}
.substats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.substats .stat{padding:9px 11px}
.substats .stat .v{font-size:17px}
.sepr{height:1px;background:var(--line);margin:12px 0}

/* week grid */
.wk{table-layout:fixed}
.wk th:first-child,.wk td:first-child{width:118px}
.wk td{vertical-align:top;padding:7px 8px}
.wk .day{font-weight:650;font-size:13.5px}
.wk .day small{display:block;font-weight:400;color:var(--muted);font:400 11px/1.5 var(--mono)}
.wk select{width:100%;font-size:13px}
.wk .prow{display:flex;align-items:center;gap:5px;margin-top:4px}
.wk .prow label{font:600 9.5px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wk .prow input{width:62px;padding:3px 5px;font-size:12.5px}
.wk .prow .ov{color:var(--accent-ink);font-weight:700}
.wk tbody tr:hover{background:transparent}
.wk tbody tr:nth-child(even){background:var(--raise)}
.pv{display:none}
.slot-lo select{color:var(--accent-ink);font-style:italic}
.badlink{color:var(--bad);font:600 10.5px/1.4 var(--sans)}

@media screen and (max-width:820px){
  .wk,.wk tbody,.wk tr,.wk td{display:block;width:100%}
  .wk thead{display:none}
  .wk tr{border:1px solid var(--line);border-radius:4px;margin-bottom:9px;padding:4px 6px 8px}
  .wk tbody tr:nth-child(even){background:var(--surface)}
  .wk td{border:0;padding:5px 2px}
  .wk td:first-child{width:auto;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:2px}
  .wk td[data-l]::before{content:attr(data-l);display:block;
    font:600 10px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
}

/* recipe editor */
.rlist{display:flex;flex-wrap:wrap;gap:6px}
.rpill{font:600 12.5px/1 var(--sans);padding:7px 10px;border-radius:4px;border:1px solid var(--line-hard);
  background:var(--raise);color:var(--ink);cursor:pointer;white-space:nowrap}
.rpill:hover{border-color:var(--accent);color:var(--accent)}
.rpill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rpill .n{font-family:var(--mono);opacity:.72;font-size:11px;margin-left:5px}
.ing th:nth-child(1),.ing td:nth-child(1){width:74px}
.ing th:nth-child(2),.ing td:nth-child(2){width:92px}
.ing th:nth-child(5),.ing td:nth-child(5){width:96px}
.ing th:nth-child(6),.ing td:nth-child(6){width:64px}
.ing th:last-child,.ing td:last-child{width:38px}
.ing td{padding:4px 6px}
.ing tbody tr:hover{background:var(--raise)}
.ing .rm{padding:4px 7px;line-height:1;color:var(--muted)}
.ing .rm:hover{color:var(--bad);border-color:var(--bad)}
.tagbox{display:flex;gap:12px;flex-wrap:wrap}
.tagbox .check{font-size:13px}

/* shopping list */
.grp td{background:var(--accent-wash);font:700 11px/1.3 var(--sans);letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent-ink);padding:7px 10px;border-bottom:1px solid var(--line-hard)}
.grp .gc{float:right;font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:650}
.sl td{padding:6px 10px}
.sl tbody tr:hover{background:var(--raise)}
.sl .tick{width:34px}
.sl .tick input{width:17px;height:17px;accent-color:var(--accent)}
tr.done td.item,tr.done td.n{text-decoration:line-through;color:var(--muted)}
.sl .item small{display:block;color:var(--muted);font-size:11.5px}
.sl th:nth-child(3),.sl td:nth-child(3){width:96px}
.sl th:nth-child(4),.sl td:nth-child(4){width:96px}
.sl th:nth-child(5),.sl td:nth-child(5){width:92px}
.sl th:nth-child(6),.sl td:nth-child(6){width:86px}
.pantry{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px}
.pantry .check{padding:3px 0;font-size:13.5px}
.pantry .check .q{color:var(--muted);font-family:var(--mono);font-size:12px}

/* print */
.phead{border-bottom:2px solid #000;padding-bottom:7px;margin-bottom:9px}
.phead .t{font:700 19px/1.2 var(--sans)}
.phead .m{font:12px/1.5 var(--sans);color:#333;margin-top:3px}
.pmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px;margin:8px 0 4px;font-size:11pt}
.pmeta .k{font:600 9px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#555}
.recdoc{break-inside:avoid;margin-bottom:6mm}
.recdoc h3{font-size:12.5pt;margin-bottom:2px}
.recdoc .rs{font-size:10pt;color:#444;margin-bottom:3px}
.recdoc ul{margin:0;padding-left:16px;font-size:10pt;columns:2;column-gap:14mm}
@media print{
  .pv{display:inline}
  .wk select,.wk .prow input,.wk .prow label{display:none!important}
  .wk td{padding:5px 7px}
  .wk th:first-child,.wk td:first-child{width:96px}
  .sl .tick input{-webkit-appearance:none;appearance:none;display:inline-block;
    width:12px;height:12px;border:1px solid #000;border-radius:2px;background:#fff}
  .card{break-inside:auto}
  .substats{display:grid!important;grid-template-columns:repeat(4,1fr)}
  .hero-wrap{display:grid!important}
  .stat.hero{border:2px solid #000!important}
  .grp td{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#000}
  tbody tr:nth-child(even){background:#fff!important}
  .pantry{display:grid!important;grid-template-columns:repeat(3,1fr)}
  body.pd-plan #cList,body.pd-plan #cRecPrint,body.pd-plan #cPantry,
  body.pd-list #cWeek,body.pd-list #cRecPrint,
  body.pd-rec #cWeek,body.pd-rec #cList,body.pd-rec #cPantry,body.pd-rec #cRes,
  body:not(.pd-rec) #cRecPrint,
  #cRecEdit,#cPantryEdit{display:none!important}
}
</style>
</head>
