<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pallet &amp; Trailer Load Planner — cases per pallet, pallets per trailer, load diagrams</title>
<meta name="description" content="Offline load planning tool: best-fit cases per pallet layer from both case orientations plus split-block patterns, layers capped by stack height and stack weight, pallet positions computed from real trailer internal dimensions (53 ft, 48 ft, 26 ft box), 45,000 lb payload check, scale pallet layer and trailer floor plan diagrams, printable load plan, CSV and JSON export.">
<meta name="theme-color" content="#1F5FA8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F5FA8'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='2'%3E%3Crect x='7' y='7' width='18' height='18' rx='1.5'/%3E%3Cpath d='M16 7v18M7 16h18'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ══ Solvix Toolkit — shared design system ══════════════════════════
   Inline this whole block in every tool. System fonts only: the tools
   must work with no network at all. Set --accent per category.        */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F1F3F5; --surface:#FFFFFF; --sunk:#E7EAEE; --raise:#FBFCFD;
  --ink:#15191E; --ink-2:#454D57; --muted:#6B747E; --faint:#98A1AB;
  --line:#D5DAE0; --line-hard:#B4BCC5;
  --accent:#1F5FA8; --accent-ink:#17497F; --accent-wash:#E6EEF8; --on-accent:#fff;
  --ok:#1B7A4B; --ok-wash:#E3F2EA;
  --warn:#9A6510; --warn-wash:#FBF0DC;
  --bad:#B3261E; --bad-wash:#FBE7E5;
  --r:5px; --pad:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sh:0 1px 2px rgba(21,25,30,.07),0 6px 18px -12px rgba(21,25,30,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181C21; --sunk:#1E242A; --raise:#212830;
  --ink:#E8ECF0; --ink-2:#B2BBC5; --muted:#828C97; --faint:#646E79;
  --line:#2A323A; --line-hard:#3D4750;
  --accent:#5A9BE8; --accent-ink:#7FB4F0; --accent-wash:#152538; --on-accent:#0B1017;
  --ok:#43B87B; --ok-wash:#12251B; --warn:#D2A24C; --warn-wash:#2A2113;
  --bad:#E8695F; --bad-wash:#2C1614;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181C21; --sunk:#1E242A; --raise:#212830;
  --ink:#E8ECF0; --ink-2:#B2BBC5; --muted:#828C97; --faint:#646E79;
  --line:#2A323A; --line-hard:#3D4750;
  --accent:#5A9BE8; --accent-ink:#7FB4F0; --accent-wash:#152538; --on-accent:#0B1017;
  --ok:#43B87B; --ok-wash:#12251B; --warn:#D2A24C; --warn-wash:#2A2113;
  --bad:#E8695F; --bad-wash:#2C1614;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px -12px rgba(0,0,0,.7);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.012em;font-weight:650}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* app frame */
.app{max-width:1180px;margin:0 auto;padding:0 clamp(10px,2vw,22px) 64px}
.appbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);
  margin:0 calc(-1*clamp(10px,2vw,22px));padding:11px clamp(10px,2vw,22px);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.appbar .brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.appbar .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font:700 12px/1 var(--mono);flex:none}
.appbar h1{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{font:400 11.5px/1 var(--mono);color:var(--muted);letter-spacing:.04em}

/* layout */
.grid{display:grid;gap:14px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.82fr);gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>.hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px var(--pad);border-bottom:1px solid var(--line)}
.card>.hd h2{margin-right:auto}
.card>.bd{padding:var(--pad)}
.card>.ft{padding:11px var(--pad);border-top:1px solid var(--line);background:var(--sunk);
  border-radius:0 0 var(--r) var(--r);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sticky{position:sticky;top:64px}

/* fields */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.lbl{font:600 10.5px/1.35 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{
  font:15px/1.35 var(--sans);color:var(--ink);background:var(--raise);
  border:1px solid var(--line-hard);border-radius:4px;padding:8px 9px;width:100%;min-width:0}
input[type=number],.ta-r{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
input:disabled,select:disabled{background:var(--sunk);color:var(--muted)}
textarea{resize:vertical;min-height:64px;font-family:var(--sans);text-align:left}
.hint{font:11.5px/1.4 var(--sans);color:var(--muted)}
.inv{border-color:var(--bad)!important}
.err{font:11.5px/1.4 var(--sans);color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:4px;padding:12px;margin:0}
legend{font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 5px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:16px;height:16px;flex:none;margin-top:2px;accent-color:var(--accent)}

/* buttons */
.btn{font:600 13.5px/1 var(--sans);padding:9px 13px;border-radius:4px;cursor:pointer;
  border:1px solid var(--line-hard);background:var(--raise);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn.dgr{color:var(--bad);border-color:var(--line-hard)}
.btn.dgr:hover{background:var(--bad-wash);border-color:var(--bad)}
.btn.sm{font-size:12px;padding:6px 9px}
.btn.ico{padding:6px 8px;font-family:var(--mono)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 10.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-hard);white-space:nowrap;background:var(--sunk)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-wash)}
th.r,td.r{text-align:right}
td.n,th.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:650;border-top:2px solid var(--line-hard);background:var(--sunk)}
table input,table select{padding:5px 6px;font-size:13.5px;border-color:transparent;background:transparent}
table input:hover,table select:hover{border-color:var(--line)}
table input:focus,table select:focus{background:var(--raise)}

/* results */
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.stat .k{font:600 10px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 23px/1.15 var(--mono);letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .u{font-size:12.5px;color:var(--muted);font-weight:400}
.stat.hero{background:var(--accent-wash);border-color:var(--accent)}
.stat.hero .v{color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1 var(--sans);letter-spacing:.05em;
  text-transform:uppercase;padding:4px 7px;border-radius:3px;background:var(--sunk);color:var(--ink-2)}
.chip.ok{background:var(--ok-wash);color:var(--ok)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.bad{background:var(--bad-wash);color:var(--bad)}
.note{border-left:3px solid var(--accent);background:var(--accent-wash);padding:11px 13px;border-radius:0 4px 4px 0;font-size:13.5px;line-height:1.5}
.note.warn{border-color:var(--warn);background:var(--warn-wash)}
.note.bad{border-color:var(--bad);background:var(--bad-wash)}
.note strong{font-weight:650}
.empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:14px}

/* print — every tool must produce a clean document */
@media print{
  @page{margin:14mm}
  :root{--bg:#fff;--surface:#fff;--sunk:#fff;--raise:#fff;--ink:#000;--ink-2:#222;--muted:#555;
        --line:#bbb;--line-hard:#888;--accent:#000;--accent-wash:#fff;--sh:none}
  body{background:#fff;font-size:11pt}
  .appbar,.noprint,.btn,.tools,nav{display:none!important}
  .app{max-width:none;padding:0}
  .card{border:1px solid #bbb;box-shadow:none;break-inside:avoid;margin-bottom:8mm}
  .card>.ft{background:#fff}
  .printonly{display:block!important}
  .split,.cols-2,.cols-3{display:block}
  table{font-size:10pt} th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr,td,th{break-inside:avoid}
  input,select,textarea{border:0;padding:0;background:#fff;color:#000;-webkit-appearance:none;appearance:none}
  .stat{border:1px solid #bbb}
  a[href]::after{content:""}
}
.printonly{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ══ 015 Pallet & Trailer Load Planner — tool styles ══════════════ */
:root{--accent:#1F5FA8;--accent-ink:#17497F;--accent-wash:#E6EEF8;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#5A9BE8;--accent-ink:#8FBEF2;--accent-wash:#14243A;--on-accent:#0B1017}}
:root[data-theme="dark"]{--accent:#5A9BE8;--accent-ink:#8FBEF2;--accent-wash:#14243A;--on-accent:#0B1017}

body{padding-bottom:0}
.app{padding-bottom:40px}
.appbar .row{gap:6px}
.spacer{height:14px}
.stack.gap{gap:14px}

/* hero */
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat.hero .v{font-size:32px;line-height:1.05}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat .u{display:block;margin-top:4px;line-height:1.35}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin-top:10px}
.statgrid .stat{padding:8px 10px}
.statgrid .stat .v{font-size:17px}
.bar{height:9px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)}
.barrow{display:flex;justify-content:space-between;gap:8px;font:600 10.5px/1.3 var(--sans);
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.barrow b{font-family:var(--mono);font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none}

/* forms */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.fg.w2{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.f .unit{font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint)}
.samplebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border:1px dashed var(--accent);
  background:var(--accent-wash);border-radius:4px;font-size:13px;color:var(--accent-ink)}
.samplebar strong{font-weight:700}
.samplebar .btn{margin-left:auto}

/* sku table */
#skuTable td{padding:4px 6px}
#skuTable input{width:100%}
#skuTable td.dsc{min-width:170px}
#skuTable td.nm{min-width:74px}
#skuTable .btn.ico{color:var(--muted)}
#skuTable .btn.ico:hover{color:var(--bad);border-color:var(--bad)}
.rowno{font:600 11px/1 var(--mono);color:var(--faint)}

/* diagrams */
.builds{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
.build{border:1px solid var(--line);border-radius:4px;background:var(--raise);padding:11px;break-inside:avoid}
.build h3{font-size:13px;margin-bottom:2px}
.build .meta{font:11.5px/1.45 var(--sans);color:var(--muted)}
.build .dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:8px;font-size:12.5px}
.build .dl dt{color:var(--muted)} .build .dl dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.diag{margin:9px 0 7px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:6px}
.diag svg{display:block;width:100%;height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tflags{display:flex;justify-content:space-between;font:600 10.5px/1 var(--sans);letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;align-items:center}
.legend i{display:inline-block;width:16px;height:11px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--accent);background:var(--accent-wash)}
.legend i.free{border-style:dashed;border-color:var(--line-hard);background:transparent}
.cap{font-size:12.5px;color:var(--muted);margin-top:6px}
.cap b{color:var(--ink);font-family:var(--mono)}

/* print document */
.phead{margin-bottom:7mm}
.pdoc{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:5px}
.ptitle{font:700 21px/1.1 var(--sans);letter-spacing:-.02em}
.psub{font:12px/1.4 var(--sans);color:#333;margin-top:2px}
.pmeta{margin-left:auto;text-align:right;font:11px/1.5 var(--mono)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm;margin-top:4mm;font-size:11px}
.pgrid .k{font:600 9px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:#555}
.pgrid .v{font:12px/1.4 var(--sans)}
.sigs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10mm;margin-top:9mm}
.sig{border-top:1px solid #000;padding-top:3px;font:10px/1.3 var(--sans);color:#333}

@media(max-width:900px){
  .sticky{position:static}
  #colResults{order:-1}
  .split{gap:12px}
}
@media(max-width:560px){
  .appbar .btn{font-size:12px;padding:8px 9px}
  .stat.hero .v{font-size:27px}
}
@media print{
  .sticky{position:static!important}
  .app{padding:0}
  .build{border:1px solid #bbb}
  .diag{border:0;padding:0}
  .builds{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  .samplebar{display:none}
  .card{margin-bottom:6mm}
  .note{border-left:3px solid #000;background:#fff!important;border-top:1px solid #bbb;
    border-right:1px solid #bbb;border-bottom:1px solid #bbb}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr)}
  .heroes{display:grid;grid-template-columns:1fr 1fr}
  .pagebreak{break-before:page}
}
</style>
</head>
<body>
