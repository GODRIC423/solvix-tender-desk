<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Bestiary — Six Beasts, their Habitats &amp; Habits</title>
<meta name="description" content="An illustrated bestiary of six invented creatures — the Lanthorn Hart, the Inkwell Pike, the Thimble Owl, the Weatherglass Toad, the Bramblewyrm and the Belfry Moth — presented as an antique book whose leaves turn in three dimensions and whose woodcuts draw themselves in ink.">
<meta name="theme-color" content="#2B1F14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23EFE3C6'/%3E%3Cpath d='M14 12h36v40H14z' fill='none' stroke='%232B1F14' stroke-width='3'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='30' font-weight='bold' text-anchor='middle' fill='%23A62C2B'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#EFE3C6;--parch-2:#e3d4ad;--parch-3:#d3c297;--parch-4:#bfad81;
  --ink:#2B1F14;--ink-2:#3d2c1c;--ink-3:#1a120b;--ink-soft:rgba(43,31,20,.72);
  --rub:#A62C2B;--rub-deep:#6e1d1c;--rub-dark:#4a1414;
  --sc:'Alegreya SC','Alegreya',Georgia,'Times New Roman',serif;
  --tx:'Alegreya',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--parch);font-family:var(--tx);
  background:
    radial-gradient(ellipse 80% 60% at 50% 42%,rgba(120,85,45,.28),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,235,200,.025) 0 3px,transparent 3px 11px),
    repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 90px),
    linear-gradient(180deg,var(--ink-2),var(--ink) 40%,var(--ink-3));
  background-attachment:fixed;
  display:flex;flex-direction:column;overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--parch);outline-offset:4px;border-radius:2px}
.page :focus-visible{outline-color:var(--rub)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- running head ---------- */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.1rem clamp(1rem,4vw,3rem) .6rem;border-bottom:1px solid rgba(239,227,198,.16)}
.top p{margin:0}
.brand{font-family:var(--sc);font-size:clamp(1.05rem,1.6vw,1.3rem);letter-spacing:.14em;text-transform:lowercase}
.brand .fleur{color:var(--rub);filter:brightness(1.55);margin:0 .6em}
.brand .sub{font-family:var(--tx);font-style:italic;letter-spacing:0;text-transform:none;font-size:.92em;opacity:.8}
.hint{font-style:italic;font-size:.92rem;opacity:.7;white-space:nowrap}
@media(max-width:820px){.hint{display:none}.brand .sub{display:none}}

/* ---------- stage ---------- */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.3rem 0 .6rem}
.stage{
  --bw:max(300px,min(92vw,calc(1.5 * (100vh - 270px))));
  --pw:calc(var(--bw) / 2);
  position:relative;width:var(--bw);
}
.book{position:relative;width:100%;aspect-ratio:3/2;perspective:2600px;perspective-origin:50% 50%}
.board{position:absolute;inset:-14px -18px -22px -18px;border-radius:9px;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,200,180,.12),transparent 50%),
    repeating-linear-gradient(35deg,rgba(0,0,0,.08) 0 2px,transparent 2px 7px),
    linear-gradient(160deg,#8a2726,var(--rub-deep) 50%,var(--rub-dark));
  box-shadow:0 40px 80px rgba(0,0,0,.65),0 6px 14px rgba(0,0,0,.5),inset 0 0 0 1px rgba(239,227,198,.18),inset 0 0 0 6px rgba(0,0,0,.15)}
.edge{position:absolute;top:3px;bottom:-7px;background:var(--parch-3)}
.edge.l{left:-5px;right:50%;border-radius:5px 0 0 5px;box-shadow:-3px 3px 0 var(--parch-4),-2px 7px 0 var(--parch-3)}
.edge.r{left:50%;right:-5px;border-radius:0 5px 5px 0;box-shadow:3px 3px 0 var(--parch-4),2px 7px 0 var(--parch-3)}
.gutter{position:absolute;left:50%;top:0;bottom:0;width:9%;transform:translateX(-50%);pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(43,31,20,.22) 42%,rgba(43,31,20,.34) 50%,rgba(43,31,20,.22) 58%,transparent)}

.page,.face{
  position:absolute;top:0;bottom:0;width:50%;overflow:hidden;color:var(--ink);
  background:
    radial-gradient(ellipse at 18% 8%,rgba(255,250,238,.6),transparent 50%),
    radial-gradient(ellipse at 84% 92%,rgba(170,140,90,.22),transparent 55%),
    radial-gradient(circle at 60% 45%,rgba(200,170,120,.16),transparent 45%),
    radial-gradient(circle at 30% 70%,rgba(255,255,240,.25),transparent 35%),
    var(--parch);
  font-size:clamp(13.5px,calc(var(--pw) * .0335),18.5px);line-height:1.5;
}
.pl{left:0;border-radius:5px 0 0 5px;box-shadow:inset -30px 0 44px -26px rgba(43,31,20,.5)}
.pr{left:50%;border-radius:0 5px 5px 0;box-shadow:inset 30px 0 44px -26px rgba(43,31,20,.5)}
.page{z-index:1;cursor:pointer}
.page:has(.no-turn:hover){cursor:auto}

/* leaf */
.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:6;transform-style:preserve-3d;will-change:transform}
.leaf[hidden]{display:none}
.leaf .face{left:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.b{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(43,31,20,.55),rgba(43,31,20,.05) 60%,rgba(43,31,20,.25))}
.leaf.fwd{left:50%;transform-origin:left center;animation:turnFwd 1.25s cubic-bezier(.5,.02,.32,1) forwards}
.leaf.back{left:0;transform-origin:right center;animation:turnBack 1.25s cubic-bezier(.5,.02,.32,1) forwards}
.leaf.fwd .face.f::after,.leaf.back .face.b::after{animation:shade 1.25s ease-in-out forwards}
.leaf.fwd .face.b::after,.leaf.back .face.f::after{animation:shade2 1.25s ease-in-out forwards}
@keyframes turnFwd{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnBack{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
@keyframes shade{0%{opacity:0}45%{opacity:.7}100%{opacity:0}}
@keyframes shade2{0%{opacity:0}55%{opacity:.7}100%{opacity:0}}
.book.turning .pr::before,.book.turning .pl::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(43,31,20,.28),transparent 45%);opacity:0;animation:baseshade 1.25s ease-in-out forwards}
.book.turning .pl::before{background:linear-gradient(-90deg,rgba(43,31,20,.28),transparent 45%)}
@keyframes baseshade{0%{opacity:0}40%{opacity:1}100%{opacity:0}}

/* ---------- inside a page ---------- */
.in{position:absolute;inset:0;padding:calc(var(--pw) * .075) calc(var(--pw) * .085) calc(var(--pw) * .07);display:flex;flex-direction:column}
.pl .in,.face.lf .in{padding-left:calc(var(--pw) * .085);padding-right:calc(var(--pw) * .1)}
.pr .in,.face.rt .in{padding-left:calc(var(--pw) * .1)}
.runhead{display:flex;justify-content:space-between;font-family:var(--sc);font-size:.72em;letter-spacing:.14em;color:var(--ink-soft);border-bottom:1px solid rgba(43,31,20,.35);padding-bottom:.35em;margin-bottom:1.1em}
.runhead .fol{color:var(--rub)}
.in > p{margin:0 0 .75em}
h2,h3,.title{margin:0;font-weight:500}
h2.rub{font-family:var(--sc);font-size:1.95em;line-height:1.05;color:var(--rub);letter-spacing:.02em}
h3{font-family:var(--sc);font-size:.9em;letter-spacing:.18em;color:var(--rub);margin:.9em 0 .15em}
h3::before{content:"¶ ";opacity:.7}
.numeral{font-family:var(--sc);font-size:.78em;letter-spacing:.22em;color:var(--ink-soft);margin:0 0 .35em!important}
.latin{font-style:italic;color:var(--ink-soft);margin:.15em 0 .3em!important}
.dropcap::first-letter{font-family:var(--sc);float:left;font-size:3.05em;line-height:.78;padding:.08em .12em 0 0;color:var(--rub);font-weight:700}
.tail{margin-top:auto!important;font-style:italic;font-size:.92em;color:var(--ink-soft);border-top:1px solid rgba(43,31,20,.3);padding-top:.6em}
.tail b{font-family:var(--sc);font-style:normal;font-weight:500;color:var(--rub);letter-spacing:.06em}

figure{margin:0;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.frame{width:min(100%,calc(var(--pw) * .8));aspect-ratio:1;position:relative;padding:calc(var(--pw) * .02);border:2px solid var(--ink);outline:1px solid var(--ink);outline-offset:4px;background:radial-gradient(circle at 50% 45%,rgba(255,250,235,.35),transparent 70%)}
.frame svg{width:100%;height:100%;display:block}
figcaption{font-size:.92em;text-align:center;margin-top:1.2em;color:var(--ink-soft);font-style:italic}
figcaption b{font-family:var(--sc);font-style:normal;font-weight:500;color:var(--rub);letter-spacing:.06em}
.marg{font-size:.86em;font-style:italic;color:var(--ink-soft);text-align:center;margin:1em 0 0!important;position:relative}
.marg::before{content:"☞";font-style:normal;color:var(--rub);margin-right:.5em}

/* cuts */
.cut{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cut .h{stroke-width:1.5}
.cut .r{stroke:var(--rub)}
.cut .f{fill:var(--ink);stroke:none}
.cut .fr{fill:var(--rub);stroke:none}
.cut.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.35s cubic-bezier(.45,0,.25,1) forwards;animation-delay:calc(.4s + var(--i) * .17s)}
.cut.draw path.f,.cut.draw path.fr{stroke-dasharray:none;stroke-dashoffset:0;opacity:0;animation:appear .7s ease forwards;animation-delay:calc(.9s + var(--i) * .17s)}
.cut.blank path{opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes appear{to{opacity:1}}

/* cover + end matter */
.plate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7em}
.plate .orn{width:calc(var(--pw) * .34);color:var(--rub)}
.plate .fronts{width:min(58%,calc(var(--pw) * .5));height:auto}
.exlibris{font-family:var(--sc);letter-spacing:.3em;font-size:.85em;color:var(--rub)}
.plate p{max-width:26em;margin:0}
.plate .small{font-size:.9em;font-style:italic;color:var(--ink-soft)}
.titlepage{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:.5em}
.title{font-family:var(--sc);font-size:calc(var(--pw) * .17);line-height:.92;color:var(--rub);letter-spacing:.05em;font-weight:700}
.titlepage .being{font-family:var(--sc);letter-spacing:.24em;font-size:.8em;color:var(--ink-soft);margin:.4em 0 0}
.titlepage .account{max-width:22em;font-size:1.06em;margin:0}
.titlepage .account b{font-family:var(--sc);font-weight:500;letter-spacing:.1em;color:var(--rub)}
.rule{width:52%;height:auto;color:var(--ink)}
.titlepage .cuts{font-family:var(--sc);letter-spacing:.2em;font-size:.82em;margin:0}
.turnme{margin-top:1em;font-family:var(--sc);letter-spacing:.14em;color:var(--rub);font-size:.95em;border:1px solid var(--rub);padding:.5em 1.2em;transition:background .25s,color .25s}
.turnme:hover{background:var(--rub);color:var(--parch)}
.index{list-style:none;margin:0;padding:0}
.index li{margin:0 0 .45em}
.index button{display:flex;width:100%;align-items:baseline;gap:.5em;text-align:left;padding:.15em 0;border-bottom:1px dotted rgba(43,31,20,.5);transition:color .2s}
.index button:hover{color:var(--rub)}
.index .n{font-family:var(--sc);color:var(--rub);min-width:2.2em;letter-spacing:.05em}
.index .f{margin-left:auto;font-family:var(--sc);font-size:.85em;letter-spacing:.08em;color:var(--ink-soft)}
.index .w{font-style:italic;font-size:.9em;color:var(--ink-soft);display:block}
.finis{font-family:var(--sc);letter-spacing:.3em;color:var(--rub);text-align:center;margin-top:1.2em!important}
.colo .orn{width:calc(var(--pw) * .16);color:var(--rub);display:block;margin:.6em auto 0}

/* ---------- controls ---------- */
.turns{margin-top:1.9rem;display:flex;align-items:center;justify-content:center;gap:clamp(.8rem,3vw,2.2rem);width:var(--bw)}
.turn{font-family:var(--sc);letter-spacing:.14em;font-size:clamp(.82rem,1.1vw,.98rem);display:inline-flex;align-items:center;gap:.6em;padding:.55em 1.1em;border:1px solid rgba(239,227,198,.45);border-radius:2px;transition:border-color .25s,background .25s,color .25s,transform .25s}
.turn svg{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.turn:hover:not(:disabled){border-color:var(--parch);background:var(--parch);color:var(--ink);transform:translateY(-1px)}
.turn:active:not(:disabled){transform:translateY(0)}
.turn:disabled{opacity:.3;cursor:default}
.folio{margin:0;text-align:center;font-family:var(--sc);letter-spacing:.14em;font-size:clamp(.82rem,1.1vw,.98rem);min-width:12ch}
.folio i{display:block;font-family:var(--tx);letter-spacing:0;font-size:.95em;opacity:.75;margin-top:.15em}
.contents{display:flex;flex-wrap:wrap;justify-content:center;gap:.25rem .4rem;margin:1.2rem auto 0;padding:0;list-style:none;max-width:var(--bw)}
.contents button{font-family:var(--sc);font-size:clamp(.72rem,.95vw,.86rem);letter-spacing:.12em;padding:.35em .7em;opacity:.7;border-bottom:1px solid transparent;transition:opacity .2s,border-color .2s,color .2s}
.contents button:hover{opacity:1}
.contents button[aria-current="true"]{opacity:1;color:#f0b3ad;border-bottom-color:#f0b3ad}
.contents .sep{opacity:.35;align-self:center}
footer{text-align:center;padding:1rem 1rem 1.4rem;font-size:.85rem;font-style:italic;opacity:.6}
footer p{margin:0}

/* ---------- single-folio (mobile) ---------- */
@media(max-width:820px){
  .stage{--bw:max(280px,min(calc(100vw - 44px),calc(.72 * (100vh - 236px))));--pw:var(--bw)}
  .board{inset:-10px -14px -16px -14px}
  .turns{width:calc(100vw - 32px);gap:.6rem}
  .turn{padding:.55em .8em;white-space:nowrap}
  .turn span{display:none}
  .turn svg{width:1.6em;height:1.6em}
  .folio{flex:1}
  .book{aspect-ratio:5/7;perspective:1800px}
  .pl,.gutter,.edge.l{display:none}
  .pr{left:0;width:100%;border-radius:5px;box-shadow:inset 22px 0 30px -22px rgba(43,31,20,.5)}
  .pr .in{padding-left:calc(var(--pw) * .09)}
  .edge.r{left:-5px}
  .leaf{width:100%;left:0!important;transform-origin:left center!important}
  .leaf .face{border-radius:5px}
  .leaf.fwd{animation:turnFwdS .75s cubic-bezier(.55,0,.85,.45) forwards}
  .leaf.back{animation:turnBackS .75s cubic-bezier(.15,.55,.35,1) forwards}
  .leaf.fwd .face.f::after,.leaf.back .face.f::after{animation:shadeS .75s ease forwards}
  .leaf.back .face.f::after{animation-direction:reverse}
  @keyframes turnFwdS{0%{transform:rotateY(0);opacity:1}82%{opacity:1}100%{transform:rotateY(-92deg);opacity:0}}
  @keyframes turnBackS{0%{transform:rotateY(-92deg);opacity:0}18%{opacity:1}100%{transform:rotateY(0);opacity:1}}
  @keyframes shadeS{0%{opacity:0}100%{opacity:.8}}
  .frame{width:min(100%,calc(var(--pw) * .62))}
  .title{font-size:calc(var(--pw) * .15)}
  .turns{margin-top:1.6rem}
}
@media(max-height:560px) and (min-width:821px){.stage{--bw:max(300px,min(92vw,calc(1.5 * (100vh - 160px))))}.contents{display:none}}

@media(prefers-reduced-motion:reduce){
  .leaf,.leaf .face::after,.book.turning .pl::before,.book.turning .pr::before{animation:none!important}
  .cut.draw path,.cut.draw path.f,.cut.draw path.fr{animation:none;stroke-dashoffset:0;opacity:1}
  .turn,.turnme,.contents button,.index button{transition:none}
}
</style>
</head>
<body>
<header class="top">
  <p class="brand">A Bestiary<span class="fleur" aria-hidden="true">❧</span><span class="sub">Six Beasts, their Habitats &amp; Habits</span></p>
  <p class="hint">Turn the leaf with the arrows, or press → and ←</p>
</header>

<main>
  <h1 class="vh">A Bestiary: an illustrated account of six invented beasts</h1>
  <div class="stage">
    <div class="book" id="book">
      <div class="board" aria-hidden="true"></div>
      <div class="edge l" aria-hidden="true"></div>
      <div class="edge r" aria-hidden="true"></div>
      <section class="page pl" id="pl" aria-label="Left page"></section>
      <section class="page pr" id="pr" aria-label="Right page"></section>
      <div class="gutter" aria-hidden="true"></div>
      <div class="leaf" id="leaf" hidden aria-hidden="true">
        <div class="face f" id="ff"></div>
        <div class="face b" id="fb"></div>
      </div>
    </div>
  </div>

  <nav class="turns" aria-label="Turn the leaves">
    <button class="turn" id="prev" type="button" aria-label="Turn back a leaf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 7 12l8 7M7 12h13"/></svg><span>Turn back</span>
    </button>
    <p class="folio" id="folio" aria-live="polite"></p>
    <button class="turn" id="next" type="button" aria-label="Turn forward a leaf">
      <span>Turn the leaf</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 8 7-8 7M17 12H4"/></svg>
    </button>
  </nav>
  <ul class="contents" id="contents" aria-label="Contents"></ul>
</main>

<footer><p>Set in Alegreya and Alegreya SC upon parchment. The cuts are drawn afresh in ink each time their leaf is turned.</p></footer>

const ROM = ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi'];
const ORD = ['First','Second','Third','Fourth','Fifth','Sixth'];
const NUM = ['I','II','III','IV','V','VI'];
const fleuron = `<svg viewBox="0 0 120 40" class="rule" aria-hidden="true"><path d="M4 20h40M76 20h40M60 8c-8 6-8 18 0 24 8-6 8-18 0-24zM50 20h-6M76 20h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="60" cy="20" r="2.4" fill="currentColor"/></svg>`;
const sun = `<svg viewBox="0 0 320 320" class="cut draw fronts" role="img" aria-label="Woodcut device: a thorned serpent biting its own tail">${[
  ["M160 44 C226 44 276 94 276 160 C276 226 226 276 160 276 C94 276 44 226 44 160 C44 112 70 72 108 54"],
  ["M160 66 C212 66 254 108 254 160 C254 212 212 254 160 254 C108 254 66 212 66 160 C66 122 86 92 116 76"],
  ["M108 54 C96 46 82 52 84 64 C86 76 100 80 116 76"],
  ["M94 60 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0","f"],
  ["M84 64 l-14 2 m14 -2 l-10 8","r h"],
  ["M200 50 l4 -14 M236 70 l10 -10 M266 108 l14 -4 M276 160 l14 0 M266 212 l14 6 M236 250 l8 12 M200 272 l4 14 M160 276 l0 14 M120 270 l-4 14 M88 248 l-10 10 M58 208 l-14 4"],
  ["M172 55 l-4 12 M212 66 l-8 10 M244 96 l-10 8 M262 132 l-12 4 M264 186 l-12 -4 M248 226 l-10 -8 M214 256 l-8 -10 M176 266 l-4 -12 M136 264 l4 -12 M102 244 l8 -8 M76 210 l10 -4 M66 168 l12 0 M72 124 l12 4 M92 90 l10 8","h"],

].map((s,i)=>P(s[0],s[1]).replace('<path',`<path style="--i:${i}"`)).join('')}</svg>`;
const mark = `<svg viewBox="0 0 60 60" class="orn" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M30 6v48M14 20l16-14 16 14M20 54h20M30 30c-8 0-12-6-12-12M30 30c8 0 12-6 12-12"/></svg>`;

const cut = (b, drawn, n) => `<svg class="cut ${drawn ? 'draw' : 'blank'}" viewBox="0 0 320 320" role="img" aria-label="Woodcut of the ${b.name}">${b.svg.map((s, i) => P(s[0], s[1]).replace('<path', `<path style="--i:${i}"`)).join('')}</svg>`;

function render(i, drawn) {
  const fol = ROM[i];
  if (i === 0) return `<div class="in"><div class="runhead"><span>Frontispiece</span><span class="fol">${fol}</span></div>
    <div class="plate">${sun}<p class="exlibris">Nemo vidit · omnes iurant</p>
    <p>This volume belongs to whoever is holding it, and to nobody else for as long as they are.</p>
    <p class="small">Bound in calf the colour of rubric. The boards are a little warped from a damp winter, and the leaves, when turned, make the sound of a bird settling.</p></div></div>`;
  if (i === 1) return `<div class="in"><div class="runhead"><span class="fol">${fol}</span><span>Title</span></div>
    <div class="titlepage"><h2 class="title">A<br>Bestiary</h2>
    <p class="being">being a faithful account of</p>
    <p class="account"><b>Six Beasts</b> not elsewhere described, with their <b>Habitats</b> and <b>Habits</b>, set down from the testimony of shepherds, sextons, seamstresses and other reliable persons.</p>
    ${fleuron}<p class="cuts">Illustrated with Cuts</p>
    <button class="turnme no-turn" type="button" data-go="2">Turn the leaf &#9758;</button></div></div>`;
  if (i === 14) return `<div class="in"><div class="runhead"><span>Index of Beasts</span><span class="fol">${fol}</span></div>
    <h2 class="rub">Index</h2><p class="latin">wherein the six beasts are found again</p>
    <ul class="index">${beasts.map((b, k) => `<li><button type="button" class="no-turn" data-go="${2 + k * 2}"><span class="n">${NUM[k]}.</span><span>The ${b.name}<span class="w">${b.latin}</span></span><span class="f">fol. ${ROM[2 + k * 2]}</span></button></li>`).join('')}</ul></div>`;
  if (i === 15) return `<div class="in colo"><div class="runhead"><span class="fol">${fol}</span><span>Colophon</span></div>
    <h2 class="rub">Colophon</h2>
    <p class="dropcap">Here ends the Bestiary. It was set in Alegreya, with its small capitals, upon parchment the colour of old cream, and rubricated in red. The six cuts are not printed but are drawn afresh in ink every time their leaf is turned, so that no two readings of this book are quite the same.</p>
    <p>Of the beasts herein the compiler can say only that none was seen by him, all were sworn to by others, and the reader must weigh the witnesses as he thinks fit.</p>
    <p class="finis">Finis</p>${mark}</div>`;
  const k = Math.floor((i - 2) / 2), b = beasts[k];
  if (i % 2 === 0) return `<div class="in"><div class="runhead"><span>Of the ${b.name}</span><span class="fol">${fol}</span></div>
    <figure><div class="frame">${cut(b, drawn)}</div><figcaption><b>Fig. ${NUM[k]}.</b> The ${b.name}, cut from the life.</figcaption></figure>
    <p class="marg">${b.note}</p></div>`;
  return `<div class="in"><div class="runhead"><span class="fol">${fol}</span><span>Habitats &amp; Habits</span></div>
    <p class="numeral">The ${ORD[k]} Beast</p><h2 class="rub">The ${b.name}</h2><p class="latin">${b.latin}</p>
    <h3>Habitat</h3><p>${b.habitat}</p>
    <h3>Habits</h3><p class="dropcap">${b.habits}</p>
    <p class="tail"><b>Nota.</b> ${b.tail}</p></div>`;
}

const $ = id => document.getElementById(id);
const book = $('book'), pl = $('pl'), pr = $('pr'), leaf = $('leaf'), ff = $('ff'), fb = $('fb');
const prev = $('prev'), next = $('next'), folio = $('folio'), contents = $('contents');
const mqSingle = matchMedia('(max-width: 820px)');
const mqReduce = matchMedia('(prefers-reduced-motion: reduce)');
const N = 16;
let cur = matchMedia('(max-width: 820px)').matches ? 1 : 0, turning = false;
const single = () => mqSingle.matches;
const step = () => single() ? 1 : 2;

contents.innerHTML = beasts.map((b, k) => `<li><button type="button" data-go="${2 + k * 2}">${NUM[k]}. ${b.short}</button></li>`).join('<li class="sep" aria-hidden="true">·</li>');

function label(i) {
  if (i <= 1) return 'the Title';
  if (i >= 14) return 'the Index &amp; Colophon';
  return 'The ' + beasts[Math.floor((i - 2) / 2)].name;
}
function show() {
  if (single()) { pr.innerHTML = render(cur, true); pl.innerHTML = ''; }
  else { pl.innerHTML = render(cur, true); pr.innerHTML = render(cur + 1, true); }
  const last = single() ? cur : cur + 1;
  folio.innerHTML = `Folio ${ROM[cur]}${last !== cur ? '–' + ROM[last] : ''}<i>${label(cur)}</i>`;
  prev.disabled = cur <= 0;
  next.disabled = cur + step() >= N;
  const k = (cur >= 2 && cur < 14) ? Math.floor((cur - 2) / 2) : -1;
  contents.querySelectorAll('button').forEach((btn, j) => btn.setAttribute('aria-current', j === k ? 'true' : 'false'));
}
function turnTo(target) {
  if (turning) return;
  if (!single()) target -= target % 2;
  target = Math.max(0, Math.min(N - 1, target));
  if (target === cur) return;
  if (mqReduce.matches) { cur = target; show(); return; }
  const dir = target > cur ? 1 : -1;
  turning = true; book.classList.add('turning');
  ff.className = 'face f'; fb.className = 'face b';
  if (!single()) {
    if (dir > 0) {
      leaf.className = 'leaf fwd'; ff.classList.add('rt'); fb.classList.add('lf');
      ff.innerHTML = render(cur + 1, false);
      fb.innerHTML = render(target, false);
      pr.innerHTML = render(target + 1, true);
    } else {
      leaf.className = 'leaf back'; ff.classList.add('lf'); fb.classList.add('rt');
      ff.innerHTML = render(cur, false);
      fb.innerHTML = render(target + 1, false);
      pl.innerHTML = render(target, true);
    }
  } else {
    fb.innerHTML = '';
    if (dir > 0) { leaf.className = 'leaf fwd'; ff.innerHTML = render(cur, false); pr.innerHTML = render(target, true); }
    else { leaf.className = 'leaf back'; ff.innerHTML = render(target, false); }
  }
  leaf.hidden = false;
  const done = () => {
    leaf.removeEventListener('animationend', done);
    cur = target; leaf.hidden = true; leaf.className = 'leaf';
    book.classList.remove('turning'); turning = false; show();
    if (single()) book.scrollIntoView({ block: 'nearest' });
  };
  leaf.addEventListener('animationend', done);
  // safety net if the animation never fires (e.g. display changes mid-turn)
  setTimeout(() => { if (turning) done(); }, 1600);
}
prev.addEventListener('click', () => turnTo(cur - step()));
next.addEventListener('click', () => turnTo(cur + step()));
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { e.stopPropagation(); turnTo(+go.dataset.go); }
});
pr.addEventListener('click', e => { if (!e.target.closest('.no-turn')) turnTo(cur + step()); });
pl.addEventListener('click', e => { if (!e.target.closest('.no-turn')) turnTo(cur - step()); });
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); turnTo(cur + step()); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); turnTo(cur - step()); }
  else if (e.key === 'Home') { e.preventDefault(); turnTo(0); }
  else if (e.key === 'End') { e.preventDefault(); turnTo(N - 1); }
});
mqSingle.addEventListener('change', () => { if (!single()) cur -= cur % 2; show(); });
show();
})();
